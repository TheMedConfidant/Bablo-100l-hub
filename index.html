ich is a text-entry device?","o":["Keyboard","Printer","Projector","Monitor"],"a":0,"e":"Keyboard is listed under text entry devices."},{"i":"COS-1MwlCEc9-030","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which of the following is a positioning/pointing device?","o":["TouchPad","Printer","Projector","SSD"],"a":0,"e":"TouchPad is listed among positioning, pointing devices and drawing devices."},{"i":"COS-1MwlCEc9-031","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which device is used for drawing according to the lecture?","o":["Stylus and light pen","Printer","Monitor","Speaker"],"a":0,"e":"Stylus and light pen are listed in that category."},{"i":"COS-1MwlCEc9-032","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which of the following is an example of a sensor listed in the lecture?","o":["Temperature sensor","Keyboard sensor","Printer sensor","Monitor sensor"],"a":0,"e":"Temperature is explicitly listed among sensor applications."},{"i":"COS-1MwlCEc9-033","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which sensor-related quantity is NOT listed in the lecture?","o":["Blood pressure","Temperature","Pressure","Movement"],"a":0,"e":"The lecture lists temperature, pressure, movement, location, weight and light; blood pressure is not listed."},{"i":"COS-1MwlCEc9-034","c":"COS","u":"Introduction to Computing","s":"mcq","q":"What does CPU stand for?","o":["Central Processing Unit","Computer Peripheral Unit","Central Programming Utility","Core Processing User"],"a":0,"e":"CPU stands for Central Processing Unit."},{"i":"COS-1MwlCEc9-035","c":"COS","u":"Introduction to Computing","s":"mcq","q":"The CPU is described as the ____ of the computer.","o":["brain","display","storage cabinet","input surface"],"a":0,"e":"The lecture calls the CPU the brain of the computer."},{"i":"COS-1MwlCEc9-036","c":"COS","u":"Introduction to Computing","s":"mcq","q":"What is the first stage of the fetch-execute cycle?","o":["Fetch","Execute","Store","Print ef","ingredients","counter space","the finished dish"],"a":0,"e":"The CPU is compared to the chef because it processes and cooks the input."},{"i":"COS-1MwlCEc9-051","c":"COS","u":"Introduction to Computing","s":"mcq","q":"In the kitchen analogy, memory is compared to ____.","o":["counter space","the chef","ingredients","the finished dish"],"a":0,"e":"Memory is compared to counter space as temporary holding space."},{"i":"COS-1MwlCEc9-052","c":"COS","u":"Introduction to Computing","s":"mcq","q":"In the kitchen analogy, output devices are compared to ____.","o":["the finished dish","ingredients","the chef","counter space"],"a":0,"e":"Output is compared to the finished dish served to the user."},{"i":"COS-1MwlCEc9-053","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which component is shown on the lecture's motherboard diagram?","o":["BIOS chip","Printer cartridge","Projector lens","Keyboard switch"],"a":0,"e":"The motherboard diagram includes a BIOS chip."},{"i":"COS-1MwlCEc9-054","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which of the following is also labelled on the motherboard diagram?","o":["PCI slots","Paper tray","Camera lens","Touch panel"],"a":0,"e":"PCI slots are labelled in the motherboard diagram."},{"i":"COS-1MwlCEc9-055","c":"COS","u":"Introduction to Computing","s":"mcq","q":"What does the lecture identify as the basic cycle underlying computation?","o":["Input, processing, memory/storage and output","Internet, email, browser and cloud","Keyboard, mouse, printer and projector","CPU, monitor, speaker and camera"],"a":0,"e":"The five functional units are presented as the core components: input, processing, memory, storage and output."},{"i":"COS-1MwlCEc9-056","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which functional unit is represented by the CPU?","o":["Processing","Input","Output","Storage"],"a":0,"e":"The CPU represents the processing function."},{"i":"COS-1MwlCEc9-057","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which statement best connects RAM and the fetch stage?","o":["The Control Unit fetches the next instruction from RAM","RAM prints the instruction","RAM performs the calculation","RAM displays the result"],"a":0,"e":"The lecture explicitly states that the Control Unit fetches the next instruction from RAM."},{"i":"COS-1MwlCEc9-058","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which sequence matches the lecture's CPU workflow?","o":["Fetch → Execute → Store","Store → Fetch → Execute","Execute → Store → Fetch","Input → Print → Delete"],"a":0,"e":"The lecture presents the fetch-execute-store sequence."},{"i":"COS-1MwlCEc9-059","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which development is associated with the 2010s–Future section?","o":["Cloud computing and AI","Abacus and Pascaline","Mainframes and vacuum tubes","IBM PC and Apple II"],"a":0,"e":"The lecture places cloud computing and AI in the 2010s–Future section."},{"i":"COS-1MwlCEc9-060","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which of the following best represents the connectivity trend in the lecture?","o":["From isolated machines to global networks","From global networks to isolated machines","From wireless devices to abacuses","From mobile devices to vacuum tubes"],"a":0,"e":"The impact summary describes connectivity as moving from isolated machines to global networks."},{"i":"CHM-1OLj7ADT-001","c":"CHM","u":"Module 2: Subshells, configuration & filling","s":"mcq","q":"What is the maximum number of electrons a p subshell can hold?","o":["6","2","3","10"],"a":0,"e":"A p subshell has 3 orbitals and each orbital holds at most 2 electrons (Pauli): 3 × 2 = 6. 3 is the number of orbitals, not electrons."},{"i":"CHM-1OLj7ADT-002","c":"CHM","u":"Module 2: Subshells, configuration & filling","s":"mcq","q":"How many orbitals make up a d subshell?","o":["5","3","1","10"],"a":0,"e":"d has 5 orbitals × 2 electrons = 10. Students often confuse 10 (electrons) with the number of orbitals."},{"i":"CHM-1OLj7ADT-003","c":"CHM","u":"Module 2: Subshells, configuration & filling","s":"mcq","q":"Which capacity list is correct for s, p and d?","o":["2, 6, 10","2, 6, 8","1, 3, 5","2, 8, 18"],"a":0,"e":"Orbitals per subshell are 1, 3, 5 and each takes 2 electrons, giving 2, 6, 10. 1, 3, 5 counts orbitals; 2, 8, 18 are shell capacities."},{"i":"CHM-1OLj7ADT-004","c":"CHM","u":"Module 2: Subshells, configuration & filling","s":"mcq","q":"Which letter denotes the shell with principal number n = 3?","o":["M","L","N","K"],"a":0,"e":"K=1, L=2, M=3, N=4, O=5, P=6, Q=7."},{"i":"CHM-1OLj7ADT-005","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"The Aufbau principle states that electrons","o":["fill the lowest available energy level first","pair up before filling empty orbitals","must have identical spins","fill 3d before 4s"],"a":0,"e":"Aufbau controls the ORDER of filling: lowest energy first. Pairing is Hund's territory; spin is Pauli's."},{"i":"CHM-1OLj7ADT-006","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"Which arrangement in a single orbital violates the Pauli exclusion principle?","o":["Two electrons with the same spin direction","Two electrons with opposite spins","One electron only","An empty orbital"],"a":0,"e":"Pauli: an orbital holds a maximum of two electrons and they must have opposite spins."},{"i":"CHM-1OLj7ADT-007","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"Three electrons occupy the three 2p orbitals of nitrogen. According to Hund's rule they","o":["occupy separate orbitals singly first","pair in one orbital first","all sit in one orbital","fill 3s first"],"a":0,"e":"Equal-energy orbitals are filled singly before any pairing occurs, so N (2p3) has 3 unpaired electrons."},{"i":"CHM-1OLj7ADT-008","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"A student draws carbon (2p2) with both 2p electrons paired in one p orbital and two p orbitals empty. Which rule is broken?","o":["Hund's rule","Aufbau principle","Pauli exclusion principle","None"],"a":0,"e":"The pair is legal under Pauli (opposite spins) but pairing before spreading singly breaks Hund's rule. The trap is picking Pauli."},{"i":"CHM-1OLj7ADT-009","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"Which student answer is wrong: 'Boron is 1s2 2s3'?","o":["2s can hold only 2 electrons, so 2s3 is impossible","Boron has too few electrons","1s should hold 3","Nothing is wrong"],"a":0,"e":"An s subshell has one orbital and holds at most 2 electrons. Boron is 1s2 2s2 2p1."},{"i":"CHM-1OLj7ADT-010","c":"CHM","u":"Module 2: Subshells, configuration & filling","s":"mcq","q":"Which subshell is filled immediately after 3p in the supplied sequence?","o":["4s","3d","4p","5s"],"a":0,"e":"The sequence is 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s."},{"i":"CHM-1OLj7ADT-011","c":"CHM","u":"Module 2: Subshells, configuration & filling","s":"mcq","q":"Which is the correct filling sequence?","o":["1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p","1s, 2s, 2p, 3s, 3p, 3d, 4s, 4p","1s, 2s, 3s, 2p, 3p, 4s, 3d","1s, 2p, 2s, 3s, 3p, 4s, 4p"],"a":0,"e":"The trap is writing 3d before 4s just because 3 \u003c 4. Filling follows energy, not shell number alone."},{"i":"CHM-1OLj7ADT-012","c":"CHM","u":"Module 2: Subshells, configuration & filling","s":"mcq","q":"Why is 4s filled before 3d?","o":["4s is at a lower energy than 3d at this stage, so Aufbau fills it first","4s is closer to the nucleus than 3s","3d can hold no electrons","Pauli forbids 3d first"],"a":0,"e":"Teaching expansion: in these atoms 4s lies lower in energy than 3d, so Aufbau (lowest first) fills 4s first. K and Ca show this: their last electrons go into 4s."},{"i":"CHM-1OLj7ADT-013","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"In the periodic table, a group is","o":["a vertical column of elements with similar properties","a horizontal row","all elements with the same mass","the f-block only"],"a":0,"e":"Group = vertical (family). Period = horizontal."},{"i":"CHM-1OLj7ADT-014","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Elements in the same period have the same","o":["number of shells","number of outer electrons","chemical properties","atomic mass"],"a":0,"e":"Same period = same number of shells. Same group = same number of outermost electrons."},{"i":"CHM-1OLj7ADT-015","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Groups IA and IIA make up which block?","o":["s-block","p-block","d-block","f-block"],"a":0,"e":"Their outer electrons fill an s subshell."},{"i":"CHM-1OLj7ADT-016","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Groups IIIA to VIIIA are called the","o":["p-block elements","s-block elements","transition metals","inner transition metals"],"a":0,"e":"Their outer electrons fill p subshells."},{"i":"CHM-1OLj7ADT-017","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Main-group elements are","o":["the s-block and p-block elements","the d-block elements","the lanthanides","only noble gases"],"a":0,"e":"s + p blocks = main group. The B-groups are transition metals."},{"i":"CHM-1OLj7ADT-018","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Transition metals (d-block) are found in","o":["Groups IIIB to IIB","Groups IA and IIA","Groups IIIA to VIIIA","the lower two rows"],"a":0,"e":"A = main group, B = transition. The lower two rows are the f-block."},{"i":"CHM-1OLj7ADT-019","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"The lanthanides are","o":["the first row of 14 f-block elements (4f)","the second row of 14 f-block elements (5f)","the noble gases","the alkali metals"],"a":0,"e":"Lanthanides = 4f row; the next 14 are the 5f row. Together they are the inner transition (rare earth) metals in the note."},{"i":"CHM-1OLj7ADT-020","c":"CHM","u":"Module 2: Periods & periodicity","s":"mcq","q":"How many periods does the modern periodic table have, and what do they correspond to?","o":["7, the shells K to Q","8, the subshells","18, the groups","4, the blocks"],"a":0,"e":"Seven periods = seven shells K, L, M, N, O, P, Q."},{"i":"CHM-1OLj7ADT-021","c":"CHM","u":"Module 2: Periods & periodicity","s":"mcq","q":"How many elements are in periods 1, 2 and 3 respectively?","o":["2, 8, 8","2, 8, 18","8, 8, 18","2, 2, 8"],"a":0,"e":"Periods 1 to 3 are the short periods. The trap is guessing 18 for period 3; that belongs to periods 4 and 5."},{"i":"CHM-1OLj7ADT-022","c":"CHM","u":"Module 2: Periods & periodicity","s":"mcq","q":"Periods 4, 5 and 6 contain how many elements respectively?","o":["18, 18, 32","8, 18, 18","18, 32, 32","18, 18, 18"],"a":0,"e":"These are the long periods: 18, 18, 32. Period 7 is described as incomplete in the note."},{"i":"CHM-1OLj7ADT-023","c":"CHM","u":"Module 2: Periods & periodicity","s":"mcq","q":"Which noble gas has a duplet (two-electron) outer shell?","o":["Helium","Neon","Argon","Hydrogen"],"a":0,"e":"He is 1s2. The first shell holds only 2 electrons. Other noble gases have octets."},{"i":"CHM-1OLj7ADT-024","c":"CHM","u":"Module 2: Periods & periodicity","s":"mcq","q":"Assertion: Noble gases are relatively unreactive. Reason: their outermost shells are filled. Choose the best answer.","o":["Both true; the reason explains the assertion","Both true; the reason does not explain it","Assertion true, reason false","Assertion false, reason true"],"a":0,"e":"Filled outer shells (duplet or octet) give stability, which is why noble gases are not very reactive."},{"i":"CHM-1OLj7ADT-025","c":"CHM","u":"Module 2: Periods & periodicity","s":"mcq","q":"Periodicity means","o":["regular repeating trends in properties when elements are arranged by atomic number","that all elements have the same properties","arranging elements by alphabetical order","that periods are vertical"],"a":0,"e":"Modern table: arrangement by atomic number gives periodic patterns."},{"i":"CHM-1OLj7ADT-026","c":"CHM","u":"Module 2: First 20","s":"mcq","q":"An element has 1s2 2s2 2p6 3s2 3p4. Identify it, its block and period.","o":["Sulphur, p-block, period 3","Oxygen, p-block, period 2","Sulphur, s-block, period 3","Chlorine, p-block, period 3"],"a":0,"e":"16 electrons = S. The last electrons enter 3p (p-block); highest shell n = 3 (period 3)."},{"i":"CHM-1OLj7ADT-027","c":"CHM","u":"Module 2: First 20","s":"mcq","q":"In the supplied note, sodium is written as 1s2 2s2 2p5 3s1. What is the correct statement?","o":["It totals 11 electrons but 2p should be 2p6 before 3s","It is correct","It should be 1s2 2s2 2p6 3s2","It should have 4s1"],"a":0,"e":"The note's line has a typo: 2p holds 6 when full. Correct Na = 1s2 2s2 2p6 3s1. Always check the total AND the capacities.","f":"option text says the line 'totals 11 electrons' but 1s2 2s2 2p5 3s1 totals 10; also depends on a 'supplied note' students may not see, and the sibling Electron Configuration quiz lists Na cor"},{"i":"CHM-1OLj7ADT-028","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"Match correctly: which pairing is right?","o":["Aufbau: lowest energy first; Hund: singly before pairing","Aufbau: singly before pairing; Hund: lowest energy first","Pauli: lowest energy first; Aufbau: opposite spins","Hund: max 2 per orbital"],"a":0,"e":"Aufbau = order; Pauli = max 2, opposite spins; Hund = singly before pairing."},{"i":"CHM-1OLj7ADT-029","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Where are the f-block elements drawn in the table?","o":["In the lower two rows","Above the s-block","Inside Group IA","Beside the noble gases"],"a":0,"e":"The note places them in the lower two rows, belonging between La and Hf (4f) and between Ac and Rf (5f)."},{"i":"CHM-1OLj7ADT-030","c":"CHM","u":"Module 2: Periods & periodicity","s":"mcq","q":"What is the first and last element of each period (except period 1 details)?","o":["An alkali metal first, a noble gas last","A noble gas first, an alkali metal last","A halogen first, a transition metal last","A transition metal first and last"],"a":0,"e":"Per the note: the first element of each period is an alkali metal and the last is a noble gas."},{"i":"CHM-1OLj7ADT-031","c":"CHM","u":"Module 2: First 20","s":"mcq","q":"Which is the ground-state electron configuration of Hydrogen (Z = 1)?","o":["1s1","1s2","1s2 2s2 2p2","1s2 2s2 2p6 3s1"],"a":0,"e":"Hydrogen has 1 electrons. Fill in order: 1s1. Each wrong option has a different total number of electrons."},{"i":"CHM-1OLj7ADT-032","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Using its configuration (1s1), in which period is Hydrogen?","o":["Period 1","Period 2","Period 3","Period 4"],"a":0,"e":"The highest shell number occupied is 1, so Hydrogen is in period 1. Period = number of shells."},{"i":"CHM-1OLj7ADT-033","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"How many unpaired electrons does a ground-state Hydrogen atom have?","o":["1","0","2","3"],"a":0,"e":"Configuration 1s1. Applying Hund's rule to the last partly filled subshell gives 1 unpaired electron(s)."},{"i":"CHM-1OLj7ADT-034","c":"CHM","u":"Module 2: First 20","s":"mcq","q":"Which is the ground-state electron configuration of Helium (Z = 2)?","o":["1s2","1s2 2s1","1s2 2s2 2p3","1s2 2s2 2p6 3s2"],"a":0,"e":"Helium has 2 electrons. Fill in order: 1s2. Each wrong option has a different total number of electrons."},{"i":"CHM-1OLj7ADT-035","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Using its configuration (1s2), in which period is Helium?","o":["Period 1","Period 2","Period 3","Period 4"],"a":0,"e":"The highest shell number occupied is 1, so Helium is in period 1. Period = number of shells."},{"i":"CHM-1OLj7ADT-036","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"How many unpaired electrons does a ground-state Helium atom have?","o":["0","1","2","3"],"a":0,"e":"Configuration 1s2. Applying Hund's rule to the last partly filled subshell gives 0 unpaired electron(s)."},{"i":"CHM-1OLj7ADT-037","c":"CHM","u":"Module 2: First 20","s":"mcq","q":"Which is the ground-state electron configuration of Lithium (Z = 3)?","o":["1s2 2s1","1s2 2s2","1s2 2s2 2p4","1s2 2s2 2p6 3s2 3p1"],"a":0,"e":"Lithium has 3 electrons. Fill in order: 1s2 2s1. Each wrong option has a different total number of electrons."},{"i":"CHM-1OLj7ADT-038","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Using its configuration (1s2 2s1), in which period is Lithium?","o":["Period 2","Period 1","Period 3","Period 4"],"a":0,"e":"The highest shell number occupied is 2, so Lithium is in period 2. Period = number of shells."},{"i":"CHM-1OLj7ADT-039","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"How many unpaired electrons does a ground-state Lithium atom have?","o":["1","0","2","3"],"a":0,"e":"Configuration 1s2 2s1. Applying Hund's rule to the last partly filled subshell gives 1 unpaired electron(s)."},{"i":"CHM-1OLj7ADT-040","c":"CHM","u":"Module 2: First 20","s":"mcq","q":"Which is the ground-state electron configuration of Beryllium (Z = 4)?","o":["1s2 2s2","1s2 2s2 2p1","1s2 2s2 2p5","1s2 2s2 2p6 3s2 3p2"],"a":0,"e":"Beryllium has 4 electrons. Fill in order: 1s2 2s2. Each wrong option has a different total number of electrons."},{"i":"CHM-1OLj7ADT-041","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Using its configuration (1s2 2s2), in which period is Beryllium?","o":["Period 2","Period 1","Period 3","Period 4"],"a":0,"e":"The highest shell number occupied is 2, so Beryllium is in period 2. Period = number of shells."},{"i":"CHM-1OLj7ADT-042","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"How many unpaired electrons does a ground-state Beryllium atom have?","o":["0","1","2","3"],"a":0,"e":"Configuration 1s2 2s2. Applying Hund's rule to the last partly filled subshell gives 0 unpaired electron(s)."},{"i":"CHM-1OLj7ADT-043","c":"CHM","u":"Module 2: First 20","s":"mcq","q":"Which is the ground-state electron configuration of Boron (Z = 5)?","o":["1s2 2s2 2p1","1s2 2s2 2p2","1s2 2s2 2p6","1s2 2s2 2p6 3s2 3p3"],"a":0,"e":"Boron has 5 electrons. Fill in order: 1s2 2s2 2p1. Each wrong option has a different total number of electrons."},{"i":"CHM-1OLj7ADT-044","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Using its configuration (1s2 2s2 2p1), in which period is Boron?","o":["Period 2","Period 1","Period 3","Period 4"],"a":0,"e":"The highest shell number occupied is 2, so Boron is in period 2. Period = number of shells."},{"i":"CHM-1OLj7ADT-045","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"How many unpaired electrons does a ground-state Boron atom have?","o":["1","0","2","3"],"a":0,"e":"Configuration 1s2 2s2 2p1. Applying Hund's rule to the last partly filled subshell gives 1 unpaired electron(s)."},{"i":"CHM-1OLj7ADT-046","c":"CHM","u":"Module 2: First 20","s":"mcq","q":"Which is the ground-state electron configuration of Carbon (Z = 6)?","o":["1s2 2s2 2p2","1s2 2s2 2p3","1s2 2s2 2p6 3s1","1s2 2s2 2p6 3s2 3p4"],"a":0,"e":"Carbon has 6 electrons. Fill in order: 1s2 2s2 2p2. Each wrong option has a different total number of electrons."},{"i":"CHM-1OLj7ADT-047","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Using its configuration (1s2 2s2 2p2), in which period is Carbon?","o":["Period 2","Period 1","Period 3","Period 4"],"a":0,"e":"The highest shell number occupied is 2, so Carbon is in period 2. Period = number of shells."},{"i":"CHM-1OLj7ADT-048","c":"CHM","u":"Module 2: Rules","s":"mcq","q":"How many unpaired electrons does a ground-state Carbon atom have?","o":["2","0","1","3"],"a":0,"e":"Configuration 1s2 2s2 2p2. Applying Hund's rule to the last partly filled subshell gives 2 unpaired electron(s)."},{"i":"CHM-1OLj7ADT-049","c":"CHM","u":"Module 2: First 20","s":"mcq","q":"Which is the ground-state electron configuration of Nitrogen (Z = 7)?","o":["1s2 2s2 2p3","1s2 2s2 2p4","1s2 2s2 2p6 3s2","1s2 2s2 2p6 3s2 3p5"],"a":0,"e":"Nitrogen has 7 electrons. Fill in order: 1s2 2s2 2p3. Each wrong option has a different total number of electrons."},{"i":"CHM-1OLj7ADT-050","c":"CHM","u":"Module 2: Periodic table","s":"mcq","q":"Using its configuration (1s2 2s2 2p3), in which period is Nitrogen?","o":["Period 2","Period 1","Period 3","Period 4"],"a":0,"e":"The highest nner transition or rare earth metals."},{"i":"CHM-1Qwlmvpf-034","c":"CHM","u":"Electron configuration: Periodic Table Organization","s":"mcq","q":"What does a period represent?","o":["Same number of shells","Same atomic mass","Same orbital shape","Same number of neutrons"],"a":0,"e":"The note defines a period by the same number of shells."},{"i":"CHM-1Qwlmvpf-035","c":"CHM","u":"Electron configuration: Periodic Table Organization","s":"mcq","q":"What does a group/family have in common according to the note?","o":["Same number of shells only","Similar properties and same number of outermost electrons","Same mass","Same number of orbitals"],"a":1,"e":"That is the stated group description."},{"i":"AGR-1WgnJIPG-001","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"Cattle refers to the entire ______ species.","o":["Ovine","Bovine","Porcine","Caprine"],"a":1,"e":"Cattle are the bovine species. Sheep are ovine, goats caprine and pigs porcine."},{"i":"AGR-1WgnJIPG-002","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A mature female cattle that has had one or more parturitions is called a ______.","o":["Heifer","Cow","Calf","Doe"],"a":1,"e":"A cow is a mature female that has calved at least once."},{"i":"AGR-1WgnJIPG-003","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A female cattle that has not produced any offspring is called a ______.","o":["Heifer","Cow","Ewe","Gilt"],"a":0,"e":"A heifer is a young female that has not yet calved. After her first calf she becomes a cow."},{"i":"AGR-1WgnJIPG-004","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A mature male cattle is called a ______.","o":["Bull","Steer","Stag","Calf"],"a":0,"e":"A bull is an entire (uncastrated) mature male, kept for breeding."},{"i":"AGR-1WgnJIPG-005","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A young cattle of either sex under one year old is a ______.","o":["Calf","Bull","Heifer","Steer"],"a":0,"e":"Calf is the word for young cattle of either sex under one year."},{"i":"AGR-1WgnJIPG-006","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"The act of giving birth in cattle is called ______.","o":["Lambing","Kidding","Calving","Farrowing"],"a":2,"e":"Each species has its own birth word: calving (cattle), lambing (sheep), kidding (goats), farrowing (pigs), kindling (rabbits)."},{"i":"AGR-1WgnJIPG-007","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A male cattle castrated at an early age is called a ______.","o":["Stag","Steer","Bull","Calf"],"a":1,"e":"A steer is a male castrated young, usually raised for beef."},{"i":"AGR-1WgnJIPG-008","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A male cattle castrated after reaching sexual maturity is called a ______.","o":["Stag","Steer","Bull calf","Heifer"],"a":0,"e":"A stag is castrated after maturity, so it keeps some male body features that a steer lacks."},{"i":"AGR-1WgnJIPG-009","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"Sheep refers to the entire ______ species.","o":["Caprine","Ovine","Bovine","Porcine"],"a":1,"e":"Sheep are the ovine species. Caprine is the word for goats."},{"i":"AGR-1WgnJIPG-010","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A mature male sheep is called a ______.","o":["Ram","Ewe","Wether","Lamb"],"a":0,"e":"A ram is an entire mature male sheep. The mature female is a ewe."},{"i":"AGR-1WgnJIPG-011","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"The act of giving birth in sheep is called ______.","o":["Kidding","Calving","Lambing","Farrowing"],"a":2,"e":"Lambing is birth in sheep. Kidding is for goats."},{"i":"AGR-1WgnJIPG-012","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A male sheep castrated at an early age is called a ______.","o":["Ram","Wether","Lamb","Ewe"],"a":1,"e":"A wether is a male sheep castrated young. A ram is left entire."},{"i":"AGR-1WgnJIPG-013","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"The wool of a single sheep is called ______.","o":["Fleece","Litter","Roughage","Udder"],"a":0,"e":"Fleece is the wool coat taken from one sheep at shearing."},{"i":"AGR-1WgnJIPG-014","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A mature male goat is called a ______.","o":["Doe","Kid","Buck/Billy","Nanny"],"a":2,"e":"A mature male goat is a buck or billy. The mature female is a doe or nanny."},{"i":"AGR-1WgnJIPG-015","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A young or sexually immature goat of either sex is called a ______.","o":["Kid","Doe","Buck","Sow"],"a":0,"e":"A kid is a young goat of either sex, before sexual maturity."},{"i":"AGR-1WgnJIPG-016","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"The act of giving birth in goats is called ______.","o":["Calving","Kidding","Lambing","Farrowing"],"a":1,"e":"Kidding is birth in goats."},{"i":"AGR-1WgnJIPG-017","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A pregnant goat is described as ______.","o":["In-calf","In-sow","In-kid","In-heat"],"a":2,"e":"Pregnancy is described with 'in-' plus the young: in-calf, in-lamb, in-kid, in-pig."},{"i":"AGR-1WgnJIPG-018","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A mature female pig that has given birth at least once is called a ______.","o":["Gilt","Sow","Hen","Doe"],"a":1,"e":"A sow is a mature female pig that has farrowed at least once."},{"i":"AGR-1WgnJIPG-019","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"The act of giving birth in swine is called ______.","o":["Farrowing","Kidding","Calving","Kindling"],"a":0,"e":"Farrowing is birth in pigs."},{"i":"AGR-1WgnJIPG-020","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A female pig that has not produced any offspring is called a ______.","o":["Sow","Gilt","Ewe","Pullet"],"a":1,"e":"A gilt is a young female pig that has not yet farrowed."},{"i":"AGR-1WgnJIPG-021","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A mature male swine is called a ______.","o":["Boar","Barrow","Hog","Piglet"],"a":0,"e":"A boar is an entire mature male pig. A barrow is one castrated young."},{"i":"AGR-1WgnJIPG-022","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"A male swine castrated at an early age is called a ______.","o":["Boar","Barrow","Gilt","Piglet"],"a":1,"e":"A barrow is a male pig castrated when young, usually raised for pork."},{"i":"AGR-1WgnJIPG-023","c":"AGR","u":"Cattle, sheep, goats & pigs","s":"mcq","q":"The entire offspring produced at a single birth is called a ______.","o":["Litter","Fleece","Brood","Set"],"a":0,"e":"A litter is all the young born at one birth. A fleece belongs to sheep and a brood to young birds."},{"i":"AGR-1WgnJIPG-024","c":"AGR","u":"Poultry","s":"mcq","q":"Poultry refers to the entire ______ species.","o":["Avian","Bovine","Ovine","Caprine"],"a":0,"e":"Poultry are avian species: chickens, turkeys, ducks, geese and guinea fowl."},{"i":"AGR-1WgnJIPG-025","c":"AGR","u":"Poultry","s":"mcq","q":"A sexually mature female chicken is called a ______.","o":["Pullet","Hen","Chick","Capon"],"a":1,"e":"A hen is a sexually mature female chicken. A pullet is still immature."},{"i":"AGR-1WgnJIPG-026","c":"AGR","u":"Poultry","s":"mcq","q":"A sexually mature male chicken is called a ______.","o":["Cock","Cockerel","Capon","Pullet"],"a":0,"e":"A cock is a sexually mature male chicken. A cockerel is still immature."},{"i":"AGR-1WgnJIPG-027","c":"AGR","u":"Poultry","s":"mcq","q":"A sexually immature female chicken is called a ______.","o":["Hen","Pullet","Chick","Cock"],"a":1,"e":"A pullet is a young female chicken that has not yet started laying."},{"i":"AGR-1WgnJIPG-028","c":"AGR","u":"Poultry","s":"mcq","q":"A sexually immature male fowl is called a ______.","o":["Cockerel","Cock","Capon","Chick"],"a":0,"e":"A cockerel is a young male fowl, not yet sexually mature."},{"i":"AGR-1WgnJIPG-029","c":"AGR","u":"Poultry","s":"mcq","q":"A male chicken castrated at an early age is called a ______.","o":["Cockerel","Capon","Cock","Pullet"],"a":1,"e":"A capon is a male chicken castrated young, mainly for tender meat."},{"i":"AGR-1WgnJIPG-030","c":"AGR","u":"Poultry","s":"mcq","q":"Poultry produced for meat and slaughtered between 8–12 weeks is called a ______.","o":["Layer","Broiler","Pullet","Capon"],"a":1,"e":"Broilers are raised for meat and slaughtered young. Layers are raised for eggs."},{"i":"AGR-1WgnJIPG-031","c":"AGR","u":"Poultry","s":"mcq","q":"The act of placing eggs under a hen or in an incubator is called ______.","o":["Hatch","Set","Wean","Service"],"a":1,"e":"Setting means putting eggs under a broody hen or in an incubator so they can develop."},{"i":"AGR-1WgnJIPG-032","c":"AGR","u":"Poultry","s":"mcq","q":"The emergence of a chick from the egg shell is called ______.","o":["Hatch","Set","Fertility","Kindling"],"a":0,"e":"The hatch is the chick breaking out of the shell. Setting is what starts incubation."},{"i":"AGR-1WgnJIPG-033","c":"AGR","u":"Poultry","s":"mcq","q":"The percentage of eggs set which produce a living chick is called ______.","o":["Fertility","Hatchability","Libido","Lactation"],"a":1,"e":"Hatchability is live chicks as a percentage of eggs set. Fertility only counts eggs that are fertile."},{"i":"AGR-1WgnJIPG-034","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"A mature male rabbit is called a ______.","o":["Doe","Buck","Kid","Ram"],"a":1,"e":"A buck is a mature male rabbit. The mature female is a doe."},{"i":"AGR-1WgnJIPG-035","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"The act of giving birth in rabbits is called ______.","o":["Kindling","Kidding","Lambing","Farrowing"],"a":0,"e":"Kindling is birth in rabbits."},{"i":"AGR-1WgnJIPG-036","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"The act of milk production is called ______.","o":["Weaning","Lactation","Parturition","Service"],"a":1,"e":"Lactation is milk production by the mammary glands."},{"i":"AGR-1WgnJIPG-037","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"The act of giving birth to offspring is called ______.","o":["Parturition","Weaning","Oestrus","Libido"],"a":0,"e":"Parturition is the general word for giving birth. Calving and lambing are species-specific."},{"i":"AGR-1WgnJIPG-038","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"Removal of a young animal from milk feeding is called ______.","o":["Service","Weaning","Hatch","Set"],"a":1,"e":"Weaning moves the young off milk and onto solid feed."},{"i":"AGR-1WgnJIPG-039","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"Feed that is low in fibre but high in total digestible nutrients is called ______.","o":["Roughage","Concentrate","Litter","Fleece"],"a":1,"e":"Concentrates such as maize, soybean meal and groundnut cake are low in fibre and rich in digestible nutrients."},{"i":"AGR-1WgnJIPG-040","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"Feed that is high in fibre but low in total digestible nutrients is called ______.","o":["Concentrate","Roughage","Broiler","Udder"],"a":1,"e":"Roughages such as hay, straw and grass are bulky, fibrous and lower in digestible nutrients."},{"i":"AGR-1WgnJIPG-041","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"The milk gland of an animal is called the ______.","o":["Udder","Uterus","Ovum","Fleece"],"a":0,"e":"The udder is the mammary (milk) gland of cows, ewes and does."},{"i":"AGR-1WgnJIPG-042","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"Mating between male and female domestic animals is called ______.","o":["Service","Weaning","Hatchability","Lactation"],"a":0,"e":"Service is mating between male and female, whether natural or artificial."},{"i":"AGR-1WgnJIPG-043","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"Direct mating of male and female animals is called ______ service.","o":["Artificial","Natural","Indirect","Assisted"],"a":1,"e":"In natural service the male mates directly with the female."},{"i":"AGR-1WgnJIPG-044","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"Artificial insemination involves placing ______ in position for contact with the female ovum using an instrument other than the penis.","o":["Blood","Spermatozoa","Milk","Foetus"],"a":1,"e":"AI places semen (spermatozoa) in the female tract with an instrument instead of the penis."},{"i":"AGR-1WgnJIPG-045","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"The interval from the beginning of one heat period to the start of the next is the ______ cycle.","o":["Oestrus","Pregnancy","Lactation","Weaning"],"a":0,"e":"The oestrus cycle runs from one heat to the next. In cows it is about 21 days."},{"i":"AGR-1WgnJIPG-046","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"The regular period in female mammals when copulation is allowed is called ______.","o":["Libido","Heat/estrus","Pregnancy","Parturition"],"a":1,"e":"Heat (oestrus) is the period when a female accepts the male."},{"i":"AGR-1WgnJIPG-047","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"The period of sexual desire in male animals is called ______.","o":["Libido","Heat","Oestrus cycle","Lactation"],"a":0,"e":"Libido is a male's sexual desire. Heat is the female's receptive period."},{"i":"AGR-1WgnJIPG-048","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"Pregnancy is the period from conception until the animal ______.","o":["is weaned","gives birth","is castrated","reaches maturity"],"a":1,"e":"Pregnancy (gestation) lasts from conception until birth."},{"i":"AGR-1WgnJIPG-049","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"When a foetus is born dead after a full-time pregnancy, it is called ______.","o":["Abortion","Still birth","Weaning","Hatch"],"a":1,"e":"A stillbirth is a full-term foetus born dead."},{"i":"AGR-1WgnJIPG-050","c":"AGR","u":"Rabbits, breeding & feeds","s":"mcq","q":"When a foetus is born before its proper time, it is called ______.","o":["Abortion","Still birth","Parturition","Calving"],"a":0,"e":"An abortion is a foetus expelled before its proper time."},{"i":"AGR-1WgnJIPG-051","c":"AGR","u":"Production problems","s":"mcq","q":"A ruminant herbivore has a ______ stomach.","o":["Simple","Compartmented","Empty","Single-chambered"],"a":1,"e":"Ruminants have a compartmented stomach: rumen, reticulum, omasum and abomasum."},{"i":"AGR-1WgnJIPG-052","c":"AGR","u":"Production problems","s":"mcq","q":"Which of the following is a ruminant herbivore?","o":["Horse","Cattle","Chicken","Pig"],"a":1,"e":"Cattle chew the cud, so they are ruminants. The horse, chicken and pig are not."},{"i":"AGR-1WgnJIPG-053","c":"AGR","u":"Production problems","s":"mcq","q":"Which of the following is a non-ruminant herbivore?","o":["Goat","Sheep","Horse","Cattle"],"a":2,"e":"The horse is a non-ruminant herbivore. It has a single stomach and digests fibre in the hindgut."},{"i":"AGR-1WgnJIPG-054","c":"AGR","u":"Production problems","s":"mcq","q":"Which of these is a problem of livestock production in Nigeria?","o":["Feed supply","Excessive rainfall only","Too many veterinarians","Unlimited capital"],"a":0,"e":"Feed shortage, especially in the dry season, is a major problem for livestock production."},{"i":"AGR-1WgnJIPG-055","c":"AGR","u":"Production problems","s":"mcq","q":"Seasonal variation in feed supply can cause fluctuations in the ______ of grazing animals.","o":["rate of weight gain","feather colour","egg shell shape","horn size"],"a":0,"e":"Pasture is plentiful in the rainy season and scarce in the dry season, so weight gain rises and falls."},{"i":"AGR-1WgnJIPG-056","c":"AGR","u":"Production problems","s":"mcq","q":"Overgrazing is caused by ______ animals being supported by the environment.","o":["too few","excess","no","newborn"],"a":1,"e":"Overgrazing happens when more animals graze than the land can support."},{"i":"AGR-1WgnJIPG-057","c":"AGR","u":"Production problems","s":"mcq","q":"Overgrazing/underfeeding can lead to ______.","o":["malnutrition","hatchability","lactation","fertility"],"a":0,"e":"Overgrazed land gives little feed, so animals become malnourished."},{"i":"AGR-1WgnJIPG-058","c":"AGR","u":"Production problems","s":"mcq","q":"Prevailing temperature and humidity can impose ______ on animals.","o":["stresses","litters","fleeces","embryos"],"a":0,"e":"Heat and humidity stress animals and reduce feed intake, growth and reproduction."},{"i":"AGR-1WgnJIPG-059","c":"AGR","u":"Production problems","s":"mcq","q":"Few programmes for livestock genetic improvement constitute an important ______ to successful livestock enterprises.","o":["incentive","inhibitor","feed","service"],"a":1,"e":"Too few breeding programmes hold back productivity, so this is an inhibitor, not an incentive."},{"i":"AGR-1WgnJIPG-060","c":"AGR","u":"Production problems","s":"mcq","q":"Inadequate marketing organizations include inadequate processing and ______ facilities.","o":["storage","breeding","grazing","mating"],"a":0,"e":"Without processing and storage, meat and milk spoil quickly, which limits marketing."},{"i":"AGR-1WgnJIPG-061","c":"AGR","u":"Production problems","s":"mcq","q":"Poor transportation can reduce profit after cattle are trailed long distances because of ______.","o":["weight shrinkage","increased fertility","better feeding","hatchability"],"a":0,"e":"Cattle trekked over long distances lose weight (shrinkage), so they sell for less."},{"i":"AGR-1WgnJIPG-062","c":"AGR","u":"Production problems","s":"mcq","q":"Land tenure can inhibit livestock enterprises because some owners have to graze animals on ______.","o":["their own farms only","lands other than their own","poultry houses","incubators"],"a":1,"e":"Where owners lack secure land, their animals graze on other people's land, which discourages investment."},{"i":"AGR-1WgnJIPG-063","c":"AGR","u":"Production problems","s":"mcq","q":"Insufficient capital can limit implementation of innovations in ______.","o":["husbandry","hatchability only","parturition","oestrus"],"a":0,"e":"Without capital, farmers cannot afford improved housing, feed, breeds and health care in husbandry."},{"i":"AGR-1WgnJIPG-064","c":"AGR","u":"Production problems","s":"mcq","q":"Scarcity of appropriate ______ is listed as one of the problems of livestock production.","o":["technology","fleece","litter","milk"],"a":0,"e":"A shortage of suitable technology limits how productive livestock enterprises can be."},{"i":"AGR-1WgnJIPG-065","c":"AGR","u":"Production problems","s":"mcq","q":"Religious beliefs and social customs can limit the type and number of animals reared in some parts of ______.","o":["Nigeria","Europe","America","Asia"],"a":0,"e":"In some parts of Nigeria, beliefs and customs restrict which animals are kept and how many."},{"i":"COS-1_mXA6_N-001","c":"COS","u":"History of Computing","s":"mcq","q":"Which West African cultural practice was traditionally used to perform mathematical calculations?","o":["Talking drums","Cowrie shells","Kola nut counting","Bead necklaces"],"a":1,"e":"Most West African countries traditionally used cowrie shells to perform mathematical calculations."},{"i":"COS-1_mXA6_N-002","c":"COS","u":"History of Computing","s":"mcq","q":"The 'Odu Ifa,' a binary number system used for divination and computation, was developed by which Nigerian ethnic group?","o":["Hausa","Igbo","Yoruba","Fulani"],"a":2,"e":"The Yoruba people developed the Odu Ifa binary number system, used for divination, computation, and other purposes."},{"i":"COS-1_mXA6_N-003","c":"COS","u":"History of Computing","s":"mcq","q":"The abacus was developed in which region and time period?","o":["Europe, 1400-1600 CE","Asia, between 2700 and 2300 BCE","Africa, 500 BCE","South America, 1000 CE"],"a":1,"e":"The abacus was developed in Asia between 2700 and 2300 before the common era (BCE)."},{"i":"COS-1_mXA6_N-004","c":"COS","u":"History of Computing","s":"mcq","q":"John Napier developed the logarithm in which year, to aid computation?","o":["1590","1614","1632","1700"],"a":1,"e":"John Napier, a Scottish mathematician, developed the logarithm in 1614 for easy computation of numbers."},{"i":"COS-1_mXA6_N-005","c":"COS","u":"History of Computing","s":"mcq","q":"William Oughtred invented the slide rule in 1632, based on the ideas of:","o":["Blaise Pascal","John Napier","Charles Babbage","Herman Hollerith"],"a":1,"e":"Oughtred, a clergyman and mathematician, invented the slide rule based on John Napier's ideas."},{"i":"COS-1_mXA6_N-006","c":"COS","u":"History of Computing","s":"mcq","q":"The Pascaline, built by Blaise Pascal, was capable of:","o":["Addition and subtraction only","All four arithmetic operations equally well","Only multiplication and division","Binary logic operations"],"a":0,"e":"The Pascaline was good in addition and subtraction but elementary in multiplication and division."},{"i":"COS-1_mXA6_N-007","c":"COS","u":"History of Computing","s":"mcq","q":"The Pascaline became commercially viable during which period?","o":["1614-1620","1642-1644","1804-1810","1880-1890"],"a":1,"e":"Blaise Pascal's calculating machine (the Pascaline) became commercially viable between 1642 and 1644."},{"i":"COS-1_mXA6_N-008","c":"COS","u":"History of Computing","s":"mcq","q":"The arithmometer, built by Charles Xavier Thomas de Colmar in 1820, was significant as:","o":["The first electronic calculator","The first precision commercial mechanical calculator","The first computer with a keyboard","The first punch-card device"],"a":1,"e":"The arithmometer was the first precision commercial mechanical calculator, handling addition, subtraction, multiplication, and division."},{"i":"COS-1_mXA6_N-009","c":"COS","u":"History of Computing","s":"mcq","q":"The Jacquard loom, invented by Joseph Marie Jacquard in 1804, is significant in computing history because it:","o":["Was the first electronic device","Marked the beginning of automated systems","Introduced the binary number system","Was the first calculating machine"],"a":1,"e":"The Jacquard loom marked the beginning of the automated system, using punched cards to control weaving patterns."},{"i":"COS-1_mXA6_N-010","c":"COS","u":"History of Computing","s":"mcq","q":"Charles Babbage developed the Difference Engine in which decade?","o":["1780s","1820s","1860s","1900s"],"a":1,"e":"Charles Babbage, a scientist, inventor, and mathematician, developed the difference engine in the 1820s."},{"i":"COS-1_mXA6_N-011","c":"COS","u":"History of Computing","s":"mcq","q":"Ada Lovelace (Lady Lovelace) is historically significant as:","o":["The inventor of the Pascaline","The first computer programmer","The developer of the vacuum tube","The founder of IBM"],"a":1,"e":"Lady Lovelace was well known as the first computer programmer because of her close work with Charles Babbage on the Analytical Engine."},{"i":"COS-1_mXA6_N-012","c":"COS","u":"History of Computing","s":"mcq","q":"Herman Hollerith developed the first electromechanical tabulating machine for which organization?","o":["Bell Labs","US Census Bureau","IBM Corporation","Iowa State College"],"a":1,"e":"Hollerith, employed as a statistician at the US Census Bureau, developed the tabulating machine, displayed in 1890."},{"i":"COS-1_mXA6_N-013","c":"COS","u":"History of Computing","s":"mcq","q":"The Atanasoff-Berry Computer (ABC), the first electronic digital computer, was built to:","o":["Process business payroll data","Find solutions to systems of simultaneous linear equations","Control the Jacquard loom","Break military codes"],"a":1,"e":"John Atanasoff and Clifford Berry built the ABC at Iowa State College to solve systems of simultaneous linear equations."},{"i":"COS-1_mXA6_N-014","c":"COS","u":"History of Computing","s":"mcq","q":"The defining electronic component of first-generation computers was the:","o":["Transistor","Vacuum tube","Integrated circuit","Microprocessor"],"a":1,"e":"First-generation computers were made up of glass tubes called vacuum tubes, used as electronic switches."},{"i":"COS-1_mXA6_N-015","c":"COS","u":"History of Computing","s":"mcq","q":"First-generation computers used which level of programming language exclusively?","o":["High-level languages like FORTRAN","Machine language (binary code)","4GL languages","Object-oriented languages"],"a":1,"e":"Machine language, consisting of binary code (0s and 1s), was the lowest-level and only language used in the first generation."},{"i":"COS-1_mXA6_N-016","c":"COS","u":"History of Computing","s":"mcq","q":"Data storage in first-generation computers relied primarily on:","o":["Magnetic core memory","Magnetic drum memory","DRAM chips","Hard disk drives"],"a":1,"e":"First-generation computers used magnetic drum memory, a non-volatile memory using magnetic fields."},{"i":"COS-1_mXA6_N-017","c":"COS","u":"History of Computing","s":"mcq","q":"Input of data and instructions into first-generation computers was primarily achieved via:","o":["Keyboards","Punch cards","Touch screens","Magnetic tape drives"],"a":1,"e":"Punch cards, rigid paper with perforated holes, were used to input data and instructions."},{"i":"COS-1_mXA6_N-018","c":"COS","u":"History of Computing","s":"mcq","q":"The processing method where all input data is collected and then processed together is called:","o":["Real-time processing","Batch processing","Time-sharing","Distributed processing"],"a":1,"e":"Batch processing — collecting and then processing input together — was the method used in first-generation computing."},{"i":"COS-1_mXA6_N-019","c":"COS","u":"History of Computing","s":"mcq","q":"Which of these is NOT an example of a first-generation computer?","o":["ENIAC","UNIVAC I","Ferranti Mark I","IBM System/360"],"a":3,"e":"IBM System/360 is a third-generation computer (1964); ENIAC, UNIVAC I, and Ferranti Mark I belong to the first generation."},{"i":"COS-1_mXA6_N-020","c":"COS","u":"History of Computing","s":"mcq","q":"The key hardware advancement of second-generation computers, replacing vacuum tubes, was the:","o":["Integrated circuit","Transistor","Microprocessor","Punch card reader"],"a":1,"e":"Second-generation computers replaced vacuum tubes with smaller, more dependable transistors."},{"i":"COS-1_mXA6_N-021","c":"COS","u":"History of Computing","s":"mcq","q":"The IBM 704 (1954) was notable as the first computer to have a compiler for which language?","o":["COBOL","FORTRAN","ALGOL","BASIC"],"a":1,"e":"IBM 704 was the first computer to have a Fortran compiler, allowing high-level code to be translated to machine language."},{"i":"COS-1_mXA6_N-022","c":"COS","u":"History of Computing","s":"mcq","q":"COBOL, a business application programming language, was produced in 1959 by:","o":["John Backus","Dennis Ritchie","Grace Hopper","Niklaus Wirth"],"a":2,"e":"Grace Hopper produced COBOL (Common Business-Oriented Language) in 1959."},{"i":"COS-1_mXA6_N-023","c":"COS","u":"History of Computing","s":"mcq","q":"ALGOL was developed in 1958 by a committee that included John Backus and:","o":["Peter Naur","Grace Hopper","Dennis Ritchie","Niklaus Wirth"],"a":0,"e":"ALGOL (Algorithmic Language) was developed in 1958 by a committee including John Backus and Peter Naur."},{"i":"COS-1_mXA6_N-024","c":"COS","u":"History of Computing","s":"mcq","q":"Which memory technology replaced vacuum tube and drum memory in the second generation?","o":["DRAM","Magnetic core memory","Flash memory","SSD"],"a":1,"e":"Magnetic core memory replaced vacuum tube memory and drum memory, offering faster and more dependable storage."},{"i":"COS-1_mXA6_N-025","c":"COS","u":"History of Computing","s":"mcq","q":"IBM's OS/360, developed in the second generation, was significant because it:","o":["Introduced the first GUI","Permitted many users to run programs on the same computer simultaneously","Was the first operating system ever created","Enabled wireless networking"],"a":1,"e":"OS/360 permitted many users to run programs on the same computer at the same time, as computing shifted from vacuum tubes to transistors."},{"i":"COS-1_mXA6_N-026","c":"COS","u":"History of Computing","s":"mcq","q":"The third generation of computers is generally understood to have begun with the introduction of:","o":["The Intel 4004 in 1971","The IBM System/360 mainframe in 1964","The transistor in 1950","The vacuum tube in 1940"],"a":1,"e":"The IBM System/360 mainframe, introduced in 1964, is generally believed to mark the beginning of the third generation; the Intel 4004 (1971) marked its end."},{"i":"COS-1_mXA6_N-027","c":"COS","u":"History of Computing","s":"mcq","q":"Third-generation computers replaced transistors with:","o":["Vacuum tubes","Integrated circuits (ICs)","Microprocessors only","Punch cards"],"a":1,"e":"The use of transistors was replaced with integrated circuits, permitting smaller and more powerful computers."},{"i":"COS-1_mXA6_N-028","c":"COS","u":"History of Computing","s":"mcq","q":"The method that enables multiple computer system users to access a computer simultaneously, introduced in the third generation, is called:","o":["Batch processing","Time-sharing","Parallel processing","Cloud computing"],"a":1,"e":"Time-sharing, introduced in the third generation, allowed multiple users to access a single computer at the same time."},{"i":"COS-1_mXA6_N-029","c":"COS","u":"History of Computing","s":"mcq","q":"The first personal computer, the Altair 8800 (1975), was based on which microprocessor?","o":["Intel 8080","Motorola 6800","Zilog Z80","Intel 4004"],"a":0,"e":"The Altair 8800, designed by MITS, was based on the Intel 8080 microprocessor and came with 256 bytes of memory."},{"i":"COS-1_mXA6_N-030","c":"COS","u":"History of Computing","s":"mcq","q":"The C Programming Language was created in 1972 at Bell Labs by:","o":["Niklaus Wirth","Dennis Ritchie","John Backus","Grace Hopper"],"a":1,"e":"Dennis Ritchie created the C Programming Language at Bell Labs in 1972."},{"i":"COS-1_mXA6_N-031","c":"COS","u":"History of Computing","s":"mcq","q":"Pascal, a structured programming language, was invented in 1970 by:","o":["Dennis Ritchie","Niklaus Wirth","John Backus","Vint Cerf"],"a":1,"e":"Niklaus Wirth invented Pascal in 1970."},{"i":"COS-1_mXA6_N-032","c":"COS","u":"History of Computing","s":"mcq","q":"Which of these is an example of a third-generation computer?","o":["ENIAC","IBM 704","DEC PDP-11","Apple Macintosh"],"a":2,"e":"DEC PDP-11 is a third-generation computer; ENIAC is first-generation, IBM 704 is second-generation, and Apple Macintosh is fourth-generation."},{"i":"COS-1_mXA6_N-033","c":"COS","u":"History of Computing","s":"mcq","q":"Third-generation programming languages (3GLs) were significant because they:","o":["Were the first to be used for structured programming and were closer to natural language","Only used binary machine code","Eliminated the need for compilers","Were exclusively used for business applications"],"a":0,"e":"3GLs were the first used for structured programming and were closer to natural language, making programming easier for non-experts."},{"i":"COS-1_mXA6_N-034","c":"COS","u":"History of Computing","s":"mcq","q":"The fourth generation of computers was primarily defined by the development of:","o":["Vacuum tubes and transistors","Microprocessors and personal computers","Integrated circuits only","Punch card systems"],"a":1,"e":"The fourth generation saw the development of microprocessors and personal computers, revolutionizing the industry."},{"i":"COS-1_mXA6_N-035","c":"COS","u":"History of Computing","s":"mcq","q":"Which technology allowed miniaturization and mass-production of computer components in the fourth generation?","o":["Vacuum tube arrays","Large-scale integration (LSI) and very large-scale integration (VLSI)","Magnetic drum memory","Punch card readers"],"a":1,"e":"LSI and VLSI technology permitted miniaturization and mass-production, leading to microprocessors."},{"i":"COS-1_mXA6_N-036","c":"COS","u":"History of Computing","s":"mcq","q":"The Intel 8080 microprocessor, foundational to early personal computers, was made available in which year?","o":["1970","1972","1974","1976"],"a":2,"e":"The Intel 8080 was made available in 1974 (the Intel 8008 in 1972)."},{"i":"COS-1_mXA6_N-037","c":"COS","u":"History of Computing","s":"mcq","q":"Which company produced the 6800 microprocessor in 1974, popular in early home computers and video game consoles?","o":["Intel","Zilog","Motorola","IBM"],"a":2,"e":"Motorola produced the 6800 microprocessor in 1974."},{"i":"COS-1_mXA6_N-038","c":"COS","u":"History of Computing","s":"mcq","q":"The Zilog Z80 microprocessor, announced in 1976, gained popularity in early personal computers such as:","o":["The Altair 8800 and Apple II","The TRS-80 and the ZX Spectrum","The IBM PC and Commodore 64","The Cray-1 and VAX-11"],"a":1,"e":"Zilog Z80 microprocessors gained popularity among early personal computers such as the TRS-80 and ZX Spectrum."},{"i":"COS-1_mXA6_N-039","c":"COS","u":"History of Computing","s":"mcq","q":"DRAM (dynamic random-access memory) technology in the fourth generation allowed for:","o":["Reduced memory capacity","More complex programs via increased memory capacity and cheaper memory chips","The elimination of memory chips entirely","Slower processing speeds"],"a":1,"e":"DRAM technology made it possible to construct extra memory, permitting more complex programs and cheaper, smaller memory chips."},{"i":"COS-1_mXA6_N-040","c":"COS","u":"History of Computing","s":"mcq","q":"Apple introduced the Macintosh System Software in 1984, notable for boasting:","o":["A command-line interface","A graphical user interface (GUI)","Batch processing only","No file management capability"],"a":1,"e":"Macintosh System Software (1984) boasted a GUI, allowing drag-and-drop file management."},{"i":"COS-1_mXA6_N-041","c":"COS","u":"History of Computing","s":"mcq","q":"OS/2, produced in 1987 by a combined effort between IBM and Microsoft, was eventually:","o":["Renamed to Windows","Suspended in 2001 due to lack of general acceptance","Adopted as the universal PC standard","Merged with Unix"],"a":1,"e":"OS/2 was not generally accepted and was hence suspended in 2001."},{"i":"COS-1_mXA6_N-042","c":"COS","u":"History of Computing","s":"mcq","q":"The graphical user interface (GUI) was first developed in the 1970s by:","o":["Apple","Microsoft","Xerox","IBM"],"a":2,"e":"The GUI was first developed by Xerox in the 1970s and became popular in the 1980s."},{"i":"COS-1_mXA6_N-043","c":"COS","u":"History of Computing","s":"mcq","q":"The WIMP interface, which gained acceptance among Windows OS users, stands for:","o":["Windows, Icons, Menus, Pointers","Wireless Internet Multi-Processing","Windows, Internet, Mouse, Programs","Web Interface Management Protocol"],"a":0,"e":"WIMP stands for Windows, Icons, Menus, and Pointers — featuring a desktop with icons and drop-down menus."},{"i":"COS-1_mXA6_N-044","c":"COS","u":"History of Computing","s":"mcq","q":"Ethernet, enabling computers to connect via a shared communication protocol, was developed in 1973 by:","o":["Vint Cerf","Robert Metcalfe","Bob Kahn","Dennis Ritchie"],"a":1,"e":"Robert Metcalfe developed Ethernet at Xerox Corporation's Palo Alto Research Centre (PARC) in 1973."},{"i":"COS-1_mXA6_N-045","c":"COS","u":"History of Computing","s":"mcq","q":"Internet Protocol (IP), enabling communication between different networked devices, was first developed in the late 1970s by:","o":["Robert Metcalfe alone","Vint Cerf and Bob Kahn","Dennis Ritchie and Niklaus Wirth","John Backus and Peter Naur"],"a":1,"e":"Vint Cerf and Bob Kahn developed IP in the late 1970s to connect multiple networks into a larger network of networks."},{"i":"COS-1_mXA6_N-046","c":"COS","u":"History of Computing","s":"mcq","q":"The 'Fifth Generation Computer Project' was initiated by which country's government?","o":["United States","United Kingdom","Japan","Germany"],"a":2,"e":"The Fifth Generation Computer Project was started by the Japanese government (Ministry of International Trade and Industry) with companies like Fujitsu, NEC, and Hitachi."},{"i":"COS-1_mXA6_N-047","c":"COS","u":"History of Computing","s":"mcq","q":"The Fifth Generation Computer Project ultimately:","o":["Successfully achieved all its goals on schedule","Was terminated in the 1990s due to failure to achieve its goals","Was renamed and continues today","Was immediately adopted worldwide"],"a":1,"e":"The project, expected to run ten years, was terminated in the 1990s due to rising costs and inability to develop practical applications."},{"i":"COS-1_mXA6_N-048","c":"COS","u":"History of Computing","s":"mcq","q":"Despite its failure, the Fifth Generation Computer Project's research contributed to advances in:","o":["Vacuum tube design","Logic programming, knowledge representation, and parallel/distributed systems research","Punch card manufacturing","Magnetic drum memory"],"a":1,"e":"The project promoted development in logic programming, knowledge representation, and inspired research in parallel processing and distributed systems."},{"i":"COS-1_mXA6_N-049","c":"COS","u":"History of Computing","s":"mcq","q":"A Knowledge-Based System (KBS), a component of fifth-generation AI, is designed to:","o":["Replace all computer hardware","Replicate the problem-solving abilities of a human expert using a knowledge base and inference engine","Only store binary code","Eliminate the need for programming languages"],"a":1,"e":"KBS uses a database of knowledge and reasoning methods to replicate a human expert's problem-solving abilities."},{"i":"COS-1_mXA6_N-050","c":"COS","u":"History of Computing","s":"mcq","q":"Parallel processing, a key feature of fifth-generation computers, works by:","o":["Processing one instruction at a time on a single processor","Dividing work into smaller sub-units performed on many processors simultaneously","Storing all data on punch cards","Eliminating the need for memory"],"a":1,"e":"Parallel processing divides work into smaller sub-units and performs them on many processors at the same time."},{"i":"COS-1_mXA6_N-051","c":"COS","u":"History of Computing","s":"mcq","q":"Which of these is an example of a fifth-generation programming language?","o":["FORTRAN","COBOL","Prolog","Assembly"],"a":2,"e":"Prolog is listed among fifth-generation languages, alongside LISP, SQL, SAS, and ADA — advancements from 4GLs."},{"i":"COS-1_mXA6_N-052","c":"COS","u":"History of Computing","s":"mcq","q":"Expert Systems, a fifth-generation AI component, are designed to:","o":["Replace all human decision-making permanently","Imitate the decision-making functions of a human expert in a specific field","Only process numerical data","Function without any knowledge base"],"a":1,"e":"Expert Systems imitate a human expert's decision-making in a specific area, using knowledge and reasoning methods."},{"i":"BIO-1fcsQH1g-001","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"What is a chromosome?","o":["A single gene bundled with a protein","A long, bundled strand of DNA containing many genes","A type of RNA molecule","A membrane-bound organelle"],"a":1,"e":"Chromosomes are long, bundled strands of DNA, each containing many genes."},{"i":"BIO-1fcsQH1g-002","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"In humans, gametes contain how many sets of chromosomes?","o":["One set (haploid)","Two sets (diploid)","Three sets (triploid)","Four sets (tetraploid)"],"a":0,"e":"Gametes normally contain only one set of chromosomes — the haploid (n) state."},{"i":"BIO-1fcsQH1g-003","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Somatic cells in humans are described as:","o":["Haploid","Diploid","Triploid","Polyploid"],"a":1,"e":"Somatic cells contain two haploid sets of chromosomes, making them diploid (2n)."},{"i":"BIO-1fcsQH1g-004","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"What is the diploid chromosome number in humans?","o":["23","46","44","48"],"a":1,"e":"Humans have 2n = 46 chromosomes (23 pairs)."},{"i":"BIO-1fcsQH1g-005","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Which organism has the smallest known chromosome number (2n = 2)?","o":["Ascaris megalocephalus","Aulacantha","Drosophila","Homo sapiens"],"a":0,"e":"Ascaris megalocephalus has the smallest recorded chromosome number, 2n = 2."},{"i":"BIO-1fcsQH1g-006","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Which organism has one of the highest chromosome numbers, 2n = 1600?","o":["Aulacantha","Paramecium aurelia","Musca domestica","Gorilla gorilla"],"a":0,"e":"Aulacantha holds the highest recorded chromosome number, 2n = 1600."},{"i":"BIO-1fcsQH1g-007","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"How many chromosomes does a housefly (Musca domestica) have?","o":["46","12","26","48"],"a":1,"e":"The housefly has 12 chromosomes."},{"i":"BIO-1fcsQH1g-008","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Non-sex chromosomes are called:","o":["Autosomes","Gonosomes","Allosomes","Plasmids"],"a":0,"e":"Chromosomes that are not sex chromosomes are termed autosomes."},{"i":"BIO-1fcsQH1g-009","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"In humans, a female has which sex chromosome combination?","o":["XY","XX","XO","XXY"],"a":1,"e":"Females have 44 autosomes plus one pair of XX sex chromosomes."},{"i":"BIO-1fcsQH1g-010","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A chromosome with only one centromere is called:","o":["Holocentric","Acentric","Monocentric","Dicentric"],"a":2,"e":"Most organisms' chromosomes contain a single centromere — monocentric chromosomes."},{"i":"BIO-1fcsQH1g-011","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A chromosome with diffused centromeres along its length (e.g. Ascaris megalocephala) is:","o":["Monocentric","Holocentric","Acentric","Dicentric"],"a":1,"e":"Holocentric chromosomes have microtubules attached along their entire length rather than at one point."},{"i":"BIO-1fcsQH1g-012","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A chromosome that has lost its centromere due to breakage is called:","o":["Dicentric","Monocentric","Acentric","Holocentric"],"a":2,"e":"Acentric chromosomes lack a centromere and cannot attach to the mitotic spindle, causing non-disjunction."},{"i":"BIO-1fcsQH1g-013","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A chromosome fragment with two centromeres is called:","o":["Acentric","Dicentric","Monocentric","Holocentric"],"a":1,"e":"Dicentric chromosomes are unstable and typically lead to fragmentation during division."},{"i":"BIO-1fcsQH1g-014","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The function of the telomere is to:","o":["Attach spindle fibers","Prevent chromosome ends from fusing after breakage","Store rRNA genes","Separate sister chromatids"],"a":1,"e":"If a chromosome breaks, the broken ends can fuse together due to lack of telomere protection."},{"i":"BIO-1fcsQH1g-015","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The centromere is also referred to by cytologists as the:","o":["Secondary constriction","Kinetochore (primary constriction)","Nuclear organizer","Satellite"],"a":1,"e":"Geneticists call it the centromere; cytologists prefer 'kinetochore'. Both refer to the primary constriction."},{"i":"BIO-1fcsQH1g-016","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"During cell division, each half of a duplicated chromosome, joined at the centromere, is called a:","o":["Chromomere","Chromatid","Chromonema","Telomere"],"a":1,"e":"A chromatid is one of the two identical halves of a duplicated chromosome, joined by a centromere."},{"i":"BIO-1fcsQH1g-017","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The complex of DNA and proteins that forms chromosomes inside the nucleus is called:","o":["Chromatin","Chromomere","Nucleolus","Matrix"],"a":0,"e":"Chromatin is DNA coiled around histone proteins, condensed to fit inside the nucleus."},{"i":"BIO-1fcsQH1g-018","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Nuclear organizer regions contain gene-coding sequences mainly for:","o":["mRNA","Ribosomal RNA (5.8S, 18S, 28S)","tRNA only","Histone proteins"],"a":1,"e":"Nuclear organizers induce nucleolus formation and carry genes for ribosomal RNA."},{"i":"BIO-1fcsQH1g-019","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The jelly-like, non-genetic substance found inside the chromosome's pellicle is the:","o":["Matrix","Chromatin","Chromomere","Chromonema"],"a":0,"e":"The matrix is a jelly-like substance made of non-genetic material within the chromosome's pellicle membrane."},{"i":"BIO-1fcsQH1g-020","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Which statement about chromosome size and number is generally TRUE?","o":["More chromosomes always means larger chromosomes","Fewer chromosomes generally means larger chromosomes","Chromosome size is unrelated to number","All species have identical chromosome size"],"a":1,"e":"Organisms with fewer chromosomes tend to have larger individual chromosomes, and vice versa."},{"i":"BIO-1fcsQH1g-021","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A gene is best defined as:","o":["A whole chromosome","A fragment of DNA that codes for a particular protein or trait","A type of ribosome","A cell organelle"],"a":1,"e":"A gene is a discrete segment of DNA that codes for a specific protein and comprises a functional unit of heredity."},{"i":"BIO-1fcsQH1g-022","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The specific location of a gene on a chromosome is called its:","o":["Allele","Locus","Genotype","Genome"],"a":1,"e":"A locus describes the region of a chromosome where a particular gene is located."},{"i":"BIO-1fcsQH1g-023","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Different alternative forms of the same gene are called:","o":["Loci","Alleles","Genomes","Codons"],"a":1,"e":"Alleles are alternate forms of a gene occupying the same position on a pair of chromosomes."},{"i":"BIO-1fcsQH1g-024","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"By convention, a dominant allele is represented by:","o":["A lowercase letter","A capital letter","A number","A Greek symbol"],"a":1,"e":"Dominant alleles are conventionally denoted with a capital letter, e.g. 'A'."},{"i":"BIO-1fcsQH1g-025","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"An organism with genotype 'Aa' is described as:","o":["Homozygous dominant","Homozygous recessive","Heterozygous","Hemizygous"],"a":2,"e":"Heterozygous individuals carry two different alleles for a given gene."},{"i":"BIO-1fcsQH1g-026","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"An organism with genotype 'AA' is described as:","o":["Heterozygous","Homozygous dominant","Homozygous recessive","Polyploid"],"a":1,"e":"Two identical dominant alleles make an organism homozygous dominant."},{"i":"BIO-1fcsQH1g-027","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A classic example of multiple alleles in humans is:","o":["Eye color only","The ABO blood grouping system","Height","Hair texture"],"a":1,"e":"The A, B, AB, and O blood groups arise from multiple alleles of a single gene."},{"i":"BIO-1fcsQH1g-028","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"In a eukaryotic gene, the coding regions that are translated into protein are called:","o":["Introns","Exons","Promoters","Telomeres"],"a":1,"e":"Exons contain nucleotides that are translated into amino acids of proteins."},{"i":"BIO-1fcsQH1g-029","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Non-coding segments of DNA that are removed during mRNA processing are called:","o":["Exons","Introns","Codons","Alleles"],"a":1,"e":"Introns are 'junk DNA' segments between exons; they don't code for protein and are spliced out."},{"i":"BIO-1fcsQH1g-030","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A gene must contain a region of DNA that initiates transcription — this is the:","o":["Stop signal","Promoter region","Intron","Regulatory element only"],"a":1,"e":"The promoter region signals the start of transcription for a gene."},{"i":"BIO-1fcsQH1g-031","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Who proposed the widely accepted double helix model of DNA?","o":["Gregor Mendel","Charles Darwin","Watson and Crick","Lamarck"],"a":2,"e":"James D. Watson and F.H.C. Crick proposed the double helix model of DNA in 1953."},{"i":"BIO-1fcsQH1g-032","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A nucleotide is made up of:","o":["Only a sugar and a base","A deoxyribose sugar, a nitrogenous base, and a phosphate group","Only phosphate groups","Amino acids and sugars"],"a":1,"e":"Nucleotides — the repeating units of DNA — consist of a sugar, a nitrogenous base, and a phosphate group."},{"i":"BIO-1fcsQH1g-033","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The purine bases found in DNA are:","o":["Cytosine and Thymine","Adenine and Guanine","Adenine and Uracil","Guanine and Cytosine"],"a":1,"e":"Purines in DNA are Adenine (A) and Guanine (G)."},{"i":"BIO-1fcsQH1g-034","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The pyrimidine bases found in DNA are:","o":["Adenine and Guanine","Cytosine and Thymine","Cytosine and Uracil","Guanine and Uracil"],"a":1,"e":"Pyrimidines in DNA are Cytosine (C) and Thymine (T)."},{"i":"BIO-1fcsQH1g-035","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"According to DNA base-pairing rules:","o":["A pairs with C; G pairs with T","A pairs with T; C pairs with G","A pairs with G; T pairs with C","All bases pair randomly"],"a":1,"e":"DNA base pairing follows: Adenine–Thymine and Cytosine–Guanine."},{"i":"BIO-1fcsQH1g-036","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The sugar found in DNA is:","o":["Ribose","Deoxyribose","Glucose","Fructose"],"a":1,"e":"DNA contains a 2′-deoxyribose sugar; RNA contains ribose."},{"i":"BIO-1fcsQH1g-037","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"RNA differs from DNA in that RNA contains ___ instead of thymine.","o":["Uracil","Cytosine","Guanine","Adenine"],"a":0,"e":"RNA substitutes Uracil (U) for Thymine (T)."},{"i":"BIO-1fcsQH1g-038","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The molecule that carries genetic information from DNA to the ribosome for protein synthesis is:","o":["tRNA","rRNA","mRNA","DNA polymerase"],"a":2,"e":"Messenger RNA (mRNA) carries information from DNA to the ribosomes to serve as a template for protein synthesis."},{"i":"BIO-1fcsQH1g-039","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The central dogma of molecular biology describes the flow of genetic information as:","o":["Protein → RNA → DNA","DNA → RNA → Protein","RNA → DNA → Protein","Protein → DNA → RNA"],"a":1,"e":"The central dogma states genetic information flows from DNA to RNA to Protein."},{"i":"BIO-1fcsQH1g-040","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A group of three nitrogenous bases that codes for one amino acid is called a:","o":["Allele","Codon","Locus","Genome"],"a":1,"e":"A codon is a triplet of bases (e.g. ACG) that is translated into one amino acid."},{"i":"BIO-1fcsQH1g-041","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"How many possible codon combinations exist from the triplet code?","o":["20","64","46","4"],"a":1,"e":"There are 64 possible triplet combinations from 4 bases (4³ = 64); 61 code for amino acids."},{"i":"BIO-1fcsQH1g-042","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Which of these codons act as STOP (termination) codons?","o":["AUG, GUG, UUG","UAG, UGA, UAA","AAA, GGG, CCC","UUU, CCC, AAA"],"a":1,"e":"UAG, UGA, and UAA are termination codons — they do not code for any amino acid."},{"i":"BIO-1fcsQH1g-043","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A prokaryotic chromosome is typically:","o":["Linear and found in a nucleus","Circular and found free in the cytoplasm","Made of chromatin only","Absent altogether"],"a":1,"e":"Prokaryotes have a single circular chromosome located in the cytoplasm, lacking a nuclear membrane."},{"i":"BIO-1fcsQH1g-044","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A eukaryotic chromosome differs from a prokaryotic one because it is:","o":["Circular and naked DNA","Linear, made of chromatin, and enclosed in a nucleus","Found only in bacteria","Always haploid"],"a":1,"e":"Eukaryotic chromosomes are linear, made of chromatin (DNA + histone proteins), and housed in a true nucleus."},{"i":"BIO-1fcsQH1g-045","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Chromatin is best described as:","o":["Pure DNA with no proteins","DNA coiled around histone proteins","A type of RNA","A cell membrane component"],"a":1,"e":"Chromatin is a nucleoprotein — DNA coiled around histone proteins to fit inside the nucleus."},{"i":"BIO-1fcsQH1g-046","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A genome is defined as:","o":["A single gene","The complete set of genetic instructions (DNA, genes, chromosomes) of an organism","Only the protein-coding regions of DNA","A type of chromosome"],"a":1,"e":"A genome is the complete set of genetic instructions that determine an organism's traits."},{"i":"BIO-1fcsQH1g-047","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The genetic makeup of an organism is called its:","o":["Phenotype","Genotype","Trait","Locus"],"a":1,"e":"Genotype refers to the sum total of an individual's genetic makeup."},{"i":"BIO-1fcsQH1g-048","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The observable physical characteristics resulting from an organism's genes make up its:","o":["Genotype","Phenotype","Genome","Allele"],"a":1,"e":"Phenotype is the physical expression of the allelic composition — the organism's observable traits."},{"i":"BIO-1fcsQH1g-049","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Approximately what percentage of the human genome is made up of actual protein-coding genes?","o":["50–60%","20–30%","1–5%","90–100%"],"a":2,"e":"Genes make up only about 1% to 5% of the human genome; the rest is non-coding, regulatory DNA."},{"i":"BIO-1fcsQH1g-050","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Charles Darwin's influential book proposing 'descent with modification' was titled:","o":["Philosophie Zoologique","On the Origin of Species","The Selfish Gene","The Descent of Man"],"a":1,"e":"Darwin published 'On the Origin of Species' in 1859, proposing that species evolve through descent with modification."},{"i":"BIO-1fcsQH1g-051","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Darwin's proposed mechanism for evolutionary change is known as:","o":["Inheritance of acquired characteristics","Natural selection","Genetic drift only","Use and disuse"],"a":1,"e":"Natural selection favors individuals with traits that increase survival and reproduction; these traits are passed on."},{"i":"BIO-1fcsQH1g-052","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Jean-Baptiste Lamarck's theory of evolution is best known for proposing:","o":["Natural selection","Inheritance of acquired characteristics","The double helix","Mendelian segregation"],"a":1,"e":"Lamarck proposed that traits acquired during an individual's lifetime could be passed on to offspring — since discredited."},{"i":"BIO-1fcsQH1g-053","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Lamarck's key ideas on evolution were published in a book titled:","o":["On the Origin of Species","Philosophie Zoologique","Principia Biologica","The Origin of Genes"],"a":1,"e":"Lamarck's 'Philosophie Zoologique' (1809) outlined use/disuse and inheritance of acquired characteristics."},{"i":"BIO-1fcsQH1g-054","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Which of these is an example of a vestigial organ in humans?","o":["The heart","The appendix","The liver","The brain"],"a":1,"e":"The appendix, coccyx, and tonsils are cited as vestigial (reduced, functionless) human organs."},{"i":"BIO-1fcsQH1g-055","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Similar anatomical structures shared by different species due to common ancestry (e.g. limbs of humans, cats, whales, bats) are called:","o":["Analogous structures","Homologous structures","Vestigial structures","Convergent structures"],"a":1,"e":"Homologous structures reveal common ancestry between different species."},{"i":"BIO-1fcsQH1g-056","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Evolution is best defined as:","o":["A sudden, one-time change in a single organism","Change in the genetic material of a population over successive generations","The formation of a single new gene","A change only in phenotype, not genes"],"a":1,"e":"Evolution is a process resulting in changes to the genetic material of a population over time."},{"i":"BIO-1fcsQH1g-057","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"The process by which populations accumulate genetic changes to become distinct new species is called:","o":["Mutation","Speciation","Segregation","Translation"],"a":1,"e":"Speciation is the process where accumulating genetic changes produce new, distinct species."},{"i":"BIO-1fcsQH1g-058","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Gregor Mendel conducted his famous hybridization experiments on which plant?","o":["Maize (Zea mays)","Garden pea (Pisum sativum)","Fruit fly (Drosophila)","Sunflower"],"a":1,"e":"Mendel performed hybridization experiments on garden pea plants (Pisum sativum) over eight years."},{"i":"BIO-1fcsQH1g-059","c":"BIO","u":
