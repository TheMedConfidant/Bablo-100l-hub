"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Mendel's Law of Dominance states that:","o":["Both alleles are always expressed equally","In a heterozygous pair, one allele masks the expression of the other","Alleles never separate during gamete formation","Traits from both parents always blend completely"],"a":1,"e":"The dominant allele's characters are expressed over the recessive allele's in a heterozygous condition."},{"i":"BIO-1fcsQH1g-060","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Mendel's Law of Segregation states that:","o":["Alleles of different genes assort independently","The paired alleles for a trait separate so each gamete receives only one allele","All traits are always dominant","Genes never separate during meiosis"],"a":1,"e":"During gamete formation, the allelic pair of a gene separates so each gamete carries a single allele."},{"i":"BIO-1fcsQH1g-061","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Mendel's Law of Independent Assortment states that:","o":["Alleles of different genes assort into gametes independently of one another","All genes are always inherited together","Only dominant alleles pass to offspring","Segregation only applies to sex chromosomes"],"a":0,"e":"This law explains that inheritance of one trait pair is independent of another, arising from Mendel's dihybrid crosses."},{"i":"BIO-1fcsQH1g-062","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A trait that appears in the F1 generation of a Mendelian cross is called the:","o":["Recessive character","Dominant character","Mutant character","Hybrid character"],"a":1,"e":"Characters that appear in the F1 generation are the dominant characters; recessive characters reappear in F2."},{"i":"BIO-1oKkPsqH-001","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"A close, long-term biological interaction between two different species is called:","o":["Competition","Symbiosis","Predation","Succession"],"a":1,"e":"Symbiosis is a close, long-term interaction between two different species (symbionts)."},{"i":"BIO-1oKkPsqH-002","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"In an obligate symbiotic relationship:","o":["Partners can live independently","One or more symbionts depend on each other for survival","There is no interaction","Only one species benefits and the other is unaffected"],"a":1,"e":"Obligate symbiosis means the symbionts depend on each other for survival, unlike facultative (optional) symbiosis."},{"i":"BIO-1oKkPsqH-003","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Which type of mutualism involves the yucca plant and the moth?","o":["Facultative mutualism","Obligate mutualism","Trophic mutualism","Defensive mutualism"],"a":1,"e":"The yucca-moth relationship is obligate mutualism — both species are completely dependent on each other."},{"i":"BIO-1oKkPsqH-004","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Honeybees visiting various plants for nectar, benefiting both, is an example of:","o":["Obligate mutualism","Facultative mutualism","Parasitism","Competition"],"a":1,"e":"Honeybees and plants can coexist without depending entirely on each other — facultative mutualism."},{"i":"BIO-1oKkPsqH-005","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"The relationship between cows and the bacteria in their rumen digesting cellulose is an example of:","o":["Defensive mutualism","Trophic mutualism","Dispersive mutualism","Facultative mutualism"],"a":1,"e":"In trophic mutualism, partners are specialized in complementary ways to obtain energy/nutrients, as with cows and rumen bacteria."},{"i":"BIO-1oKkPsqH-006","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Aphids providing honeydew to ants in exchange for protection illustrates:","o":["Trophic mutualism","Dispersive mutualism","Defensive mutualism","Obligate mutualism"],"a":2,"e":"In defensive mutualism, one partner receives food/shelter in exchange for protection from predators, as with aphids and ants."},{"i":"BIO-1oKkPsqH-007","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Competition that occurs directly between individuals through fighting for resources is called:","o":["Exploitative competition","Apparent competition","Interference competition","Facultative competition"],"a":2,"e":"Interference competition involves direct interaction, such as fighting for scarce resources."},{"i":"BIO-1oKkPsqH-008","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Competition between individuals of the same species is termed:","o":["Interspecific competition","Intraspecific competition","Apparent competition","Mutualism"],"a":1,"e":"Intraspecific competition occurs between individuals of the same species; interspecific occurs between different species."},{"i":"BIO-1oKkPsqH-009","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Apparent competition occurs when:","o":["Species directly fight over resources","Two species indirectly affect each other by sharing a common predator","Two species cooperate for mutual benefit","One species depends entirely on another for survival"],"a":1,"e":"Apparent competition is an indirect interaction where two prey species affect each other via a shared predator."},{"i":"BIO-1oKkPsqH-010","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Lichen represents a symbiotic relationship between:","o":["A fungus and algae","Ants and acacia trees","Termites and protozoa","Bees and flowers"],"a":0,"e":"Lichen is a symbiosis between a fungus and algae (or photosynthetic bacteria), where the fungus protects the algae and the algae provides sugars."},{"i":"PHY-1skaQbmb-001","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Which of the following is a scalar quantity?","o":["Displacement","Velocity","Distance","Acceleration"],"a":2,"e":"Distance only has magnitude (how much ground was covered), with no direction attached, so it is a scalar."},{"i":"PHY-1skaQbmb-002","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Which of the following is a vector quantity?","o":["Distance","Speed","Displacement","Mass"],"a":2,"e":"Displacement has both magnitude and direction (how far from the start, and which way), making it a vector."},{"i":"PHY-1skaQbmb-003","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Kinematics is the branch of mechanics concerned with:","o":["The forces that cause motion","The motion of bodies without reference to the forces causing it","Objects in equilibrium only","Energy transfer between bodies"],"a":1,"e":"Kinematics describes motion itself (distance, displacement, speed, velocity, acceleration) without considering the forces responsible for it — that's kinetics/dynamics."},{"i":"PHY-1skaQbmb-004","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Speed is best defined as:","o":["The rate of change of displacement","How fast a body is travelling, without regard to direction","The rate of change of velocity","A vector describing motion"],"a":1,"e":"Speed is a scalar — it tells you how fast a body moves but carries no directional information."},{"i":"PHY-1skaQbmb-005","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Velocity differs from speed because velocity:","o":["Is always larger in value","Includes direction as well as magnitude","Cannot be negative","Is measured in different units"],"a":1,"e":"Velocity is the vector counterpart of speed — same units, but it specifies direction too."},{"i":"PHY-1skaQbmb-006","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Acceleration is defined as:","o":["The rate of change of displacement","The rate of change of speed or velocity","The total distance covered per unit time","A quantity that is always positive"],"a":1,"e":"Acceleration measures how quickly velocity (or speed) is changing with time."},{"i":"PHY-1skaQbmb-007","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Which statement about acceleration is TRUE?","o":["Acceleration can only be a vector quantity","Acceleration can be scalar or vector depending on context","Acceleration is always constant","Acceleration has no SI unit"],"a":1,"e":"The notes state acceleration can be treated as scalar or vector depending on how it's being described."},{"i":"PHY-1skaQbmb-008","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Negative acceleration is also known as:","o":["Displacement","Retardation (deceleration)","Uniform motion","Instantaneous velocity"],"a":1,"e":"A negative value of acceleration is commonly called deceleration or retardation — the body is slowing down."},{"i":"PHY-1skaQbmb-009","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Distance and displacement are both measured in:","o":["Metres per second (m/s)","Metres (m)","Metres per second squared (m/s²)","Newtons (N)"],"a":1,"e":"Both are length quantities, so their SI unit is the metre, m."},{"i":"PHY-1skaQbmb-010","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Speed and velocity are both measured in:","o":["Metres (m)","Seconds (s)","Metres per second (ms⁻¹)","Metres per second squared (ms⁻²)"],"a":2,"e":"Speed and velocity describe how fast position changes with time, so their unit is ms⁻¹."},{"i":"PHY-1skaQbmb-011","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Acceleration is measured in:","o":["ms⁻¹","ms⁻²","m","Dimensionless"],"a":1,"e":"Acceleration is the rate of change of velocity with time, giving units of ms⁻²."},{"i":"PHY-1skaQbmb-012","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"A particle in mechanics is best described as:","o":["A body with significant size and shape","An idealisation with mass concentrated at a point, negligible size, and no rotation","A body that only moves in circles","Any object heavier than 1 kg"],"a":1,"e":"A particle is an idealised point mass — it has location but not rotation, and negligible size/shape."},{"i":"PHY-1skaQbmb-013","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"In rectilinear kinematics, displacement Δs is defined as:","o":["s + s′","s′ − s","s′ × s","s / s′"],"a":1,"e":"Displacement is the change in position: Δs = s′ − s, where s′ is the new position and s the original one."},{"i":"PHY-1skaQbmb-014","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Mechanics is divided into statics and dynamics. Dynamics itself splits into:","o":["Kinematics and kinetics","Distance and displacement","Speed and velocity","Vectors and scalars"],"a":0,"e":"Dynamics (objects in motion) is divided into kinematics (geometric aspects of motion) and kinetics (analysis of the forces causing motion)."},{"i":"PHY-1skaQbmb-015","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Which equation correctly relates v, u, a and t?","o":["v = u + at","v = u − at²","v² = u + 2as","s = vt + ½at"],"a":0,"e":"v = u + at is the first of the standard suvat equations for constant acceleration."},{"i":"PHY-1skaQbmb-016","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Which equation is used to find displacement when acceleration is NOT known?","o":["v = u + at","s = ½(u + v)t","v² = u² + 2as","s = ut + ½at²"],"a":1,"e":"s = ½(u + v)t only needs initial velocity, final velocity and time — no acceleration required."},{"i":"PHY-1skaQbmb-017","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Which suvat equation does NOT contain time, t?","o":["v = u + at","s = ut + ½at²","v² = u² + 2as","s = ½(u + v)t"],"a":2,"e":"v² = u² + 2as is the only one of the five suvat equations that has no t term — useful when time isn't given."},{"i":"PHY-1skaQbmb-018","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"The suvat equation s = vt − ½at² is most useful when:","o":["u is unknown but v, a and t are known","a is unknown","t is unknown","v is unknown"],"a":0,"e":"This form of the displacement equation lets you find s without ever needing the initial velocity u."},{"i":"PHY-1skaQbmb-019","c":"PHY","u":"Kinematics: suvat equations","s":"fill","q":"In the suvat equations, the letter 'a' conventionally stands for ______.","acc":["acceleration"],"e":"'a' represents acceleration, measured in ms⁻²."},{"i":"PHY-1skaQbmb-020","c":"PHY","u":"Kinematics: suvat equations","s":"fill","q":"In the suvat equations, the letter 'u' conventionally stands for the ______ velocity.","acc":["initial"],"e":"'u' is the initial (starting) velocity, while 'v' is the final velocity."},{"i":"PHY-1skaQbmb-021","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"For vertical motion under gravity near Earth's surface, the value of g used in the notes is approximately:","o":["6.4 ms⁻²","9.8 ms⁻²","10.8 ms⁻²","12.0 ms⁻²"],"a":1,"e":"The acceleration due to gravity used throughout the notes is g ≈ 9.8 ms⁻² (sometimes approximated to 10 ms⁻² in quick calculations)."},{"i":"PHY-1skaQbmb-022","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Deriving v² = u² + 2as starts by eliminating which variable between v = u + at and s = ½(u+v)t?","o":["s","u","t","a"],"a":2,"e":"You make t the subject of v = u + at, then substitute it into s = ½(u+v)t to eliminate t and arrive at v² = u² + 2as."},{"i":"PHY-1skaQbmb-023","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"The suvat equations apply strictly to motion with:","o":["Constant acceleration in a straight line","Any acceleration in any path","Zero acceleration only","Circular motion only"],"a":0,"e":"All five suvat equations assume a particle moving in a straight line with constant (uniform) acceleration."},{"i":"PHY-1skaQbmb-024","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Which pair of suvat equations both allow you to solve for displacement s?","o":["v=u+at and v²=u²+2as","s=ut+½at² and s=½(u+v)t","v=u+at only","None of the equations solve for s"],"a":1,"e":"s = ut + ½at² and s = ½(u+v)t are both explicit expressions for displacement."},{"i":"PHY-1skaQbmb-025","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A ball is dropped from rest and falls 80 m before hitting the ground (take g = 10 ms⁻²). How long does it take to land?","o":["2 s","4 s","6 s","8 s"],"a":1,"e":"Using s = ut + ½at² with u=0: 80 = 0 + ½(10)t² → t² = 16 → t = 4 s."},{"i":"PHY-1skaQbmb-026","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"Using the previous scenario (dropped from rest, falls 80 m, g = 10 ms⁻²), what speed does it hit the ground with?","o":["20 ms⁻¹","40 ms⁻¹","400 ms⁻¹","4 ms⁻¹"],"a":1,"e":"v = u + at = 0 + 10(4) = 40 ms⁻¹."},{"i":"PHY-1skaQbmb-027","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A stone is thrown vertically upward with a speed of 30 ms⁻¹ (g = 10 ms⁻²). How long does it take to reach maximum height?","o":["1 s","2 s","3 s","4 s"],"a":2,"e":"At maximum height v = 0: t = (v−u)/a = (0−30)/(−10) = 3 s."},{"i":"PHY-1skaQbmb-028","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"For the same stone (u = 30 ms⁻¹ upward, g = 10 ms⁻²), what maximum height does it reach?","o":["30 m","45 m","60 m","90 m"],"a":1,"e":"v²=u²+2as with v=0: 0 = 900 − 20s → s = 45 m."},{"i":"PHY-1skaQbmb-029","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A stone is thrown vertically upward with a speed of 10 ms⁻¹ from a point 15 m above the ground (g = 9.8 ms⁻²). What is the maximum height above the ground it reaches (to 3 s.f.)?","o":["5.10 m","15.0 m","20.1 m","25.1 m"],"a":2,"e":"Using v²=u²+2as with v=0: 0=100−19.6s → s≈5.10 m above the throw point, and 5.10+15=20.1 m above the ground (as worked in the class example)."},{"i":"PHY-1skaQbmb-030","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A body dropped from rest falls freely for 3 seconds (g = 10 ms⁻²). How far has it fallen?","o":["15 m","30 m","45 m","90 m"],"a":2,"e":"s = ut + ½at² = 0 + ½(10)(9) = 45 m."},{"i":"PHY-1skaQbmb-031","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A stone is dropped from a cliff and lands on the beach 3.2 s later (g = 10 ms⁻²). How high is the cliff (to 1 d.p.)?","o":["25.6 m","32.0 m","51.2 m","64.0 m"],"a":2,"e":"s = ½ g t² = ½(10)(3.2)² = ½(10)(10.24) = 51.2 m."},{"i":"PHY-1skaQbmb-032","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A stone is dropped from 45 m (g = 10 ms⁻²). What is its velocity just before impact?","o":["10 ms⁻¹","20 ms⁻¹","30 ms⁻¹","45 ms⁻¹"],"a":2,"e":"v² = u² + 2as = 0 + 2(10)(45) = 900 → v = 30 ms⁻¹."},{"i":"PHY-1skaQbmb-033","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A ball is thrown vertically downward with an initial speed of 5 ms⁻¹ from a height of 60 m (g = 10 ms⁻²). With what speed does it strike the ground?","o":["25 ms⁻¹","30 ms⁻¹","35 ms⁻¹","40 ms⁻¹"],"a":2,"e":"v² = u² + 2as = 25 + 2(10)(60) = 1225 → v = 35 ms⁻¹."},{"i":"PHY-1skaQbmb-034","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"For the ball thrown downward in the previous question (u = 5 ms⁻¹, v = 35 ms⁻¹, g = 10 ms⁻²), how long does it take to strike the ground?","o":["2 s","3 s","4 s","5 s"],"a":1,"e":"t = (v−u)/a = (35−5)/10 = 3 s."},{"i":"PHY-1skaQbmb-035","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A ball is thrown upward with initial velocity u from a point 1.2 m above the ground and reaches a maximum height of 23 m above the ground (g = 9.8 ms⁻²). What is the initial velocity u (to 3 s.f.)?","o":["14.8 ms⁻¹","19.0 ms⁻¹","20.7 ms⁻¹","23.0 ms⁻¹"],"a":1,"e":"Rise above the throw point is 23−1.2=21.8 m. v²=u²−2gs with v=0: u²=2(9.8)(21.8)≈427.3 → u≈ 20.7 ms⁻¹... using the exact suvat value the notes accept ≈20.7 ms⁻¹ (closest option).","f":"source answer key (index 1 = 19.0) conflicts with its own explanation, which computes 20.7 ms-1 (index 2). Needs lecturer/owner confirmation; key left unchanged."},{"i":"PHY-1skaQbmb-036","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A particle moves from rest along a circle of radius 4 m with a constant tangential acceleration of 3 m/s². What is the tangential velocity at t = 2 s?","o":["3 m/s","6 m/s","9 m/s","12 m/s"],"a":1,"e":"v = u + at = 0 + 3(2) = 6 m/s (tangential component)."},{"i":"PHY-1skaQbmb-037","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A car starts from rest and accelerates uniformly at 2 ms⁻² for 5 s. What is its final velocity?","o":["5 ms⁻¹","7 ms⁻¹","10 ms⁻¹","20 ms⁻¹"],"a":2,"e":"v = u + at = 0 + 2(5) = 10 ms⁻¹."},{"i":"PHY-1skaQbmb-038","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"Using the same car (u=0, a=2 ms⁻², t=5 s), what distance does it cover?","o":["10 m","15 m","20 m","25 m"],"a":3,"e":"s = ut + ½at² = 0 + ½(2)(25) = 25 m."},{"i":"PHY-1skaQbmb-039","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A cyclist travelling at 20 ms⁻¹ decelerates uniformly at 2 ms⁻². How long until the cyclist stops?","o":["5 s","8 s","10 s","12 s"],"a":2,"e":"t = (v−u)/a = (0−20)/(−2) = 10 s."},{"i":"PHY-1skaQbmb-040","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"For the cyclist above (u = 20 ms⁻¹, decelerating at 2 ms⁻²), what distance is covered before stopping?","o":["50 m","100 m","150 m","200 m"],"a":1,"e":"s = (u+v)/2 × t = (20+0)/2 × 10 = 100 m (or use v²=u²+2as)."},{"i":"PHY-1skaQbmb-041","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A particle moves with a constant acceleration of 3 ms⁻², starting with velocity 15 ms⁻¹. What is its velocity after 4 seconds?","o":["18 ms⁻¹","21 ms⁻¹","27 ms⁻¹","30 ms⁻¹"],"a":2,"e":"v = u + at = 15 + 3(4) = 27 ms⁻¹."},{"i":"PHY-1skaQbmb-042","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"For the same particle (u=15 ms⁻¹, a=3 ms⁻², t=4 s), what distance does it cover?","o":["60 m","72 m","84 m","96 m"],"a":2,"e":"s = ut + ½at² = 15(4) + ½(3)(16) = 60 + 24 = 84 m."},{"i":"PHY-1skaQbmb-043","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A body's velocity increases from 5 ms⁻¹ to 25 ms⁻¹ in 4 seconds under constant acceleration. What is the acceleration?","o":["2 ms⁻²","4 ms⁻²","5 ms⁻²","10 ms⁻²"],"a":2,"e":"a = (v−u)/t = (25−5)/4 = 5 ms⁻²."},{"i":"PHY-1skaQbmb-044","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"For the body above (u=5, v=25 ms⁻¹, t=4 s), what distance is covered?","o":["30 m","45 m","60 m","75 m"],"a":2,"e":"s = ½(u+v)t = ½(5+25)(4) = 60 m."},{"i":"PHY-1skaQbmb-045","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A train decelerates from 12 ms⁻¹ to rest at 3 ms⁻². What distance does it cover while stopping?","o":["12 m","18 m","24 m","36 m"],"a":2,"e":"v²=u²+2as → 0=144−6s → s=24 m."},{"i":"PHY-1skaQbmb-046","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A car moving at 20 ms⁻¹ brakes to a stop over a distance of 40 m. What is its (constant) deceleration?","o":["2 ms⁻²","4 ms⁻²","5 ms⁻²","10 ms⁻²"],"a":2,"e":"v²=u²+2as → 0=400+2a(40) → a=−5 ms⁻², i.e. deceleration of 5 ms⁻²."},{"i":"PHY-1skaQbmb-047","c":"PHY","u":"Kinematics: suvat problems","s":"fill","q":"A particle starting from rest accelerates uniformly at 1.5 ms⁻² for 8 seconds. Its final velocity, in ms⁻¹, is ______.","acc":["12"],"e":"v = u + at = 0 + 1.5(8) = 12 ms⁻¹."},{"i":"PHY-1skaQbmb-048","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A particle moves from A to C via B with constant acceleration 1 ms⁻², passing B after 6 s and C after a further 4 s (total 10 s from A), with velocity 50 ms⁻¹ at C. What is its velocity at A?","o":["30 ms⁻¹","35 ms⁻¹","40 ms⁻¹","45 ms⁻¹"],"a":2,"e":"v = u + at → 50 = u + 1(10) → u = 40 ms⁻¹."},{"i":"PHY-1skaQbmb-049","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"In rectilinear kinematics, velocity is related to position by which expression?","o":["v = ds/dt","v = dt/ds","v = d²s/dt²","v = s/t²"],"a":0,"e":"Velocity is the instantaneous rate of change of position with respect to time: v = ds/dt."},{"i":"PHY-1skaQbmb-050","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"Acceleration in terms of velocity is given by:","o":["a = ds/dt","a = dv/dt","a = s/t","a = v/t²"],"a":1,"e":"Acceleration is the rate of change of velocity with time: a = dv/dt."},{"i":"PHY-1skaQbmb-051","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"For constant acceleration aᴄ, integrating aᴄ = dv/dt from v₀ at t=0 gives:","o":["v = v₀ + aᴄt","v = v₀ − aᴄt","v = aᴄt²","v = v₀t"],"a":0,"e":"Integrating the constant aᴄ with respect to t and applying v=v₀ at t=0 recovers v = v₀ + aᴄt — the familiar suvat equation derived from calculus."},{"i":"PHY-1skaQbmb-052","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"Integrating v = v₀ + aᴄt with respect to time (from s₀ at t=0) gives the position function:","o":["s = s₀ + v₀t + ½aᴄt²","s = s₀ − v₀t − ½aᴄt²","s = v₀ + aᴄt","s = s₀ + ½v₀t"],"a":0,"e":"This is the calculus derivation of s = s₀ + v₀t + ½aᴄt², matching the suvat displacement equation."},{"i":"PHY-1skaQbmb-053","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"The relation v² = v₀² + 2aᴄ(s − s₀) is obtained by integrating which expression?","o":["v dv = aᴄ ds","dv/dt = s","ds = v² dt","aᴄ dt = s dv"],"a":0,"e":"Starting from aᴄ = v(dv/ds), integrating v dv = aᴄ ds gives v² = v₀² + 2aᴄ(s−s₀) — the calculus route to v²=u²+2as."},{"i":"PHY-1skaQbmb-054","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"A particle's coordinates at time t are given by x = ct² and y = bt². What can be said about its path?","o":["It moves along a straight line through the origin","It moves in a circle","It moves along a parabola only","Its motion cannot be determined"],"a":0,"e":"Since y/x = b/c is constant for all t, the particle traces a straight line through the origin, though its speed changes with time."},{"i":"PHY-1skaQbmb-055","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"If position s(t) = 3t³ − 2t, what is the velocity function v(t)?","o":["v = 9t² − 2","v = t² − 2t","v = 9t − 2","v = 3t² − 2"],"a":0,"e":"Differentiate s(t) term by term: d/dt(3t³)=9t², d/dt(−2t)=−2, giving v(t)=9t²−2."},{"i":"PHY-1skaQbmb-056","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"For s(t) = 3t³ − 2t, what is the acceleration function a(t)?","o":["a = 18t","a = 9t","a = 6t","a = 3t²"],"a":0,"e":"Differentiate v(t) = 9t²−2 to get a(t) = d/dt(9t²−2) = 18t."},{"i":"PHY-1skaQbmb-057","c":"PHY","u":"Kinematics: Definitions","s":"fill","q":"The quantity that describes how far a body is from its starting point, and in what direction, is called ______.","acc":["displacement"],"e":"Displacement is the vector quantity describing distance from start point plus direction."},{"i":"PHY-1skaQbmb-058","c":"PHY","u":"Kinematics: Definitions","s":"fill","q":"The amount of 'ground' covered by a moving body, regardless of direction, is called ______.","acc":["distance"],"e":"Distance is the scalar total path length travelled."},{"i":"PHY-1skaQbmb-059","c":"PHY","u":"Kinematics: suvat equations","s":"fill","q":"The suvat equation that has no acceleration term is s = ½(______ + v)t.","acc":["u"],"e":"s = ½(u + v)t needs only initial velocity u, final velocity v and time t — acceleration is not required."},{"i":"PHY-1skaQbmb-060","c":"PHY","u":"Kinematics: Vertical motion","s":"fill","q":"For an object thrown vertically upward, at the point of maximum height, its instantaneous velocity is ______.","acc":["0","zero"],"e":"At maximum height the object momentarily stops rising before falling back, so v = 0 there."},{"i":"PHY-1skaQbmb-061","c":"PHY","u":"Kinematics: Calculus kinematics","s":"fill","q":"If v(t) = ds/dt, then acceleration a(t) can also be written as the ______ derivative of position with respect to time.","acc":["second"],"e":"Since a = dv/dt = d(ds/dt)/dt = d²s/dt², acceleration is the second derivative of position with respect to time."},{"i":"PHY-1skaQbmb-062","c":"PHY","u":"Kinematics: suvat problems","s":"fill","q":"A stone thrown vertically upward returns to its starting height with a speed ______ its initial launch speed (assuming no air resistance).","acc":["equal to","equal","same as","the same as"],"e":"By symmetry of projectile motion under constant gravity, the return speed at the launch height equals the initial launch speed."},{"i":"PHY-1umTOHQy-001","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which of the following is a non-conservative force?","o":["Gravitational force","Elastic (spring) force","Friction","Electrostatic force"],"a":2,"e":"Friction is path-dependent and dissipates mechanical energy as heat, so it is non-conservative — unlike gravity, elastic, and electrostatic forces."},{"i":"PHY-1umTOHQy-002","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A 2kg ball moving at 6 m/s collides with a stationary 3kg ball. After collision, the 2kg ball moves at 2 m/s. Find the 3kg ball's velocity (momentum conserved).","o":["2.67 m/s","4 m/s","6 m/s","1.33 m/s"],"a":0,"e":"Total momentum before = total momentum after: 2(6) + 3(0) = 2(2) + 3v → 12 = 4 + 3v → v = 2.67 m/s."},{"i":"PHY-1umTOHQy-003","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which statement correctly defines a conservative force?","o":["It does positive work over any closed path","It does zero net work over any closed path","It depends on the object's mass only","It always points toward a fixed centre"],"a":1,"e":"A conservative force does zero net work over any closed path; a non-conservative force like friction does negative work over a closed path, dissipating energy as heat."},{"i":"PHY-1umTOHQy-004","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"According to the law of conservation of electric charge:","o":["It can be created but not destroyed","It cannot be created or destroyed, only transferred","It can be destroyed but not created","It is not a conserved quantity"],"a":1,"e":"Electric charge cannot be created or destroyed — it can only be transferred between objects or conserved within an isolated system."},{"i":"PHY-1umTOHQy-005","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"According to Kepler's Second Law, a planet moves:","o":["At constant speed throughout its orbit","Faster when farther from the Sun","Faster when closer to the Sun","Only in a perfect circle"],"a":2,"e":"Kepler's Second Law (equal areas in equal times) implies a planet moves FASTER when closer to the Sun."},{"i":"PHY-1umTOHQy-006","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"The dimensional formula for force is:","o":["[MLT⁻¹]","[MLT⁻²]","[ML²T⁻²]","[ML⁻¹T⁻²]"],"a":1,"e":"F=ma → dimensions = [M][LT⁻²] = [MLT⁻²]."},{"i":"PHY-1umTOHQy-007","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Earth's axial precession, similar to a spinning top, is caused mainly by:","o":["Solar wind pressure","Gravitational torque from the Sun and Moon","Magnetic field reversal","Atmospheric friction"],"a":1,"e":"Earth's axial precession (~26,000-year cycle) is caused by gravitational torque from the Sun and Moon acting on Earth's equatorial bulge."},{"i":"PHY-1umTOHQy-008","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Negative acceleration is also referred to as:","o":["Impulse","Deceleration/retardation","Displacement","Velocity"],"a":1,"e":"Negative acceleration is called deceleration or retardation."},{"i":"PHY-1umTOHQy-009","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"In unit vector notation, a vector A = 3i + 4j has a magnitude of:","o":["5","7","12","25"],"a":0,"e":"|A| = √(3²+4²) = √25 = 5."},{"i":"PHY-1umTOHQy-010","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which suvat equation would you use to find displacement without knowing final velocity, given u, a, and t?","o":["v=u+at","s=ut+½at²","v²=u²+2as","s=vt−½at²"],"a":1,"e":"s = ut + ½at² uses only u, a, and t — no final velocity v is needed."},{"i":"PHY-1umTOHQy-011","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"The centre of mass of a system remains at rest when:","o":["All internal forces are equal","No net external force acts on the system","The system has only one particle","The system is rotating uniformly"],"a":1,"e":"The centre of mass remains at rest (or in uniform motion) only when no net EXTERNAL force acts on the system — internal forces don't affect it."},{"i":"PHY-1umTOHQy-012","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"According to Einstein's relativity, a clock moving at high speed relative to an observer will:","o":["Tick faster","Tick slower","Stop entirely","Tick at the same rate"],"a":1,"e":"A clock moving at high speed relative to an observer ticks SLOWER from that observer's perspective (time dilation)."},{"i":"PHY-1umTOHQy-013","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A gyroscope maintains its orientation mainly because of:","o":["Conservation of linear momentum","Conservation of angular momentum","Newton's Third Law","Gravitational force"],"a":1,"e":"A gyroscope maintains its orientation due to conservation of angular momentum — its spinning rotor resists changes to its spin axis."},{"i":"PHY-1umTOHQy-014","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which property makes the SI system 'absolute'?","o":["It uses powers of ten","It has no gravitational units, eliminating dependence on g","It assigns one unit per quantity","It was created in 1960"],"a":1,"e":"SI is called 'absolute' because it has no gravitational units, eliminating any dependence on the local value of g."},{"i":"PHY-1umTOHQy-015","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A ball falls from rest and lands after 3 seconds. Find the height it fell from (g=9.8 m/s²).","o":["44.1m","29.4m","88.2m","14.7m"],"a":0,"e":"s = 0 + ½(9.8)(3²) = ½(9.8)(9) = 44.1m."},{"i":"PHY-1umTOHQy-016","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which of these is a vector quantity?","o":["Energy","Temperature","Torque","Density"],"a":2,"e":"Torque has both magnitude and a rotational direction, making it a vector; energy, temperature, and density are all scalars."},{"i":"PHY-1umTOHQy-017","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A boat moves north at 15 m/s in a river flowing west at 8 m/s. Find the boat's resultant speed.","o":["17 m/s","23 m/s","7 m/s","12 m/s"],"a":0,"e":"Resultant = √(15²+8²) = √289 = 17 m/s."},{"i":"PHY-1umTOHQy-018","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Using ω(p) = rMg/(Iω), if the spin rate ω is doubled while other factors remain constant, the precession rate will:","o":["Double","Halve","Remain the same","Quadruple"],"a":1,"e":"Since ω(p) = rMg/(Iω), ω(p) is inversely proportional to ω — doubling ω halves the precession rate."},{"i":"PHY-1umTOHQy-019","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Two vectors of magnitude 4N and 5N act in the same direction. Find their resultant.","o":["1N","9N","6.4N","20N"],"a":1,"e":"Vectors in the same direction simply add: 4N + 5N = 9N."},{"i":"PHY-1umTOHQy-020","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Two masses attract each other with a force of 12N. If the distance between them is tripled, the new force is approximately:","o":["4N","36N","1.33N","6N"],"a":2,"e":"F(new) = F(old)/3² = 12/9 ≈ 1.33N (inverse-square law)."},{"i":"PHY-1umTOHQy-021","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A stone is thrown vertically upward at 10 m/s. Using v²=u²+2as, find the maximum height reached (g=9.8 m/s²).","o":["5.10m","10.2m","1.02m","20.4m"],"a":0,"e":"0 = 10² − 2(9.8)s → s = 100/19.6 ≈ 5.10m."},{"i":"PHY-1umTOHQy-022","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A system that exchanges energy but not matter with its surroundings is called:","o":["An open system","A closed system","An isolated system","A rotary system"],"a":1,"e":"A closed system exchanges energy with its surroundings but not matter, distinguishing it from open (both) and isolated (neither) systems."},{"i":"PHY-1umTOHQy-023","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"The motion of a swinging pendulum bob is an example of:","o":["Rectilinear motion","Rotary motion","Oscillatory motion","Curvilinear motion"],"a":2,"e":"A pendulum bob swinging to and fro about a mean position is the classic example of oscillatory motion."},{"i":"PHY-1umTOHQy-024","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which type of time is measured using caesium atom vibrations?","o":["Sidereal Time","Atomic Time","Universal Time","Biological Time"],"a":1,"e":"Atomic time is measured using the precise vibration frequency of caesium atoms, and defines the SI second."},{"i":"PHY-1umTOHQy-025","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which of the following is a fundamental (base) SI unit?","o":["Newton","Joule","Kilogram","Watt"],"a":2,"e":"Kilogram is one of the 7 SI base (fundamental) units; Newton, Joule, and Watt are all derived units."},{"i":"PHY-1umTOHQy-026","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Newton's Second Law in its most general form is expressed as:","o":["F=ma","F=dp/dt","F=mv","F=m/a"],"a":1,"e":"Newton's Second Law in its most general form is F = dp/dt, which reduces to F=ma for constant mass."},{"i":"PHY-1umTOHQy-027","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"What provides the centripetal force that keeps a satellite in orbit around a planet?","o":["The satellite's own thrust","Gravitational force from the planet","Atmospheric drag","The satellite's angular momentum"],"a":1,"e":"Gravitational force from the planet supplies the inward centripetal force keeping a satellite in orbit."},{"i":"PHY-1umTOHQy-028","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Two masses, 4kg at x=2m and 6kg at x=7m, lie on a line. Find the position of their centre of mass.","o":["5m","4.5m","5.5m","4m"],"a":0,"e":"x(COM) = (4×2 + 6×7)/(4+6) = (8+42)/10 = 5m."},{"i":"PHY-1umTOHQy-029","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A 0.5kg ball moving at 20 m/s is brought to rest in 0.1s. Calculate the impulse delivered to the ball.","o":["10 Ns","100 Ns","2 Ns","0.1 Ns"],"a":0,"e":"Impulse = |Δp| = |0.5(0−20)| = 10 Ns."},{"i":"PHY-1umTOHQy-030","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"1 Newton is equal to how many dynes?","o":["10³","10⁵","10⁷","10⁻⁵"],"a":1,"e":"1 Newton = 10⁵ dyne (standard MKS-to-CGS force conversion)."},{"i":"PHY-1umTOHQy-031","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A passenger is pushed backward when a bus suddenly accelerates forward. This is best explained by:","o":["Newton's Second Law","Newton's Third Law","Newton's First Law","The law of conservation of momentum"],"a":2,"e":"The passenger's inertia (Newton's First Law) causes them to resist the sudden forward acceleration of the bus, appearing pushed backward relative to it."},{"i":"PHY-1umTOHQy-032","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Proper time is best described as:","o":["Time measured by a fixed external observer","The time interval experienced in one's own reference frame","Time based on Earth's rotation","Time defined by caesium vibrations"],"a":1,"e":"Proper time is the time interval experienced by an observer in their own moving reference frame, as opposed to coordinate time measured externally."},{"i":"PHY-1umTOHQy-033","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which of these is NOT a valid reason GPS satellites must apply relativistic corrections?","o":["Motion-based time dilation","Gravitational time dilation","Their high orbital speed","Their use of atomic clocks alone without correction"],"a":3,"e":"GPS satellites DO need corrections for both motion-based and gravitational time dilation due to their speed and altitude — relying on atomic clocks alone without correction would introduce significant errors."},{"i":"PHY-1umTOHQy-034","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which statement correctly distinguishes impulse from force?","o":["They have the same dimensions","Impulse = mass×distance/time; Force = mass×distance/time²","Force is always larger than impulse","Impulse cannot be calculated from force"],"a":1,"e":"Impulse has units of mass×distance/time (momentum units); force has units of mass×distance/time² — they are dimensionally distinct despite the relationship J=F·Δt."},{"i":"PHY-1umTOHQy-035","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"The relationship between orbital period T and orbital radius r for a planet is given by:","o":["T∝r","T²∝r³","T³∝r²","T∝r²"],"a":1,"e":"Kepler's Third Law (Harmonic Law): T² is proportional to r³."},{"i":"PHY-1umTOHQy-036","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Precession occurs when a torque is applied to a spinning gyroscope:","o":["Parallel to its angular momentum vector","Perpendicular to its angular momentum vector","In the same direction as its spin","Opposite to gravity only"],"a":1,"e":"Precession occurs specifically when the applied torque is perpendicular to the angular momentum vector."},{"i":"BIO-UPLOAD-ecoA-001","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The Greek root oikos means","o":["home or dwelling place","earth","life","study or discourse"],"a":0},{"i":"BIO-UPLOAD-ecoA-002","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The Greek root logos means","o":["home or dwelling place","energy","study or discourse","organism"],"a":2},{"i":"BIO-UPLOAD-ecoA-003","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Ecology is the study of living organisms in their","o":["natural homes or dwelling places","cells only","genetic material only","laboratories only"],"a":0},{"i":"BIO-UPLOAD-ecoA-004","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Ecology describes organisms and their interactions with","o":["other organisms and all components of the environment","only climate","only soil","only other animals"],"a":0},{"i":"BIO-UPLOAD-ecoA-005","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The first level considered in ecology is the","o":["community","ecosystem","population","individual (organismal)"],"a":3},{"i":"BIO-UPLOAD-ecoA-006","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The level immediately above individual is","o":["global","community","population","landscape"],"a":2},{"i":"BIO-UPLOAD-ecoA-007","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Populations of different species coexisting and interacting in an area form a","o":["microhabitat","niche","community","species"],"a":2},{"i":"BIO-UPLOAD-ecoA-008","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"An ecosystem includes communities interacting with their","o":["soil only","genes only","physical environment","predators only"],"a":2},{"i":"BIO-UPLOAD-ecoA-009","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The functional role of an organism in an ecosystem is its","o":["habitat","population","niche","biome"],"a":2},{"i":"BIO-UPLOAD-ecoA-010","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"A niche involves interactions with","o":["biotic and abiotic components","abiotic components only","biotic components only","other individuals only"],"a":0},{"i":"BIO-UPLOAD-ecoA-011","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The two major types of niche listed are","o":["terrestrial and aquatic","primary and secondary","fundamental and realized","biotic and abiotic"],"a":2},{"i":"BIO-UPLOAD-ecoA-012","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The typical living area of an organism is its","o":["habitat","community","niche","population"],"a":0},{"i":"BIO-UPLOAD-ecoA-013","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"A small habitat with special living conditions is a","o":["global system","microhabitat","population","landscape"],"a":1},{"i":"BIO-UPLOAD-ecoA-014","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The complete range of external conditions in which organisms live is the","o":["environment","niche","community","trophic level"],"a":0},{"i":"BIO-UPLOAD-ecoA-015","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Living parts of an ecosystem are called","o":["edaphic factors","topographic factors","abiotic components","biotic components"],"a":3},{"i":"BIO-UPLOAD-ecoA-016","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Plants, animals and microorganisms are examples of","o":["climatic factors","topographic factors","abiotic components","biotic components"],"a":3},{"i":"BIO-UPLOAD-ecoA-017","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Climate, rock, soil, air and water are examples of","o":["abiotic components","biotic components","consumers","producers"],"a":0},{"i":"BIO-UPLOAD-ecoA-018","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Light, temperature, wind and water are listed as","o":["topographic factors","trophic factors","edaphic factors","climatic factors"],"a":3},{"i":"BIO-UPLOAD-ecoA-019","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Soil texture, soil pH, depth and organic matter are","o":["topographic factors","biotic factors","climatic factors","edaphic factors"],"a":3},{"i":"BIO-UPLOAD-ecoA-020","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Slope angle, aspect, relief and height above sea level are","o":["edaphic factors","biotic factors","topographic factors","climatic factors"],"a":2},{"i":"BIO-UPLOAD-ecoA-021","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The ecological level above community is","o":["ecosystem","population","individual","global"],"a":0},{"i":"BIO-UPLOAD-ecoA-022","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The two broad ecosystem types listed are","o":["grazing and detrital","biotic and abiotic","terrestrial and aquatic","fundamental and realized"],"a":2},{"i":"BIO-UPLOAD-ecoA-023","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The highest ecological level listed in the notes is","o":["landscape","community","global","ecosystem"],"a":2},{"i":"BIO-UPLOAD-ecoA-024","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Landscape is listed as an ecological level between","o":["community and ecosystem","population and community","individual and population","ecosystem and global"],"a":3},{"i":"BIO-UPLOAD-ecoA-025","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"A group of individual organisms usually of one species occupying a defined area is a","o":["population","community","niche","ecosystem"],"a":0},{"i":"BIO-UPLOAD-ecoA-026","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"A population is isolated to some degree from other","o":["habitats","ecosystems","climatic factors","similar groups"],"a":3},{"i":"BIO-UPLOAD-ecoA-027","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Spatial and trophic relationships are specifically mentioned in the definition of","o":["habitat","community","niche","population"],"a":1},{"i":"BIO-UPLOAD-ecoA-028","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The community forms the ______ environment.","o":["biotic","topographic","edaphic","abiotic"],"a":0},{"i":"BIO-UPLOAD-ecoA-029","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The non-living part forms the ______ environment.","o":["community","trophic","abiotic","biotic"],"a":2},{"i":"BIO-UPLOAD-ecoA-030","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"A habitat differs from a niche because habitat refers mainly to","o":["where an organism lives","nutrient cycling","the functional role of an organism","energy loss"],"a":0},{"i":"BIO-UPLOAD-ecoA-031","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"A niche differs from a habitat because niche describes","o":["only soil conditions","only the physical location","only climate","the functional role and interactions of an organism"],"a":3},{"i":"BIO-UPLOAD-ecoA-032","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Which is living?","o":["rock","air","fungus","soil"],"a":2},{"i":"BIO-UPLOAD-ecoA-033","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Which is non-living?","o":["temperature","bacteria","animal","plant"],"a":0},{"i":"BIO-UPLOAD-ecoA-034","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Which is an edaphic factor?","o":["light","slope angle","wind","soil pH"],"a":3},{"i":"BIO-UPLOAD-ecoA-035","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Which is a climatic factor?","o":["slope aspect","temperature","soil texture","soil pH"],"a":1},{"i":"BIO-UPLOAD-ecoA-036","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Which is a topographic factor?","o":["soil depth","water","height above sea level","organic matter"],"a":2},{"i":"BIO-UPLOAD-ecoA-037","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Which pair contains only abiotic factors?","o":["animals and bacteria","algae and trees","light and soil pH","plants and fungi"],"a":2},{"i":"BIO-UPLOAD-ecoA-038","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"Which pair contains only biotic components?","o":["temperature and wind","air and water","plants and microorganisms","rock and soil"],"a":2},{"i":"BIO-UPLOAD-ecoA-039","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"A tiny area within a larger habitat with special conditions is a","o":["microhabitat","population","landscape","global level"],"a":0},{"i":"BIO-UPLOAD-ecoA-040","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The ecological study of organisms at the level of one organism is the","o":["landscape level","global level","community level","individual/organismal level"],"a":3},{"i":"BIO-UPLOAD-ecoA-041","c":"BIO","u":"Introduction & Ecological Definitions","s":"mcq","q":"The population level focuses on","o":["all species in an area","a group of organisms usually of one species","all ecosystems globally","one physical rock"],"a":1},{"i":"BIO-UP async function finishSession(auto, early) {

    s.qs = s.qs.filter((_, i) => keep[i]); s.flags = s.flags.filter((_, i) => keep[i]); s.answers = s.answers.filter((_, i) => keep[i]); s.n = s.qs.length;
