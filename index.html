/* ---------- item analysis: question id and right/wrong only, no names or devices ---------- */
function postItemAnswers(s) {
  if (!liveOn()) return;
  const rows = [];
  s.qs.forEach((q, i) => {
    const a = s.answers[i]; if (a == null || a === '') return;
    rows.push({ question_id: q.id, correct: Core.isCorrect(q, a), mode: s.mode });
  });
  if (!rows.length || typeof fetch !== 'function') return;
  try { fetch(LB.url + '/rest/v1/question_answers', { method: 'POST', headers: sbHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(rows.slice(0, 300)) }).catch(() => {}); } catch (e) { /* stats are optional */ }
}

/* ---------- schedule poll: when should qualifications hold? One vote per person. ---------- */
const CUP_POLL = { id: 'cup-timing-s1', title: 'When should the Programme Cup run?', question: 'Vote for the time you want. The most votes wins.', options: [
  { id: 'wed-7pm', label: 'Wednesday, 7pm' }, { id: 'wed-9pm', label: 'Wednesday, 9pm' },
  { id: 'sat-1pm', label: 'Saturday, 1pm' }, { id: 'sat-5pm', label: 'Saturday, 5pm' }] };
const QUAL_POLL = { id: 'qualifications-2026-s1', question: 'When should programme qualifications hold? (Lagos time)', options: [
  { id: 'today-8pm', label: 'Today, 8pm' }, { id: 'today-9pm', label: 'Today, 9pm' },
  { id: 'tomorrow-7pm', label: 'Tomorrow, 7pm' }, { id: 'tomorrow-8pm', label: 'Tomorrow, 8pm' }] };
async function pollCounts(pollId) {
  const rows = await sbGet('poll_votes?poll_id=eq.' + encodeURIComponent(pollId) + '&select=option_id,voter');
  if (!Array.isArray(rows)) return null;
  const counts = {}; let mine = null;
  rows.forEach(r => { counts[r.option_id] = (counts[r.option_id] || 0) + 1; if (r.voter === DB.dev) mine = r.option_id; });
  return { counts, mine, total: rows.length };
}
function pollCard(P) {
  const poll = P || QUAL_POLL;
  const box = h('div', { class: 'stack' }, h('p', { class: 'muted small' }, 'Loading\u2026'));
  const write = h('input', { type: 'text', maxlength: '30', placeholder: 'Type your own date or time, e.g. Sat 3pm' });
  const draw = async () => {
    if (!liveOn()) { box.replaceChildren(h('p', { class: 'muted small' }, 'The poll opens when the live database is connected.')); return; }
    const data = await pollCounts(poll.id);
    if (!data) { box.replaceChildren(h('p', { class: 'muted small' }, 'Could not load the poll.')); return; }
    const castOrder = poll.options.map(o => o.id);
    const suggestions = Object.keys(data.counts).filter(k => k.indexOf('write:') === 0).sort((x, y) => data.counts[y] - data.counts[x]);
    const row = (id, label) => {
      const n = data.counts[id] || 0, pct = data.total ? Math.round(n / data.total * 100) : 0;
      return h('button', { class: 'btn block', 'aria-pressed': String(data.mine === id), disabled: !!data.mine, style: { justifyContent: 'space-between', marginTop: '6px' },
        onclick: () => castVote(id) },
        h('span', null, (data.mine === id ? '\u2714 ' : '') + label), h('span', { class: 'small muted' }, n + ' \u2022 ' + pct + '%'));
    };
    const children = poll.options.map(o => row(o.id, o.label));
    if (suggestions.length) children.push(h('p', { class: 'tiny muted', style: { marginTop: '10px' } }, 'Other suggestions'), ...suggestions.map(id => row(id, id.slice(6))));
    if (!data.mine) children.push(h('div', { class: 'row', style: { marginTop: '10px' } }, write, h('button', { class: 'btn primary', onclick: () => { const t = write.value.trim().slice(0, 30); if (t.length < 2) { toast('Type a date or time first.'); return; } castVote('write:' + t); } }, 'Vote')));
    children.push(h('p', { class: 'tiny muted' }, data.total + ' vote' + (data.total === 1 ? '' : 's') + '. You can vote once.'));
    box.replaceChildren(...children);
  };
  async function castVote(optionId) {
    const r = await fetch(LB.url + '/rest/v1/poll_votes', { method: 'POST', headers: sbHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ poll_id: poll.id, option_id: optionId, voter: DB.dev }) }).catch(() => null);
    if (r && r.ok) { toast('Vote saved. Thank you.'); draw(); } else { toast('Could not save your vote. You may have voted already.'); draw(); }
  }
  draw();
  return h('section', { class: 'panel stack' }, h('h2', null, poll.title || 'Qualifications poll'), h('p', { class: 'muted small' }, poll.question), box);
}

/* ---------- push alerts: students opt in; the admin sends from the Admin page ---------- */
const PUSH_FN = () => LB.url + '/functions/v1/hub-push';
function b64uToBytes(str) { const s = str.replace(/-/g, '+').replace(/_/g, '/'); const pad = s.length % 4 ? '='.repeat(4 - (s.length % 4)) : ''; const bin = atob(s + pad); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
function bytesToB64u(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

async function enablePushAlerts() {
  if (!(await pushSupported())) { toast('Your browser does not support alerts. On iPhone, add the app to the home screen first.'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Alerts stay off until you allow notifications.'); return; }
  try {
    const got = await fetch(PUSH_FN(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'public' }) }).then(r => r.json());
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(got.public) }));
    const j = sub.toJSON();
    await fetch(LB.url + '/rest/v1/push_subscriptions', { method: 'POST', headers: sbHeaders({ Prefer: 'resolution=ignore-duplicates,return=minimal' }), body: JSON.stringify({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }) });
    DB.alerts = true; save();
    toast('Alerts are on. You will hear about polls and the Cup.');
    settingsView();
  } catch (e) { toast('Could not turn on alerts. Check your connection and try again.'); }
}
/* admin: send an alert to everyone who turned them on */
function loadAlertForm(pass, container) {
  const title = h('input', { type: 'text', maxlength: '60', placeholder: 'Title, e.g. Poll is open' });
  const body = h('input', { type: 'text', maxlength: '200', placeholder: 'Message, e.g. Vote for the Cup time' });
  const out = h('p', { class: 'small muted' });
  const send = async () => {
    if (title.value.trim().length < 2) { toast('Add a title.'); return; }
    out.textContent = 'Sending\u2026';
    const r = await fetch(PUSH_FN(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'send', token: adminToken(), pass, title: title.value.trim(), body: body.value.trim(), url: './' }) }).then(x => x.json()).catch(() => null);
    out.textContent = r && r.ok ? 'Sent to ' + r.sent + ' of ' + r.subscribers + ' subscribers.' + (r.removed ? ' Removed ' + r.removed + ' dead subscriptions.' : '') : ((r && r.error) || 'Could not send.');
  };
  const box = h('section', { class: 'panel stack' }, h('h2', null, 'Send an alert'), title, body, h('button', { class: 'btn primary block', onclick: send }, 'Send to everyone who turned alerts on'), out);
  container.append(box);
}
