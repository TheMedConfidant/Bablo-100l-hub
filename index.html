<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1F3D">
<title>Bablo 100L Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F9;--surface:#FFFFFF;--surface2:#E8EEF5;--ink:#0E1F3D;--ink2:#52627C;--line:#D5DEEA;--brand:#0B7A75;--brand-ink:#FFFFFF;--brand-soft:#D8F0EE;--gold:#B7791F;--gold-soft:#F6E7C6;--ok:#16825D;--ok-soft:#D6F1E5;--bad:#C93B54;--bad-soft:#FADADF;--warn:#9A6B12;--focus:#2F6FDB;--shadow:0 1px 2px rgba(14,31,61,.08),0 8px 24px rgba(14,31,61,.06);--r:14px;--head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1424;--surface:#111F36;--surface2:#182A47;--ink:#E8EEF8;--ink2:#9DB0CB;--line:#23375A;--brand:#2CC0B8;--brand-ink:#04211F;--brand-soft:#0F3A3E;--gold:#E3B04B;--gold-soft:#3A2E12;--ok:#3DD598;--ok-soft:#0F3A2B;--bad:#FF7088;--bad-soft:#401923;--warn:#E3B04B;--focus:#7AA7FF;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0A1424;--surface:#111F36;--surface2:#182A47;--ink:#E8EEF8;--ink2:#9DB0CB;--line:#23375A;--brand:#2CC0B8;--brand-ink:#04211F;--brand-soft:#0F3A3E;--gold:#E3B04B;--gold-soft:#3A2E12;--ok:#3DD598;--ok-soft:#0F3A2B;--bad:#FF7088;--bad-soft:#401923;--warn:#E3B04B;--focus:#7AA7FF;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}h2{font-size:1.25rem;font-weight:700}h3{font-size:1.05rem;font-weight:700}
p{margin:0}button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--ink2)}.small{font-size:.875rem}.tiny{font-size:.78rem}.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}.wrapr{flex-wrap:wrap}.between{justify-content:space-between}
.stack>*+*{margin-top:12px}.stack-l>*+*{margin-top:22px}
sup{font-size:.7em;line-height:0}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:9px;font:800 1.1rem var(--head);text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.brand{background:var(--brand-soft);color:var(--brand)}
/* hero (the one bold moment: pulse trace) */
.hero{position:relative;padding:20px 18px 14px;border-radius:20px;background:linear-gradient(135deg,#0E1F3D,#12365F 60%,#0B6B6A);color:#F2F7FF;overflow:hidden}
.hero h1{font-size:1.6rem}.hero p{color:#C4D4EC;margin-top:4px}
.pulse{display:block;width:100%;height:56px;margin-top:10px}
.pulse path{fill:none;stroke:#5EEAD4;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.2s ease-out .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-stats{display:flex;gap:22px;margin-top:6px;flex-wrap:wrap}.hero-stats b{font:800 1.3rem var(--head);display:block}.hero-stats span{font-size:.78rem;color:#C4D4EC}
/* courses */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px 12px 18px;box-shadow:var(--shadow);min-height:132px;display:flex;flex-direction:column;gap:6px}
.tile::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--c,var(--brand))}
.tile .code{font:800 1.15rem var(--head)}.tile .meta{font-size:.82rem;color:var(--ink2)}
.tile.pending{background:transparent;border:1.5px dashed var(--line);box-shadow:none;color:var(--ink2)}
.tile.pending::before{background:var(--line)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--c,var(--brand));border-radius:99px}
.status{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--brand)}.pending .status{color:var(--ink2);font-weight:600}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.gold{background:linear-gradient(180deg,#D9A42F,#B7791F);border-color:#9A6B12;color:#1D1402}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* course page rows */
.rows{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.rows>*+*{border-top:1px solid var(--line)}
.urow{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;background:none;border:0;text-align:left}
.urow:hover{background:var(--surface2)}.urow .t{flex:1;font-weight:600}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--ink2);text-decoration:none;font-weight:600;padding:6px 0}
/* form */
.field{display:block}.field>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.opt{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.opt[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
/* run */
.runbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px}
.timer{font:700 1rem var(--head);padding:5px 11px;border-radius:999px;background:var(--surface2);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}.prog>i{display:block;height:100%;background:var(--brand);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qtext{font:600 1.12rem/1.45 var(--body);margin:6px 0 16px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin-top:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.choice .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.choice[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}.choice[aria-pressed=true] .k{background:var(--brand);color:var(--brand-ink)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}.choice.right .k{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}.choice.wrong .k{background:var(--bad);color:#fff}
.choice:disabled{opacity:1;cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:.95rem}.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.warnbox{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--gold-soft);color:var(--warn);font-size:.85rem}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:780px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.map button{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.map button.ans{background:var(--brand-soft);border-color:var(--brand)}.map button.flag{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}.map button.cur{outline:3px solid var(--focus)}
/* premium exam */
.exam-head{background:linear-gradient(135deg,#0E1F3D,#14305A);color:#F2F7FF;border-radius:var(--r);padding:12px 14px;border-bottom:4px solid #D9A42F}
.exam-head .muted{color:#B7C8E3}
.slip{border:2px solid var(--gold);border-radius:var(--r);background:var(--surface);padding:16px;position:relative}
.slip dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0}.slip dt{color:var(--ink2)}.slip dd{margin:0;font-weight:700}
.rules{padding-left:18px;margin:8px 0 0}.rules li{margin:4px 0}
/* result */
.score{text-align:center;padding:22px 16px 10px}
.score .big{font:800 3.6rem/1 var(--head);letter-spacing:-.03em}
.ecg{width:100%;height:46px;margin-top:8px}.ecg path{fill:none;stroke:var(--c,var(--brand));stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.6s ease-out forwards}
.verse{border-left:4px solid var(--gold);padding:10px 14px;background:var(--gold-soft);border-radius:0 12px 12px 0}.verse q{display:block;font-style:italic;quotes:none}
.roast{padding:12px 14px;border-radius:12px;background:var(--surface2)}
.rev{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px}
.rev+.rev{margin-top:10px}.rev .a{margin-top:6px;font-size:.92rem}
/* leaderboard */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px}.lrow.me{background:var(--brand-soft)}
.rk{width:34px;text-align:center;font:800 1.05rem var(--head)}
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:end;margin-bottom:14px}
.podium>div{text-align:center;padding:12px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.podium .p1{background:var(--gold-soft);border-color:var(--gold);padding-top:20px}
/* gpa */
.gpa-row{display:grid;grid-template-columns:1fr 70px 80px 44px;gap:8px;align-items:center;padding:10px 12px}
.gpa-row input{min-height:40px;padding:0 8px;text-align:center}
.gpa-sum{display:flex;gap:26px;flex-wrap:wrap}.gpa-sum b{font:800 2rem var(--head);display:block}
/* nav, modal, toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:.74rem;font-weight:700}
.nav a svg{width:22px;height:22px}.nav a[aria-current=page]{color:var(--brand);background:var(--brand-soft)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,14,28,.62);display:grid;place-items:end center;padding:0}
@media(min-width:640px){.overlay{place-items:center;padding:20px}}
.modal{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.modal{border-radius:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;box-shadow:var(--shadow)}
.scroll-x{overflow-x:auto}
@media(prefers-reduced-motion:reduce){.pulse path,.ecg path{animation:none;stroke-dashoffset:0}.prog>i{transition:none}}

</style>

l Structure","s":"mcq","q":"Which structure is found in plant cells but absent in animal cells?","o":["Mitochondria","Golgi bodies","Chloroplasts","Ribosomes"],"a":2,"e":"Chloroplasts, containing chlorophyll for photosynthesis, are found only in plant cells (and some protists)."},{"i":"BIO-14V7lkR6-008","c":"BIO","u":"Cell Structure","s":"mcq","q":"Structures found in animal cells but ABSENT in plant cells include:","o":["Cell wall and chloroplast","Centriole and microvilli","Mitochondria and nucleus","Golgi body and ER"],"a":1,"e":"Centrioles and microvilli are found in animal cells but not typically in plant cells."},{"i":"BIO-14V7lkR6-009","c":"BIO","u":"Cell Structure","s":"mcq","q":"What term describes the study of cell structure and components?","o":["Physiology","Cytology","Ecology","Taxonomy"],"a":1,"e":"Cytology is the study of the structure and components of cells, studied using light and electron microscopes."},{"i":"BIO-14V7lkR6-010","c":"BIO","u":"Cell Structure","s":"mcq","q":"Who first distinguished prokaryotic and eukaryotic cell types (1937)?","o":["Robert Hooke","Edouard Chatton","Rudolf Virchow","Carl Linnaeus"],"a":1,"e":"Edouard Chatton first distinguished the two cell types in 1937, later adopted by Stanier and Van Niel in 1962."},{"i":"BIO-14V7lkR6-011","c":"BIO","u":"Cell Structure","s":"mcq","q":"The large central vacuole in plant cells is surrounded by a membrane called the:","o":["Tonoplast","Sarcolemma","Nuclear envelope","Cell wall"],"a":0,"e":"The tonoplast surrounds the plant cell's large central vacuole, which regulates osmotic pressure."},{"i":"BIO-14V7lkR6-012","c":"BIO","u":"Cell Structure","s":"mcq","q":"Viruses are considered obligate parasites because:","o":["They have a cell wall","They can only reproduce by infecting living cells","They possess ribosomes","They have a nucleus"],"a":1,"e":"Viruses lack cell structure and can only reproduce by infecting and taking over living cells."},{"i":"BIO-14V7lkR6-013","c":"BIO","u":"Cell BOTH animal and plant cells?","o":["Chloroplast","Centriole","Mitochondria","Large permanent vacuole"],"a":2,"e":"Mitochondria are common to both animal and plant cells; chloroplasts and large permanent vacuoles are plant-specific, and centrioles are animal-specific."},{"i":"BIO-14V7lkR6-020","c":"BIO","u":"Cell Structure","s":"mcq","q":"The vacuole in plant cells contains fluid with:","o":["Only water","Pigments, enzymes, sugars, mineral salts, and gases","Only DNA","Only chlorophyll"],"a":1,"e":"The fluid in a plant vacuole contains pigments, enzymes, sugars, organic compounds, mineral salts, oxygen, and carbon dioxide."},{"i":"COS-14XaULs--001","c":"COS","u":"Computer types & classification","s":"mcq","q":"Computers can be divided into three categories according to their electronic nature. These are:","o":["Small, Medium, Large","Analog, Digital, Hybrid","Personal, Mainframe, Super","Input, Output, Processing"],"a":1,"e":"Computers are divided by electronic nature into Analogue, Digital, and Hybrid computers."},{"i":"COS-14XaULs--002","c":"COS","u":"Computer types & classification","s":"mcq","q":"Analogue computers process data that is:","o":["Discrete and countable","Continuous and cannot have discrete values","Only binary","Only text-based"],"a":1,"e":"Analogue data is continuous data that changes continuously and cannot have discrete values."},{"i":"COS-14XaULs--003","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is an example of an analogue computer?","o":["A laptop","A speedometer","A smartphone","A mainframe"],"a":1,"e":"A speedometer and mercury thermometer are classic examples of analogue computers, measuring continuous physical quantities."},{"i":"COS-14XaULs--004","c":"COS","u":"Computer types & classification","s":"mcq","q":"Analogue computers were most popular during which period, when digital computers were still costly?","o":["1920s-1930s","1950s-1960s","1980s-1990s","2000s-2010s"],"a":1,"e":"Analog computers were popular throughout the 1950s and 1960s when the cost of digital computers was still very high."},{"i":"COS-14XaULs--005","c":"COS","u":"Computer types & classification","s":"mcq","q":"Digital computers represent data using discrete states based on which number system?","o":["Decimal","Binary","Hexadecimal","Octal"],"a":1,"e":"Digital computers represent numbers, letters, and symbols using a code based on the binary number system (1s and 0s)."},{"i":"COS-14XaULs--006","c":"COS","u":"Computer types & classification","s":"mcq","q":"Compared to analog devices, results from digital computers are generally:","o":["Less accurate","More accurate","Identical in accuracy","Impossible to measure"],"a":1,"e":"Generally, results from digital computers are more accurate than results from analog devices."},{"i":"COS-14XaULs--007","c":"COS","u":"Computer types & classification","s":"mcq","q":"A hybrid computer combines which two qualities?","o":["The speed of a digital computer and the memory of an analog computer","The speed of an analog computer and the memory/accuracy of a digital computer","Only analog features","Only digital features"],"a":1,"e":"A hybrid computer has the speed of an analog computer and the memory and accuracy of a digital computer."},{"i":"COS-14XaULs--008","c":"COS","u":"Computer types & classification","s":"mcq","q":"The most powerful type of computer currently available, used for tasks like weather forecasting and nuclear research, is the:","o":["Mainframe","Minicomputer","Supercomputer","Microcomputer"],"a":2,"e":"A supercomputer is the most powerful computer available, used for weather forecasting, climate research, scientific simulation, and nuclear research."},{"i":"COS-14XaULs--009","c":"COS","u":"Computer types & classification","s":"mcq","q":"Mainframe computers are designed to process up to how many web transactions daily?","o":["1 million","1 billion","1 trillion","1 thousand"],"a":2,"e":"Mainframes are data servers designed to process up to 1 trillion web transactions daily with high security and reliability."},{"i":"COS-14XaULs--010","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is NOT a major manufacturer of mainframe computers listed?","o":["IBM","Burroughs","Univac","Apple"],"a":3,"e":"Major mainframe manufacturers listed include IBM, Burroughs, BINAC, CDC Cyber series, and Univac — not Apple."},{"i":"COS-14XaULs--011","c":"COS","u":"Computer types & classification","s":"mcq","q":"A minicomputer is also known as a mid-range computer because it lies between:","o":["Supercomputer and mainframe","Mainframe and microcomputer","Laptop and PDA","Analog and digital computers"],"a":1,"e":"A minicomputer lies between the mainframe and the microcomputer, also called a mid-range computer."},{"i":"COS-14XaULs--012","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is an example of a minicomputer listed in the material?","o":["IBM AS/400e","Apple Macintosh","Altair 8800","Cray-1"],"a":0,"e":"Minicomputer examples given include IBM's AS/400e, Honeywell 200, and TI-990."},{"i":"COS-14XaULs--013","c":"COS","u":"Computer types & classification","s":"mcq","q":"A Personal Digital Assistant (PDA) is characterized by:","o":["A large tower unit","A compact handheld design with touch screen operated by stylus","Being accessible only via terminals","Requiring a dedicated computer room"],"a":1,"e":"PDAs are compact handheld computers with touch screens operated with a stylus, using a virtual keyboard for data entry."},{"i":"COS-14XaULs--014","c":"COS","u":"Computer types & classification","s":"mcq","q":"An electronic organizer is primarily used to:","o":["Process massive scientific simulations","Manage schedules and save data like names, addresses, and meeting dates","Perform mainframe transactions","Act as a supercomputer"],"a":1,"e":"An organizer is an electronic gadget used to manage schedules and save data such as names, addresses, telephone numbers, and meeting dates."},{"i":"COS-14XaULs--015","c":"COS","u":"Computer types & classification","s":"mcq","q":"A computer system as a whole comprises which two essential, interdependent parts?","o":["Input and output only","Hardware and software","Monitor and keyboard only","CPU and RAM only"],"a":1,"e":"A computer system comprises hardware and software; they go hand in hand, and one cannot function without the other."},{"i":"COS-14XaULs--016","c":"COS","u":"Computer types & classification","s":"mcq","q":"A computer system is organized to perform which set of basic functions?","o":["Input, output, storage, communication, processing, control","Only input and output","Only processing and storage","Reading and writing only"],"a":0,"e":"A computer is a system of hardware devices organized to perform: input, output, storage, communication, processing, and control."},{"i":"COS-14XaULs--017","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is an example of hardware found INSIDE a computer?","o":["Keyboard","Motherboard","Mouse","Printer"],"a":1,"e":"The motherboard is internal hardware; keyboard, mouse, and printer are external peripherals connected to the computer."},{"i":"COS-14XaULs--018","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is typically found connected to the OUTSIDE of a computer?","o":["Motherboard","Sound Card","Scanner","RAM"],"a":2,"e":"A scanner is external hardware; motherboard, sound card, and RAM are internal components."},{"i":"COS-14XaULs--019","c":"COS","u":"Input Devices","s":"mcq","q":"A computer keyboard creates specialized electronic codes when a key is pressed. These codes are called:","o":["Bitmaps","Scan codes","Pixels","DPI values"],"a":1,"e":"A keyboard creates specialized electronic codes (scan codes) when a key is pressed, transmitted to the system unit."},{"i":"COS-14XaULs--020","c":"COS","u":"Input Devices","s":"mcq","q":"How many distinct groups of keys does a standard keyboard have?","o":["Three","Four","Five","Six"],"a":2,"e":"Keyboards have five distinct groups: standard typewriter keys, function keys, cursor movement keys, numeric keys, and special purpose keys."},{"i":"COS-14XaULs--021","c":"COS","u":"Input Devices","s":"mcq","q":"The PC/XT keyboard has how many keys, with function keys arranged on the left side?","o":["83","84","101","104"],"a":0,"e":"PC/XT (eXtended Technology) keyboards have 83 keys, with F1-F10 arranged on the left-hand side."},{"i":"COS-14XaULs--022","c":"COS","u":"Input Devices","s":"mcq","q":"The PC/AT keyboard introduced which additional key, not present on the PC/XT?","o":["Win key","Menu key","SysRq (System Request) key","Escape key"],"a":2,"e":"PC/AT (Advanced Technology) keyboards contain 84 keys and introduced the SysRq (System Request) key, along with indicator LEDs."},{"i":"COS-14XaULs--023","c":"COS","u":"Input Devices","s":"mcq","q":"Windows keyboards, containing 104 to 109 keys, added which two keys not found on Enhanced keyboards?","o":["Ctrl and Alt","Win key and Menu key","Shift and Delete","Home and End"],"a":1,"e":"Windows Keyboards added the Win key and Menu key as their distinguishing addition."},{"i":"COS-14XaULs--024","c":"COS","u":"Input Devices","s":"mcq","q":"A wireless keyboard connects to a computer using which technologies?","o":["Only USB cables","Bluetooth, IR technology, or Radio Frequency","Only PS/2 ports","Only serial ports"],"a":1,"e":"Wireless keyboards use Bluetooth, IR technology, or Radio Frequency, requiring a transmitter and trans-receiver."},{"i":"COS-14XaULs--025","c":"COS","u":"Input Devices","s":"mcq","q":"A virtual keyboard, as used on smartphones, is notable because it:","o":["Requires a USB connection","Has no physical object to carry and appears/disappears as needed","Uses magnetic ink","Requires special drivers on every boot"],"a":1,"e":"A virtual keyboard appears when needed and disappears after typing, with no physical object to carry."},{"i":"COS-14XaULs--026","c":"COS","u":"Input Devices","s":"mcq","q":"An ergonomic keyboard is specifically designed to reduce:","o":["Cost of manufacturing","Muscle strain and carpal tunnel syndrome","Number of available keys","Typing speed"],"a":1,"e":"Ergonomic keyboards are designed for users who type with both hands, reducing muscle strain and carpal tunnel syndrome."},{"i":"COS-14XaULs--027","c":"COS","u":"Input Devices","s":"mcq","q":"A gaming keyboard typically features which distinguishing set of keys?","o":["Only numeric keys","W, S, D, A and arrow keys with graphics included","Only function keys F1-F12","Only the SysRq key"],"a":1,"e":"Gaming keyboards have very few keys specific for gamers — W, S, D, A and arrow keys — often with graphics included."},{"i":"COS-14XaULs--028","c":"COS","u":"Input Devices","s":"mcq","q":"Which type of mouse uses a ball on its underside, with sensors detecting the ball's movement direction?","o":["Optical mouse","Mechanical mouse","Optomechanical mouse","Cordless mouse"],"a":1,"e":"A mechanical mouse has a ball on its underside, and sensors detect the direction of ball movement to move the cursor."},{"i":"COS-14XaULs--029","c":"COS","u":"Input Devices","s":"mcq","q":"An optical mouse detects movement using:","o":["A rolling ball","A laser","Magnetic ink","Infrared sensors only"],"a":1,"e":"An optical mouse uses a laser to detect mouse movement, rather than a mechanical ball."},{"i":"COS-14XaULs--030","c":"COS","u":"Input Devices","s":"mcq","q":"Which type of mouse connects through the simplest connection, an RS-232C serial port?","o":["USB Mouse","PS/2 Mouse","Serial Mouse","Cordless Mouse"],"a":2,"e":"A Serial Mouse connects through an RS-232C serial port, described as the simplest of connections."},{"i":"COS-14XaULs--031","c":"COS","u":"Input Devices","s":"mcq","q":"A trackball differs from a standard mouse in that:","o":["It requires moving the entire device","You roll a ball on top of a stationary unit to move the cursor","It only works with laptops","It has no buttons"],"a":1,"e":"With a trackball, you roll a movable ball on top of the stationary unit, rather than moving the whole device like a mouse."},{"i":"COS-14XaULs--032","c":"COS","u":"Input Devices","s":"mcq","q":"A pointing stick is described as a practical substitute for a touchpad, particularly useful when:","o":["A laptop lacks the necessary space","A desktop has excess space","A user needs an external mouse","A keyboard has too many keys"],"a":0,"e":"A pointing stick is a practical substitute for a touchpad if a laptop lacks the necessary space."},{"i":"COS-14XaULs--033","c":"COS","u":"Input Devices","s":"mcq","q":"A light pen's tip contains a:","o":["Magnetic sensor","Photocell","Laser diode","Microphone"],"a":1,"e":"The tip of a light pen has a photocell, used to detect light emanating from the screen to select options."},{"i":"COS-14XaULs--034","c":"COS","u":"Input Devices","s":"mcq","q":"Light pens are most commonly used in which field, besides sports commentary?","o":["Computer-Aided Design (CAD) and graphic design","Banking check processing","Barcode scanning","Audio recording"],"a":0,"e":"The light pen is mostly utilised in computer-aided design (CAD) and graphic design work."},{"i":"COS-14XaULs--035","c":"COS","u":"Input Devices","s":"mcq","q":"Which scanning technology is widely used to read responses in objective-type tests, where students darken circles with a pencil?","o":["OCR","OMR","MICR","ICR"],"a":1,"e":"Optical Mark Recognition (OMR) is widely used to read responses in objective-type tests by detecting darkened marks."},{"i":"COS-14XaULs--036","c":"COS","u":"Input Devices","s":"mcq","q":"OCR (Optical Character Recognition) converts scanned documents into:","o":["Magnetic ink patterns","Modifiable ASCII text","Barcode patterns","Sound waves"],"a":1,"e":"OCR is a technique for scanning documents and identifying the image as modifiable ASCII text using OCR software."},{"i":"COS-14XaULs--037","c":"COS","u":"Input Devices","s":"mcq","q":"MICR (Magnetic Ink Character Recognition) technology is primarily used by banks to:","o":["Scan customer photographs","Process checks by reading magnetic ink encoding numbers","Read barcodes on products","Convert handwriting to text"],"a":1,"e":"Banks use MICR to process checks, recognising the magnetic encoding numbers printed at the bottom of a check."},{"i":"COS-14XaULs--038","c":"COS","u":"Input Devices","s":"mcq","q":"ICR (Ink Character Recognition) technology is specifically designed to recognize:","o":["Barcodes only","Manuscript (handwritten) data","Magnetic ink only","Optical marks only"],"a":1,"e":"ICR technology is used to recognize manuscript data, allowing forms to be entered directly into a computer."},{"i":"COS-14XaULs--039","c":"COS","u":"Input Devices","s":"mcq","q":"Compared to MICR, OCR is generally:","o":["Faster at reading documents","Slower at reading documents","Identical in speed","Only usable for barcodes"],"a":1,"e":"Optical Character Recognition (OCR) cannot read documents as quickly as MICR."},{"i":"COS-14XaULs--040","c":"COS","u":"Input Devices","s":"mcq","q":"A barcode scanner reads barcodes by using:","o":["Magnetic fields","Reflected light","Sound waves","Heat sensors"],"a":1,"e":"Barcode scanners make use of reflected light to read barcodes, deciphering the code from the bars' spacing and thickness."},{"i":"COS-14XaULs--041","c":"COS","u":"Input Devices","s":"mcq","q":"A sound card's primary function regarding audio input is to:","o":["Store video files","Transform analog audio signals from a microphone into digital codes","Print documents","Scan barcodes"],"a":1,"e":"The sound card transforms analog audio signals from the microphone into digital codes the computer can store and use."},{"i":"COS-14XaULs--042","c":"COS","u":"Input Devices","s":"mcq","q":"Speech recognition (voice recognition) is the process of:","o":["Converting written text into spoken words","Turning spoken words into written ones","Encrypting audio files","Compressing video files"],"a":1,"e":"Speech recognition is the process of turning spoken words into written ones."},{"i":"COS-14XaULs--043","c":"COS","u":"Input Devices","s":"mcq","q":"A webcam is a typical example of a:","o":["Audio-input device","Video-input device","Scanning device","Pointing device"],"a":1,"e":"A webcam is a typical video-input device, mounted on top of a screen to capture full-motion video images."},{"i":"COS-14XaULs--044","c":"COS","u":"Output Devices","s":"mcq","q":"The smallest unit on a computer screen, whose density determines image clarity, is called a:","o":["Byte","Pixel","Dot pitch","Frame"],"a":1,"e":"A pixel is the smallest unit on the screen; the density of pixels determines resolution/clarity."},{"i":"COS-14XaULs--045","c":"COS","u":"Output Devices","s":"mcq","q":"A CRT (Cathode Ray Tube) monitor produces images when:","o":["An electron beam strikes a phosphorescent surface","Organic materials emit light directly","Liquid crystals rotate polarized light","LEDs illuminate directly"],"a":0,"e":"A CRT is a vacuum tube in which images are produced when an electron beam strikes a phosphorescent surface."},{"i":"COS-14XaULs--046","c":"COS","u":"Output Devices","s":"mcq","q":"Monochrome monitors, common from the 1960s through the 1980s, display how many colors?","o":["One","Two","Four","Sixteen"],"a":1,"e":"Monochrome monitors have only two colors — one for background and one for the foreground (text)."},{"i":"COS-14XaULs--047","c":"COS","u":"Output Devices","s":"mcq","q":"Color monitors implement which color model, using three phosphors?","o":["CMYK","RGB","HSV","Pantone"],"a":1,"e":"Color monitors implement the RGB color model using red, green, and blue phosphors."},{"i":"COS-14XaULs--048","c":"COS","u":"Output Devices","s":"mcq","q":"CGA (Color Graphics Adapter), the first graphics standard for the IBM PC, supports how many colors?","o":["4","16","256","65,536"],"a":0,"e":"CGA supports 4 colors, with fewer pixels than monochrome, making it harder to read."},{"i":"COS-14XaULs--049","c":"COS","u":"Output Devices","s":"mcq","q":"EGA (Enhanced Graphics Adapter) has a resolution of 640 by 350 pixels and supports how many colors?","o":["4","16","256","1024"],"a":1,"e":"EGA is a video display standard with 640x350 resolution, supporting 16 colors."},{"i":"COS-14XaULs--050","c":"COS","u":"Output Devices","s":"mcq","q":"VGA (Video Graphics Array), at its higher resolution of 640x480, supports how many colors?","o":["4","16","256","65,536"],"a":1,"e":"VGA supports 16 colors at 640x480 resolution, or 256 colors at the lower 320x200 resolution."},{"i":"COS-14XaULs--051","c":"COS","u":"Output Devices","s":"mcq","q":"Super VGA, standardized by VESA, can display up to how many colors?","o":["256","4,096","65,536","Unlimited via RGB blending"],"a":2,"e":"Super VGA is a very high resolution standard that displays up to 65,536 colors."},{"i":"COS-14XaULs--052","c":"COS","u":"Output Devices","s":"mcq","q":"Flat panel displays are preferred for laptops over CRTs primarily because they are:","o":["Cheaper to manufacture only","More compact and consume less power","Heavier and more durable","Compatible only with monochrome"],"a":1,"e":"Portable computers use flat panel displays because they are more compact and consume less power than CRTs."},{"i":"COS-14XaULs--053","c":"COS","u":"Output Devices","s":"mcq","q":"LCD (Liquid Crystal Display) monitors are noted for being, compared to CRTs:","o":["Larger and heavier","Thinner, lighter, and using less electricity","More expensive with worse resolution","Requiring more heat generation"],"a":1,"e":"LCD monitors take up less space, use less electricity, generate less heat, and are thinner/lighter than CRT monitors."},{"i":"COS-14XaULs--054","c":"COS","u":"Output Devices","s":"mcq","q":"LED monitors are popular among gamers primarily because they:","o":["Are cheaper than LCD monitors","Consume less power than LCD monitors while supporting up to 4K resolution","Cannot display high-definition content","Require cathode fluorescent lamps"],"a":1,"e":"LED displays consume less power than LCD monitors and boast up to 4K resolutions, popular for HD gaming."},{"i":"COS-14XaULs--055","c":"COS","u":"Output Devices","s":"mcq","q":"OLED monitors use organic materials to transform electric current into light, and are regarded as excellent for picture quality, but have a drawback of:","o":["Poor contrast levels","Shorter lifespans and higher cost than LCDs/LEDs","Inability to display color","Requiring a CRT tube"],"a":1,"e":"OLED monitors have excellent contrast and clarity but shorter lifespans and higher cost than LCDs and LEDs."},{"i":"COS-14XaULs--056","c":"COS","u":"Output Devices","s":"mcq","q":"A printer's output resolution is expressed using which unit?","o":["Pixels per second","DPI (Dots Per Inch)","Hertz","Bits per inch"],"a":1,"e":"The resolution of printer output is expressed as DPI (Dots per inch)."},{"i":"COS-14XaULs--057","c":"COS","u":"Output Devices","s":"mcq","q":"Impact printers create images by:","o":["Using laser beams on a drum","Making direct contact between ink ribbon and paper","Depositing toner electrostatically","Using organic light-emitting diodes"],"a":1,"e":"Impact printers create immediate contact between the ink ribbon and paper, similar to a typewriter."},{"i":"COS-14XaULs--058","c":"COS","u":"Output Devices","s":"mcq","q":"Dot-matrix printers, a type of impact printer, use print heads with how many possible pin configurations?","o":["2, 4, 6, or 8 pins","7, 9, 18, or 24 pins","100, 200, or 300 pins","Only 1 pin"],"a":1,"e":"Dot matrix printers are available with print heads that have 7, 9, 18, or 24 pins."},{"i":"COS-14XaULs--059","c":"COS","u":"Output Devices","s":"mcq","q":"Non-impact printers rely on which technologies rather than direct contact?","o":["Only mechanical pressure","Xerographic, chemical, electrostatic, or laser technology","Only magnetic ink","Only ultrasonic waves"],"a":1,"e":"Non-impact printers depend upon xerographic, chemical, electrostatic, or laser technology, without direct ribbon contact."},{"i":"COS-14XaULs--060","c":"COS","u":"Output Devices","s":"mcq","q":"In a laser printer, the ink powder deposited on the drum is known as:","o":["Ribbon","Toner","Cartridge fluid","Pigment"],"a":1,"e":"The ink powder (toner) is poured onto the drum and deposits itself on characters generated by the laser beam."},{"i":"COS-14XaULs--061","c":"COS","u":"Output Devices","s":"mcq","q":"Laser printers, despite a high initial cost, are noted for having a:","o":["High cost per page","Relatively low cost per page of printing","No ongoing running cost at all","Requirement for ink ribbons"],"a":1,"e":"A laser printer has a high initial cost, but the cost per page of printing is relatively low."},{"i":"COS-14XaULs--062","c":"COS","u":"Output Devices","s":"mcq","q":"A plotter, used for graphs, charts, and technical drawings, requires data in which graphics format?","o":["Raster graphics","Vector graphics format","Bitmap format only","JPEG format only"],"a":1,"e":"Plotters require data in a vector graphics format that can produce images with a series of lines."},{"i":"COS-14XaULs--063","c":"COS","u":"Output Devices","s":"mcq","q":"A drum plotter is typically used to produce:","o":["Larger drawings only","Smaller drawings","Only text documents","Only barcodes"],"a":1,"e":"A drum plotter, where paper wraps a rotating drum, is usually used to produce smaller drawings."},{"i":"COS-14XaULs--064","c":"COS","u":"Output Devices","s":"mcq","q":"A flatbed plotter, also called a table plotter, is usually used for:","o":["Smaller drawings only","Producing large drawings","Printing text documents","Scanning images"],"a":1,"e":"A flatbed (table) plotter draws graphics on paper placed on a bed and is usually used for producing large drawings."},{"i":"COS-14XaULs--065","c":"COS","u":"Output Devices","s":"mcq","q":"Plotters are primarily employed in which specialized fields?","o":["Banking and finance","Enginee M","Control Unit (CU) and Arithmetic Logic Unit (ALU)","Hard disk and optical drive","Primary and secondary memory"],"a":1,"e":"The Control Unit (CU) and Arithmetic Logic Unit (ALU) make up the CPU."},{"i":"COS-17XX6HTN-006","c":"COS","u":"CPU Basics","s":"mcq","q":"Temporary storage spaces within the CPU for data and instructions are called:","o":["Registers","Sectors","Platters","Buffers"],"a":0,"e":"The CPU has a number of registers — temporary storage spaces for data and instructions."},{"i":"COS-17XX6HTN-007","c":"COS","u":"CPU Basics","s":"mcq","q":"Registers are best described as:","o":["Optical storage devices","Groups of flip-flops used to store data within the CPU","External hard drives","Types of ROM chips"],"a":1,"e":"Registers are groups of flip-flops used to store data within the Central Processing Unit."},{"i":"COS-17XX6HTN-008","c":"COS","u":"CPU Basics","s":"mcq","q":"Which of these is NOT listed as an example of a CPU register?","o":["Accumulator (ACC)","Program Counter","Instruction Register","Hard Disk Pointer"],"a":3,"e":"Examples given include Accumulator, Program Counter, Instruction Decoder, Instruction Register, and Stack Pointers — not a 'Hard Disk Pointer'."},{"i":"COS-17XX6HTN-009","c":"COS","u":"CPU Basics","s":"mcq","q":"The Arithmetic and Logic Unit (ALU) is responsible for:","o":["Only storing data permanently","Logical analysis, decision-making, and mathematical calculations","Coordinating input/output devices only","Managing secondary storage"],"a":1,"e":"The ALU performs logical analysis and decision-making in addition to performing mathematical calculations."},{"i":"COS-17XX6HTN-010","c":"COS","u":"CPU Basics","s":"mcq","q":"The Control Unit (CU) functions as the system's:","o":["Permanent storage","Supervisor, coordinating and synchronizing all tasks","Optical reader","External backup device"],"a":1,"e":"The CU serves as the system's supervisor, in charge of coordinating and synchronizing all tasks carried out by the computer system."},{"i":"COS-17XX6HTN-011","c":"COS","u":"Memory","s":"mcq","q":"Computer memory, where data and instructions are stored in digital form, is divided into which two types?","o":["ROM and RAM only","Primary memory and secondary memory","Flash memory and optical memory","Registers and buffers"],"a":1,"e":"A computer system's memory can be divided into Primary memory and Secondary memory."},{"i":"COS-17XX6HTN-012","c":"COS","u":"Memory","s":"mcq","q":"Primary memory is described as:","o":["Permanent and external","Transient, storing data as electronic charges, residing inside the computer","Only usable for backup","A type of optical disk"],"a":1,"e":"Primary memory resides inside the computer system and is transient — data is kept there as electronic charges, erased when the machine turns off."},{"i":"COS-17XX6HTN-013","c":"COS","u":"Memory","s":"mcq","q":"The two categories of primary memory are:","o":["Hard disk and floppy disk","ROM and RAM","CD and DVD","Register and buffer"],"a":1,"e":"The two categories of primary memory are ROM (Read Only Memory) and RAM (Random Access Memory)."},{"i":"COS-17XX6HTN-014","c":"COS","u":"Memory","s":"mcq","q":"Data written into a standard ROM chip:","o":["Can be freely changed at any time","Cannot be changed or removed","Is erased when the power turns off","Requires ultraviolet light to read"],"a":1,"e":"Whatever is written in a ROM chip cannot be changed or removed."},{"i":"COS-17XX6HTN-015","c":"COS","u":"Memory","s":"mcq","q":"PROM (Programmable Read-Only Memory) allows information to be entered:","o":["An unlimited number of times","Only once, and cannot be changed after that","Only with ultraviolet light","Only via a USB connection"],"a":1,"e":"In PROM, information can be entered only once and cannot be changed after that."},{"i":"COS-17XX6HTN-016","c":"COS","u":"Memory","s":"mcq","q":"To write new data into an EPROM chip, it must be:","o":["Connected to a USB port","Withdrawn from the CPU and subjected to ultraviolet rays","Formatted with magnetic tape","Submerged in water"],"a":1,"e":"The EPROM chip must be withdrawn from the CPU and subjected to ultraviolet rays for new data to be written into it."},{"i":"COS-17XX6HTN-017","c":"COS","u":"Memory","s":"mcq","q":"EEPROM differs from EPROM in that it can be updated:","o":["Only by replacing the chip entirely","Repeatedly, without being taken out of the CPU, using electronic pulses","Only using ultraviolet rays","Never, once written"],"a":1,"e":"EEPROM (Electrically Erasable Programmable Read-Only Memory) can be repeatedly updated without removal from the CPU, using specialized electronic pulses."},{"i":"COS-17XX6HTN-018","c":"COS","u":"Memory","s":"mcq","q":"RAM (Random Access Memory) is also referred to as:","o":["Read-only memory","Read/write memory","Non-volatile memory","Optical memory"],"a":1,"e":"RAM is also referred to as read/write memory, since data can be both read from and written onto it."},{"i":"COS-17XX6HTN-019","c":"COS","u":"Memory","s":"mcq","q":"RAM is described as volatile because:","o":["It retains data even after power loss","Any data entered is erased as soon as the computer is turned off","It cannot store any data at all","It only works with optical drives"],"a":1,"e":"RAM is a volatile memory; data entered into it is erased as soon as the computer is turned off."},{"i":"COS-17XX6HTN-020","c":"COS","u":"Memory","s":"mcq","q":"DRAM (Dynamic RAM) needs to be:","o":["Physically removed periodically","Refreshed periodically by the CPU so data isn't lost","Exposed to ultraviolet light regularly","Reformatted daily"],"a":1,"e":"DRAM needs to be refreshed periodically by the CPU so that the data contained in it is not lost."},{"i":"COS-17XX6HTN-021","c":"COS","u":"Memory","s":"mcq","q":"Compared to DRAM, SRAM (Static RAM) is:","o":["Slower and cheaper, requiring no refresh","Faster and costlier, and does not need to be refreshed","Identical in speed and cost","Only usable as secondary storage"],"a":1,"e":"SRAM does not need to be refreshed, has higher speed than DRAM, and is costlier."},{"i":"COS-17XX6HTN-022","c":"COS","u":"Secondary Storage","s":"mcq","q":"Secondary memory is best described as:","o":["Internal, volatile storage","A form of external, permanent storage including hard drives, floppy disks, magnetic tape, and optical disks","Only found inside the CPU","A synonym for RAM"],"a":1,"e":"Secondary memory is a form of external, permanent storage, including hard drives, floppy disks, magnetic tape, and optical disks."},{"i":"COS-17XX6HTN-023","c":"COS","u":"Secondary Storage","s":"mcq","q":"On magnetic tape, the start of the tape is marked with a metal foil known as a:","o":["Marker","Sector label","Platter tag","Track indicator"],"a":0,"e":"The start of the tape is marked with a metal foil known as a marker."},{"i":"COS-17XX6HTN-024","c":"COS","u":"Secondary Storage","s":"mcq","q":"Data on magnetic tape is recorded in parallel across the width of the tape in which format(s)?","o":["Only 4-bit format","7-bit or 9-bit format","Only 16-bit format","32-bit format only"],"a":1,"e":"Data is saved one character at a time, recorded in parallel across the tape's width in either a 7-bit or 9-bit format."},{"i":"COS-17XX6HTN-025","c":"COS","u":"Secondary Storage","s":"mcq","q":"On magnetic tape, records are spaced apart by a gap known as the:","o":["Inter-Record Gap (IRG)","Track Boundary","Sector Divider","Cluster Space"],"a":0,"e":"Records are spaced apart by an inter-record gap (IRG)."},{"i":"COS-17XX6HTN-026","c":"COS","u":"Secondary Storage","s":"mcq","q":"A floppy disk is created using which material?","o":["Aluminum with magnetic coating","Mylar material coated with magnetic oxide","Solid glass","Silicon wafer"],"a":1,"e":"A floppy disk is created using mylar material that has been magnetic oxide-coated."},{"i":"COS-17XX6HTN-027","c":"COS","u":"Secondary Storage","s":"mcq","q":"Floppy disks are round and are typically available in which diameters?","o":["1 or 2 inches","3.5 or 5.25 inches","8 or 12 inches","20 or 25 inches"],"a":1,"e":"The round portions of the flexible floppy disk material are either 3.5 or 5.25 inches in diameter."},{"i":"COS-17XX6HTN-028","c":"COS","u":"Secondary Storage","s":"mcq","q":"Floppy disks get their name from:","o":["Their round shape","The flexible material used in their manufacture","Their storage capacity","Their color"],"a":1,"e":"They are known as floppy disks because of the flexible material used in their manufacture."},{"i":"COS-17XX6HTN-029","c":"COS","u":"Secondary Storage","s":"mcq","q":"The hard disk (or Winchester disk) was first created in which year?","o":["1946","1956","1976","1990"],"a":1,"e":"Magnetic disks, often known as the hard disk or Winchester disk, were first created in 1956."},{"i":"COS-17XX6HTN-030","c":"COS","u":"Secondary Storage","s":"mcq","q":"In a hard disk, information is stored on:","o":["A flexible mylar sheet","A rigid platter or stack of platters with a magnetic surface","Photographic film","A laser-etched glass disc"],"a":1,"e":"In a hard disk, information is stored on a rigid platter or stack of platters with a magnetic surface."},{"i":"COS-17XX6HTN-031","c":"COS","u":"Secondary Storage","s":"mcq","q":"An optical drive reads or writes data on a disc using:","o":["Magnetic fields","A laser or light beam","Electrical pulses only","Mechanical needles"],"a":1,"e":"Optical technology uses a laser or light beam to process information."},{"i":"COS-17XX6HTN-032","c":"COS","u":"Secondary Storage","s":"mcq","q":"Among CD, DVD, and Blu-ray optical discs, which has the LEAST storage capacity?","o":["CD","DVD","Blu-ray","They are all equal"],"a":0,"e":"CDs store the least amount of data; DVDs store more than CDs, and Blu-rays store the most."},{"i":"COS-17XX6HTN-033","c":"COS","u":"Secondary Storage","s":"mcq","q":"A CD-R (CD-Recordable) drive allows data to be written to a disk:","o":["Repeatedly, unlimited times","In just one session, after which the disk is 'closed'","Only via wireless transfer","Only using magnetic tape technology"],"a":1,"e":"A CD-R can put data onto a disk in just one session and then is 'closed' — one 'burn' only, no adding data afterward."},{"i":"COS-17XX6HTN-034","c":"COS","u":"Secondary Storage","s":"mcq","q":"A CD-RW (CD-Rewritable) drive differs from a CD-R in that it:","o":["Can only be written to once","Can be written onto more than once, similar to a floppy or hard disk","Cannot store any data","Uses magnetic rather than optical technology"],"a":1,"e":"A CD-RW drive can be written onto more than once — similar to a floppy or hard disk."},{"i":"COS-17XX6HTN-035","c":"COS","u":"Secondary Storage","s":"mcq","q":"A pen drive is typically connected to a computer via which type of connection?","o":["Serial port","Universal Serial Bus (USB)","PS/2 port","VGA port"],"a":1,"e":"A pen drive is inserted into a Universal Serial Bus (USB) connection to be used."},{"i":"COS-17XX6HTN-036","c":"COS","u":"Secondary Storage","s":"mcq","q":"Flash memory is best described as:","o":["A volatile memory that loses data on power-off","A type of nonvolatile memory with blocks that can be erased and reprogrammed","A form of primary memory only","Only usable for ROM chips"],"a":1,"e":"Flash memory is a type of nonvolatile memory that consists of memory 'blocks' that may be erased and reprogrammed."},{"i":"COS-17XX6HTN-037","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which of these is generally located inside the system unit rather than as portable external media?","o":["Floppy disk","Pen drive","Hard disk drive","CD"],"a":2,"e":"The hard disk drive is normally located inside the system unit, unlike portable floppy disks, pen drives, or CDs."},{"i":"COS-17XX6HTN-038","c":"COS","u":"CPU Basics","s":"mcq","q":"Which statement correctly distinguishes the CPU from the motherboard?","o":["They are the same component with different names","The CPU is a single IC chip located on the motherboard, which connects it to other components","The motherboard is inside the CPU","The CPU stores data permanently while the motherboard processes it"],"a":1,"e":"The CPU is a single IC chip, described as the brain of the PC, located on the motherboard — the rigid card connecting the processor to other components."},{"i":"COS-17XX6HTN-039","c":"COS","u":"CPU Basics","s":"mcq","q":"If a computer needs to perform a mathematical calculation AND make a logical decision, which CPU component handles both?","o":["Control Unit (CU)","Arithmetic and Logic Unit (ALU)","Register bank","Motherboard"],"a":1,"e":"The ALU performs both mathematical calculations and logical analysis/decision-making."},{"i":"COS-17XX6HTN-040","c":"COS","u":"CPU Basics","s":"mcq","q":"Which CPU component would be responsible for coordinating the timing between the ALU and memory during an operation?","o":["Control Unit (CU)","Arithmetic and Logic Unit (ALU)","Pen drive","Optical drive"],"a":0,"e":"The Control Unit acts as the system's supervisor, coordinating and synchronizing all tasks carried out by the computer system."},{"i":"COS-17XX6HTN-041","c":"COS","u":"CPU Basics","s":"mcq","q":"A Program Counter and an Instruction Register are both examples of:","o":["Secondary storage devices","CPU registers","Types of ROM","Optical drives"],"a":1,"e":"Both are examples of registers — groups of flip-flops used to store data within the CPU."},{"i":"COS-17XX6HTN-042","c":"COS","u":"Memory","s":"mcq","q":"Which of these best explains why data is lost from a computer's primary memory when powered off, but not from secondary memory?","o":["Primary memory stores data as electronic charges (transient); secondary memory is external and permanent","Secondary memory is faster","Primary memory is always ROM","There is no actual difference"],"a":0,"e":"Primary memory is transient, storing data as electronic charges that are erased on power-off; secondary memory is external, permanent storage."},{"i":"COS-17XX6HTN-043","c":"COS","u":"Memory","s":"mcq","q":"Ranking ROM variants by how many times their content can be rewritten, from LEAST to MOST rewritable, the correct order is:","o":["EEPROM, EPROM, PROM, ROM","ROM, PROM, EPROM, EEPROM","EPROM, ROM, EEPROM, PROM","PROM, EEPROM, ROM, EPROM"],"a":1,"e":"ROM (never changeable) \u003c PROM (written once) \u003c EPROM (rewritable with UV removal) \u003c EEPROM (rewritable in-place with electronic pulses)."},{"i":"COS-17XX6HTN-044","c":"COS","u":"Memory","s":"mcq","q":"A technician needs to update firmware on a chip WITHOUT removing it from the CPU. Which memory type allows this?","o":["ROM","PROM","EPROM","EEPROM"],"a":3,"e":"EEPROM can be repeatedly updated without being taken out of the CPU, using specialized electronic pulses — unlike EPROM, which requires removal and UV exposure."},{"i":"COS-17XX6HTN-045","c":"COS","u":"Memory","s":"mcq","q":"Which statement correctly compares DRAM and SRAM?","o":["DRAM is faster and costlier; SRAM needs periodic refreshing","SRAM is faster and costlier; DRAM needs periodic refreshing","Both need periodic refreshing equally","Neither requires any refreshing"],"a":1,"e":"SRAM does not need refreshing and is faster/costlier; DRAM needs periodic refreshing by the CPU."},{"i":"COS-17XX6HTN-046","c":"COS","u":"Memory","s":"mcq","q":"Why would a computer's RAM be described as 'volatile' while its ROM is not?","o":["RAM data is erased when power is turned off; ROM data persists","ROM is erased when power is turned off; RAM persists","Both are equally volatile","Volatility only applies to secondary storage"],"a":0,"e":"RAM (volatile) loses data when the computer is turned off, while ROM retains its written data regardless of power state."},{"i":"COS-17XX6HTN-047","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which of these correctly orders optical storage media from LEAST to GREATEST storage capacity?","o":["Blu-ray, DVD, CD","CD, DVD, Blu-ray","DVD, CD, Blu-ray","CD, Blu-ray, DVD"],"a":1,"e":"CDs store the least, DVDs store more than CDs, and Blu-rays store the most."},{"i":"COS-17XX6HTN-048","c":"COS","u":"Secondary Storage","s":"mcq","q":"If you need to record data onto an optical disc multiple times over weeks, adding new files each time, which format should you use?","o":["CD-R","CD-RW","DVD-ROM (factory pressed)","None of these support multiple sessions"],"a":1,"e":"CD-RW can be written onto more than once, similar to a floppy or hard disk, unlike CD-R which allows only one 'burn' session."},{"i":"COS-17XX6HTN-049","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which secondary storage medium uses an Inter-Record Gap (IRG) to space out stored data?","o":["Hard disk","Magnetic tape","Optical disk","Flash memory"],"a":1,"e":"On magnetic tape, records are stored as data and spaced apart by an inter-record gap (IRG)."},{"i":"COS-17XX6HTN-050","c":"COS","u":"Secondary Storage","s":"mcq","q":"Both floppy disks and hard disks store data using which underlying principle?","o":["Optical laser reading","Magnetic surfaces/coating","Electronic charge only","Flash memory blocks"],"a":1,"e":"Floppy disks use magnetic oxide-coated mylar, and hard disks use platters with a magnetic surface — both rely on magnetism."},{"i":"COS-17XX6HTN-051","c":"COS","u":"Secondary Storage","s":"mcq","q":"Why do hard disks typically serve as a computer's primary means of storage rather than floppy disks?","o":["Hard disks are more portable","Hard disks can hold massive amounts of data, holding almost all programs and files","Floppy disks are faster","Hard disks use optical technology"],"a":1,"e":"Because hard disks can hold massive amounts of information, they usually serve as the computer's primary storage, holding almost all programs and files."},{"i":"COS-17XX6HTN-052","c":"COS","u":"Secondary Storage","s":"mcq","q":"A pen drive and a hard disk are both examples of:","o":["Primary memory","Secondary (external/permanent) storage","Types of ROM","CPU registers"],"a":1,"e":"Both are forms of secondary memory — external, permanent storage for computers."},{"i":"COS-17XX6HTN-053","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which is the most accurate way to distinguish CD, DVD, and Blu-ray discs when they all look physically similar?","o":["By their color","By reading the label to determine media type","By their weight","They cannot be distinguished"],"a":1,"e":"All three optical disc types look the same; one must read the label to determine the media type."},{"i":"COS-17XX6HTN-054","c":"COS","u":"CPU Basics","s":"mcq","q":"A Stack Pointer, mentioned as an example of a CPU register, is used to:","o":["Store data temporarily within the CPU as part of its register set","Permanently store the operating system","Read optical discs","Connect external USB devices"],"a":0,"e":"Stack Pointers are listed among CPU registers — temporary storage spaces for data and instructions within the CPU."},{"i":"COS-17XX6HTN-055","c":"COS","u":"Memory","s":"mcq","q":"PROM can be purchased in what state, to later be loaded by the user?","o":["Pre-loaded with a fixed program that cannot be changed","Empty, and subsequently loaded by the user with a program","Already erased using ultraviolet light","Only as read/write memory"],"a":1,"e":"PROM can be purchased empty and subsequently loaded by the user with a program; its contents cannot be changed once loaded."},{"i":"COS-17XX6HTN-056","c":"COS","u":"Secondary Storage","s":"mcq","q":"The pen drive, often abbreviated 'PD' by users, is best described as:","o":["A form of primary memory","A portable storage device that can be quickly transported from one location to another","A type of optical disc","A CPU register"],"a":1,"e":"The term 'pen drive' refers to a portable storage device that may be quickly transported from one location to another."},{"i":"COS-17XX6HTN-057","c":"COS","u":"Secondary Storage","s":"mcq","q":"What is required to get a pen drive working with a computer?","o":["Formatting it with magnetic tape first","Simply inserting it into a USB connection","Exposing it to ultraviolet light","Installing it inside the system unit permanently"],"a":1,"e":"A pen drive is relatively simple to use; all a user needs to do is insert it into a Universal Serial Bus (USB) connection."},{"i":"COS-17XX6HTN-058","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which storage medium described is most associated with being used from 1956 onward for holding large volumes of a computer's programs and files?","o":["Floppy disk","Hard (Winchester) disk","CD-R","Pen drive"],"a":1,"e":"Magnetic disks (hard/Winchester disks) were first created in 1956 and became the primary storage medium for large volumes of data."},{"i":"COS-17XX6HTN-059","c":"COS","u":"Memory","s":"mcq","q":"Which type of memory would be most appropriate for a manufacturer to permanently embed a device's unchanging startup instructions into, at the point of manufacture?","o":["RAM","ROM","DRAM","SRAM"],"a":1,"e":"ROM content cannot be changed or removed once written — appropriate for permanent, unchanging instructions like factory-set startup code."},{"i":"COS-17XX6HTN-060","c":"COS","u":"CPU Basics","s":"mcq","q":"Why are some computer components housed on their own small circuit boards rather than built directly into the motherboard?","o":["So they can plug into expansion slots built into the motherboard, allowing modularity","Because the motherboard cannot hold any circuitry","Because they must be kept away from the CPU entirely","Because expansion slots replace the need for a motherboard"],"a":0,"e":"Some components are housed on their own small circuit boards that plug into expansion slots built into the motherboard, allowing modular upgrades."},{"i":"BIO-1Dec1Q5P-001","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Which interaction is directly associated with fighting for scarce resources?","o":["Interference competition","Exploitative competition","Apparent competition","Saprophytism"],"a":0},{"i":"BIO-1Dec1Q5P-002","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Two different species are interacting. This is:","o":["Intraspecific","Interspecific","Intracellular","Extracellular"],"a":1},{"i":"BIO-1Dec1Q5P-003","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"A bear catches fish, reducing fish available to another bear downstream. This illustrates:","o":["Interference","Exploitative competition","Predation","Mutualism"],"a":1},{"i":"BIO-1Dec1Q5P-004","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Two prey species are indirectly affected because they share a hawk predator. This is:","o":["Interference","Exploitative","Apparent competition","Saprophytism"],"a":2},{"i":"BIO-1Dec1Q5P-005","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"The organism being hunted is the:","o":["Predator","Prey","Competitor","Saprophyte"],"a":1},{"i":"BIO-1Dec1Q5P-006","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Which is a prey defence described in the lecture?","o":["Camouflage","Hooked beak","Talons","Sharp claws"],"a":0},{"i":"BIO-1Dec1Q5P-007","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Saprophytes obtain nutrients primarily after:","o":["Photosynthesis","External breakdown of organic matter","Hunting prey","Direct fighting"],"a":1},{"i":"BIO-1Dec1Q5P-008","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Which is listed as a saprophyte example?","o":["Mucor","Tiger","Hawk","Deer"],"a":0},{"i":"BIO-1Dec1Q5P-009","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Which competition is NOT considered real competition in the lecture?","o":["Interference","Exploitative","Apparent","Intraspecific"],"a":2},{"i":"BIO-1Dec1Q5P-010","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Which is an example of interspecific competition?","o":["Male deer locking horns","Large aphids pushing smaller aphids","Lion and tiger competing for prey","One bear catching fish"],"a":2},{"i":"BIO-1Dec1Q5P-011","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"A group of male deer physically lock horns over access to a resource. What interaction is this?","o":["Interference competition","Exploitative competition","Apparent competition","Saprophytism"],"a":0},{"i":"BIO-1Dec1Q5P-012","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Tall trees reduce light reaching smaller plants. No direct fighting occurs. Identify the interaction.","o":["Interference","Exploitative competition","Predation","Apparent competition"],"a":1},{"i":"BIO-1Dec1Q5P-013","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"A hawk feeds on both mice and squirrels. Changes in one prey population alter predation pressure on the other. Identify the relationship.","o":["Mutualism","Apparent competition","Interference competition","Saprophytism"],"a":1},{"i":"BIO-1Dec1Q5P-014","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"A fungus grows through dead material and releases enzymes into it before absorbing nutrients. What process is being described?","o":["Predation","Photosynthesis","Extracellular digestion in saprophytism","Interference"],"a":2},{"i":"BIO-1Dec1Q5P-015","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"A turtle avoids being eaten partly because its shell discourages physical contact. The shell is a:","o":["Mechanical prey defence","Predator adaptation","Resource","Competition type"],"a":0},{"i":"BIO-1Dec1Q5P-016","c":"BIO","u":"Interrelationships of Organisms","s":"tf","q":"Intraspecific interactions occur between different species.","o":["True","False"],"a":1},{"i":"BIO-1Dec1Q5P-017","c":"BIO","u":"Interrelationships of Organisms","s":"tf","q":"Exploitative competition involves indirect interaction.","o":["True","False"],"a":0},{"i":"BIO-1Dec1Q5P-018","c":"BIO","u":"Interrelationships of Organisms","s":"tf","q":"Apparent competition is caused by species sharing a predator.","o":["True","False"],"a":0},{"i":"BIO-1Dec1Q5P-019","c":"BIO","u":"Interrelationships of Organisms","s":"tf","q":"A predator is the organism being hunted.","o":["True","False"],"a":1},{"i":"BIO-1Dec1Q5P-020","c":"BIO","u":"Interrelationships of Organisms","s":"tf","q":"Camouflage is a type of prey defence described in the lecture.","o":["True","False"],"a":0},{"i":"BIO-1Dec1Q5P-021","c":"BIO","u":"Interrelationships of Organisms","s":"tf","q":"Saprophytes are able to perform photosynthesis according to the lecture.","o":["True","False"],"a":1},{"i":"BIO-1Dec1Q5P-022","c":"BIO","u":"Interrelationships of Organisms","s":"tf","q":"Saprophytes can produce spores.","o":["True","False"],"a":0},{"i":"BIO-1Dec1Q5P-023","c":"BIO","u":"Interrelationships of Organisms","s":"tf","q":"Mucor is identified as a saprophytic fungus.","o":["True","False"],"a":0},{"i":"COS-1MwlCEc9-001","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which statement best defines a computer according to the lecture?","o":["A programmable electronic device that accepts data, processes it according to instructions, produces information, and can store it","A device used only for calculations","A machine that only stores information","A device that only connects to the Internet"],"a":0,"e":"The lecture defines a computer as a programmable electronic device that accepts data, processes it according to instructions, produces information, and can store it for future use."},{"i":"COS-1MwlCEc9-002","c":"COS","u":"Introduction to Computing","s":"mcq","q":"According to the lecture, computers vary mainly in their ____.","o":["size and function","colour and price","brand and shape","keyboard and monitor"],"a":0,"e":"The lecture explicitly states that computers vary in size and function."},{"i":"COS-1MwlCEc9-003","c":"COS","u":"Introduction to Computing","s":"mcq","q":"Which of the following is listed as an objective of the lecture?","o":["Explain information processing and its roles in society","Design a new programming language","Build a computer processor","Repair every type of
