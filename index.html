"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Mendel's Law of Dominance states that:","o":["Both alleles are always expressed equally","In a heterozygous pair, one allele masks the expression of the other","Alleles never separate during gamete formation","Traits from both parents always blend completely"],"a":1,"e":"The dominant allele's characters are expressed over the recessive allele's in a heterozygous condition."},{"i":"BIO-1fcsQH1g-060","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Mendel's Law of Segregation states that:","o":["Alleles of different genes assort independently","The paired alleles for a trait separate so each gamete receives only one allele","All traits are always dominant","Genes never separate during meiosis"],"a":1,"e":"During gamete formation, the allelic pair of a gene separates so each gamete carries a single allele."},{"i":"BIO-1fcsQH1g-061","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"Mendel's Law of Independent Assortment states that:","o":["Alleles of different genes assort into gametes independently of one another","All genes are always inherited together","Only dominant alleles pass to offspring","Segregation only applies to sex chromosomes"],"a":0,"e":"This law explains that inheritance of one trait pair is independent of another, arising from Mendel's dihybrid crosses."},{"i":"BIO-1fcsQH1g-062","c":"BIO","u":"Chromosomes, Genes, DNA & Evolution","s":"mcq","q":"A trait that appears in the F1 generation of a Mendelian cross is called the:","o":["Recessive character","Dominant character","Mutant character","Hybrid character"],"a":1,"e":"Characters that appear in the F1 generation are the dominant characters; recessive characters reappear in F2."},{"i":"BIO-1oKkPsqH-001","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"A close, long-term biological interaction between two different species is called:","o":["Competition","Symbiosis","Predation","Succession"],"a":1,"e":"Symbiosis is a close, long-term interaction between two different species (symbionts)."},{"i":"BIO-1oKkPsqH-002","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"In an obligate symbiotic relationship:","o":["Partners can live independently","One or more symbionts depend on each other for survival","There is no interaction","Only one species benefits and the other is unaffected"],"a":1,"e":"Obligate symbiosis means the symbionts depend on each other for survival, unlike facultative (optional) symbiosis."},{"i":"BIO-1oKkPsqH-003","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Which type of mutualism involves the yucca plant and the moth?","o":["Facultative mutualism","Obligate mutualism","Trophic mutualism","Defensive mutualism"],"a":1,"e":"The yucca-moth relationship is obligate mutualism — both species are completely dependent on each other."},{"i":"BIO-1oKkPsqH-004","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Honeybees visiting various plants for nectar, benefiting both, is an example of:","o":["Obligate mutualism","Facultative mutualism","Parasitism","Competition"],"a":1,"e":"Honeybees and plants can coexist without depending entirely on each other — facultative mutualism."},{"i":"BIO-1oKkPsqH-005","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"The relationship between cows and the bacteria in their rumen digesting cellulose is an example of:","o":["Defensive mutualism","Trophic mutualism","Dispersive mutualism","Facultative mutualism"],"a":1,"e":"In trophic mutualism, partners are specialized in complementary ways to obtain energy/nutrients, as with cows and rumen bacteria."},{"i":"BIO-1oKkPsqH-006","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Aphids providing honeydew to ants in exchange for protection illustrates:","o":["Trophic mutualism","Dispersive mutualism","Defensive mutualism","Obligate mutualism"],"a":2,"e":"In defensive mutualism, one partner receives food/shelter in exchange for protection from predators, as with aphids and ants."},{"i":"BIO-1oKkPsqH-007","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Competition that occurs directly between individuals through fighting for resources is called:","o":["Exploitative competition","Apparent competition","Interference competition","Facultative competition"],"a":2,"e":"Interference competition involves direct interaction, such as fighting for scarce resources."},{"i":"BIO-1oKkPsqH-008","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Competition between individuals of the same species is termed:","o":["Interspecific competition","Intraspecific competition","Apparent competition","Mutualism"],"a":1,"e":"Intraspecific competition occurs between individuals of the same species; interspecific occurs between different species."},{"i":"BIO-1oKkPsqH-009","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Apparent competition occurs when:","o":["Species directly fight over resources","Two species indirectly affect each other by sharing a common predator","Two species cooperate for mutual benefit","One species depends entirely on another for survival"],"a":1,"e":"Apparent competition is an indirect interaction where two prey species affect each other via a shared predator."},{"i":"BIO-1oKkPsqH-010","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Lichen represents a symbiotic relationship between:","o":["A fungus and algae","Ants and acacia trees","Termites and protozoa","Bees and flowers"],"a":0,"e":"Lichen is a symbiosis between a fungus and algae (or photosynthetic bacteria), where the fungus protects the algae and the algae provides sugars."},{"i":"PHY-1skaQbmb-001","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Which of the following is a scalar quantity?","o":["Displacement","Velocity","Distance","Acceleration"],"a":2,"e":"Distance only has magnitude (how much ground was covered), with no direction attached, so it is a scalar."},{"i":"PHY-1skaQbmb-002","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Which of the following is a vector quantity?","o":["Distance","Speed","Displacement","Mass"],"a":2,"e":"Displacement has both magnitude and direction (how far from the start, and which way), making it a vector."},{"i":"PHY-1skaQbmb-003","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Kinematics is the branch of mechanics concerned with:","o":["The forces that cause motion","The motion of bodies without reference to the forces causing it","Objects in equilibrium only","Energy transfer between bodies"],"a":1,"e":"Kinematics describes motion itself (distance, displacement, speed, velocity, acceleration) without considering the forces responsible for it — that's kinetics/dynamics."},{"i":"PHY-1skaQbmb-004","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Speed is best defined as:","o":["The rate of change of displacement","How fast a body is travelling, without regard to direction","The rate of change of velocity","A vector describing motion"],"a":1,"e":"Speed is a scalar — it tells you how fast a body moves but carries no directional information."},{"i":"PHY-1skaQbmb-005","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Velocity differs from speed because velocity:","o":["Is always larger in value","Includes direction as well as magnitude","Cannot be negative","Is measured in different units"],"a":1,"e":"Velocity is the vector counterpart of speed — same units, but it specifies direction too."},{"i":"PHY-1skaQbmb-006","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Acceleration is defined as:","o":["The rate of change of displacement","The rate of change of speed or velocity","The total distance covered per unit time","A quantity that is always positive"],"a":1,"e":"Acceleration measures how quickly velocity (or speed) is changing with time."},{"i":"PHY-1skaQbmb-007","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Which statement about acceleration is TRUE?","o":["Acceleration can only be a vector quantity","Acceleration can be scalar or vector depending on context","Acceleration is always constant","Acceleration has no SI unit"],"a":1,"e":"The notes state acceleration can be treated as scalar or vector depending on how it's being described."},{"i":"PHY-1skaQbmb-008","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Negative acceleration is also known as:","o":["Displacement","Retardation (deceleration)","Uniform motion","Instantaneous velocity"],"a":1,"e":"A negative value of acceleration is commonly called deceleration or retardation — the body is slowing down."},{"i":"PHY-1skaQbmb-009","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Distance and displacement are both measured in:","o":["Metres per second (m/s)","Metres (m)","Metres per second squared (m/s²)","Newtons (N)"],"a":1,"e":"Both are length quantities, so their SI unit is the metre, m."},{"i":"PHY-1skaQbmb-010","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Speed and velocity are both measured in:","o":["Metres (m)","Seconds (s)","Metres per second (ms⁻¹)","Metres per second squared (ms⁻²)"],"a":2,"e":"Speed and velocity describe how fast position changes with time, so their unit is ms⁻¹."},{"i":"PHY-1skaQbmb-011","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Acceleration is measured in:","o":["ms⁻¹","ms⁻²","m","Dimensionless"],"a":1,"e":"Acceleration is the rate of change of velocity with time, giving units of ms⁻²."},{"i":"PHY-1skaQbmb-012","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"A particle in mechanics is best described as:","o":["A body with significant size and shape","An idealisation with mass concentrated at a point, negligible size, and no rotation","A body that only moves in circles","Any object heavier than 1 kg"],"a":1,"e":"A particle is an idealised point mass — it has location but not rotation, and negligible size/shape."},{"i":"PHY-1skaQbmb-013","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"In rectilinear kinematics, displacement Δs is defined as:","o":["s + s′","s′ − s","s′ × s","s / s′"],"a":1,"e":"Displacement is the change in position: Δs = s′ − s, where s′ is the new position and s the original one."},{"i":"PHY-1skaQbmb-014","c":"PHY","u":"Kinematics: Definitions","s":"mcq","q":"Mechanics is divided into statics and dynamics. Dynamics itself splits into:","o":["Kinematics and kinetics","Distance and displacement","Speed and velocity","Vectors and scalars"],"a":0,"e":"Dynamics (objects in motion) is divided into kinematics (geometric aspects of motion) and kinetics (analysis of the forces causing motion)."},{"i":"PHY-1skaQbmb-015","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Which equation correctly relates v, u, a and t?","o":["v = u + at","v = u − at²","v² = u + 2as","s = vt + ½at"],"a":0,"e":"v = u + at is the first of the standard suvat equations for constant acceleration."},{"i":"PHY-1skaQbmb-016","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Which equation is used to find displacement when acceleration is NOT known?","o":["v = u + at","s = ½(u + v)t","v² = u² + 2as","s = ut + ½at²"],"a":1,"e":"s = ½(u + v)t only needs initial velocity, final velocity and time — no acceleration required."},{"i":"PHY-1skaQbmb-017","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Which suvat equation does NOT contain time, t?","o":["v = u + at","s = ut + ½at²","v² = u² + 2as","s = ½(u + v)t"],"a":2,"e":"v² = u² + 2as is the only one of the five suvat equations that has no t term — useful when time isn't given."},{"i":"PHY-1skaQbmb-018","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"The suvat equation s = vt − ½at² is most useful when:","o":["u is unknown but v, a and t are known","a is unknown","t is unknown","v is unknown"],"a":0,"e":"This form of the displacement equation lets you find s without ever needing the initial velocity u."},{"i":"PHY-1skaQbmb-019","c":"PHY","u":"Kinematics: suvat equations","s":"fill","q":"In the suvat equations, the letter 'a' conventionally stands for ______.","acc":["acceleration"],"e":"'a' represents acceleration, measured in ms⁻²."},{"i":"PHY-1skaQbmb-020","c":"PHY","u":"Kinematics: suvat equations","s":"fill","q":"In the suvat equations, the letter 'u' conventionally stands for the ______ velocity.","acc":["initial"],"e":"'u' is the initial (starting) velocity, while 'v' is the final velocity."},{"i":"PHY-1skaQbmb-021","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"For vertical motion under gravity near Earth's surface, the value of g used in the notes is approximately:","o":["6.4 ms⁻²","9.8 ms⁻²","10.8 ms⁻²","12.0 ms⁻²"],"a":1,"e":"The acceleration due to gravity used throughout the notes is g ≈ 9.8 ms⁻² (sometimes approximated to 10 ms⁻² in quick calculations)."},{"i":"PHY-1skaQbmb-022","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Deriving v² = u² + 2as starts by eliminating which variable between v = u + at and s = ½(u+v)t?","o":["s","u","t","a"],"a":2,"e":"You make t the subject of v = u + at, then substitute it into s = ½(u+v)t to eliminate t and arrive at v² = u² + 2as."},{"i":"PHY-1skaQbmb-023","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"The suvat equations apply strictly to motion with:","o":["Constant acceleration in a straight line","Any acceleration in any path","Zero acceleration only","Circular motion only"],"a":0,"e":"All five suvat equations assume a particle moving in a straight line with constant (uniform) acceleration."},{"i":"PHY-1skaQbmb-024","c":"PHY","u":"Kinematics: suvat equations","s":"mcq","q":"Which pair of suvat equations both allow you to solve for displacement s?","o":["v=u+at and v²=u²+2as","s=ut+½at² and s=½(u+v)t","v=u+at only","None of the equations solve for s"],"a":1,"e":"s = ut + ½at² and s = ½(u+v)t are both explicit expressions for displacement."},{"i":"PHY-1skaQbmb-025","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A ball is dropped from rest and falls 80 m before hitting the ground (take g = 10 ms⁻²). How long does it take to land?","o":["2 s","4 s","6 s","8 s"],"a":1,"e":"Using s = ut + ½at² with u=0: 80 = 0 + ½(10)t² → t² = 16 → t = 4 s."},{"i":"PHY-1skaQbmb-026","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"Using the previous scenario (dropped from rest, falls 80 m, g = 10 ms⁻²), what speed does it hit the ground with?","o":["20 ms⁻¹","40 ms⁻¹","400 ms⁻¹","4 ms⁻¹"],"a":1,"e":"v = u + at = 0 + 10(4) = 40 ms⁻¹."},{"i":"PHY-1skaQbmb-027","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A stone is thrown vertically upward with a speed of 30 ms⁻¹ (g = 10 ms⁻²). How long does it take to reach maximum height?","o":["1 s","2 s","3 s","4 s"],"a":2,"e":"At maximum height v = 0: t = (v−u)/a = (0−30)/(−10) = 3 s."},{"i":"PHY-1skaQbmb-028","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"For the same stone (u = 30 ms⁻¹ upward, g = 10 ms⁻²), what maximum height does it reach?","o":["30 m","45 m","60 m","90 m"],"a":1,"e":"v²=u²+2as with v=0: 0 = 900 − 20s → s = 45 m."},{"i":"PHY-1skaQbmb-029","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A stone is thrown vertically upward with a speed of 10 ms⁻¹ from a point 15 m above the ground (g = 9.8 ms⁻²). What is the maximum height above the ground it reaches (to 3 s.f.)?","o":["5.10 m","15.0 m","20.1 m","25.1 m"],"a":2,"e":"Using v²=u²+2as with v=0: 0=100−19.6s → s≈5.10 m above the throw point, and 5.10+15=20.1 m above the ground (as worked in the class example)."},{"i":"PHY-1skaQbmb-030","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A body dropped from rest falls freely for 3 seconds (g = 10 ms⁻²). How far has it fallen?","o":["15 m","30 m","45 m","90 m"],"a":2,"e":"s = ut + ½at² = 0 + ½(10)(9) = 45 m."},{"i":"PHY-1skaQbmb-031","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A stone is dropped from a cliff and lands on the beach 3.2 s later (g = 10 ms⁻²). How high is the cliff (to 1 d.p.)?","o":["25.6 m","32.0 m","51.2 m","64.0 m"],"a":2,"e":"s = ½ g t² = ½(10)(3.2)² = ½(10)(10.24) = 51.2 m."},{"i":"PHY-1skaQbmb-032","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A stone is dropped from 45 m (g = 10 ms⁻²). What is its velocity just before impact?","o":["10 ms⁻¹","20 ms⁻¹","30 ms⁻¹","45 ms⁻¹"],"a":2,"e":"v² = u² + 2as = 0 + 2(10)(45) = 900 → v = 30 ms⁻¹."},{"i":"PHY-1skaQbmb-033","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A ball is thrown vertically downward with an initial speed of 5 ms⁻¹ from a height of 60 m (g = 10 ms⁻²). With what speed does it strike the ground?","o":["25 ms⁻¹","30 ms⁻¹","35 ms⁻¹","40 ms⁻¹"],"a":2,"e":"v² = u² + 2as = 25 + 2(10)(60) = 1225 → v = 35 ms⁻¹."},{"i":"PHY-1skaQbmb-034","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"For the ball thrown downward in the previous question (u = 5 ms⁻¹, v = 35 ms⁻¹, g = 10 ms⁻²), how long does it take to strike the ground?","o":["2 s","3 s","4 s","5 s"],"a":1,"e":"t = (v−u)/a = (35−5)/10 = 3 s."},{"i":"PHY-1skaQbmb-035","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A ball is thrown upward with initial velocity u from a point 1.2 m above the ground and reaches a maximum height of 23 m above the ground (g = 9.8 ms⁻²). What is the initial velocity u (to 3 s.f.)?","o":["14.8 ms⁻¹","19.0 ms⁻¹","20.7 ms⁻¹","23.0 ms⁻¹"],"a":1,"e":"Rise above the throw point is 23−1.2=21.8 m. v²=u²−2gs with v=0: u²=2(9.8)(21.8)≈427.3 → u≈ 20.7 ms⁻¹... using the exact suvat value the notes accept ≈20.7 ms⁻¹ (closest option).","f":"source answer key (index 1 = 19.0) conflicts with its own explanation, which computes 20.7 ms-1 (index 2). Needs lecturer/owner confirmation; key left unchanged."},{"i":"PHY-1skaQbmb-036","c":"PHY","u":"Kinematics: Vertical motion","s":"mcq","q":"A particle moves from rest along a circle of radius 4 m with a constant tangential acceleration of 3 m/s². What is the tangential velocity at t = 2 s?","o":["3 m/s","6 m/s","9 m/s","12 m/s"],"a":1,"e":"v = u + at = 0 + 3(2) = 6 m/s (tangential component)."},{"i":"PHY-1skaQbmb-037","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A car starts from rest and accelerates uniformly at 2 ms⁻² for 5 s. What is its final velocity?","o":["5 ms⁻¹","7 ms⁻¹","10 ms⁻¹","20 ms⁻¹"],"a":2,"e":"v = u + at = 0 + 2(5) = 10 ms⁻¹."},{"i":"PHY-1skaQbmb-038","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"Using the same car (u=0, a=2 ms⁻², t=5 s), what distance does it cover?","o":["10 m","15 m","20 m","25 m"],"a":3,"e":"s = ut + ½at² = 0 + ½(2)(25) = 25 m."},{"i":"PHY-1skaQbmb-039","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A cyclist travelling at 20 ms⁻¹ decelerates uniformly at 2 ms⁻². How long until the cyclist stops?","o":["5 s","8 s","10 s","12 s"],"a":2,"e":"t = (v−u)/a = (0−20)/(−2) = 10 s."},{"i":"PHY-1skaQbmb-040","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"For the cyclist above (u = 20 ms⁻¹, decelerating at 2 ms⁻²), what distance is covered before stopping?","o":["50 m","100 m","150 m","200 m"],"a":1,"e":"s = (u+v)/2 × t = (20+0)/2 × 10 = 100 m (or use v²=u²+2as)."},{"i":"PHY-1skaQbmb-041","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A particle moves with a constant acceleration of 3 ms⁻², starting with velocity 15 ms⁻¹. What is its velocity after 4 seconds?","o":["18 ms⁻¹","21 ms⁻¹","27 ms⁻¹","30 ms⁻¹"],"a":2,"e":"v = u + at = 15 + 3(4) = 27 ms⁻¹."},{"i":"PHY-1skaQbmb-042","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"For the same particle (u=15 ms⁻¹, a=3 ms⁻², t=4 s), what distance does it cover?","o":["60 m","72 m","84 m","96 m"],"a":2,"e":"s = ut + ½at² = 15(4) + ½(3)(16) = 60 + 24 = 84 m."},{"i":"PHY-1skaQbmb-043","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A body's velocity increases from 5 ms⁻¹ to 25 ms⁻¹ in 4 seconds under constant acceleration. What is the acceleration?","o":["2 ms⁻²","4 ms⁻²","5 ms⁻²","10 ms⁻²"],"a":2,"e":"a = (v−u)/t = (25−5)/4 = 5 ms⁻²."},{"i":"PHY-1skaQbmb-044","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"For the body above (u=5, v=25 ms⁻¹, t=4 s), what distance is covered?","o":["30 m","45 m","60 m","75 m"],"a":2,"e":"s = ½(u+v)t = ½(5+25)(4) = 60 m."},{"i":"PHY-1skaQbmb-045","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A train decelerates from 12 ms⁻¹ to rest at 3 ms⁻². What distance does it cover while stopping?","o":["12 m","18 m","24 m","36 m"],"a":2,"e":"v²=u²+2as → 0=144−6s → s=24 m."},{"i":"PHY-1skaQbmb-046","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A car moving at 20 ms⁻¹ brakes to a stop over a distance of 40 m. What is its (constant) deceleration?","o":["2 ms⁻²","4 ms⁻²","5 ms⁻²","10 ms⁻²"],"a":2,"e":"v²=u²+2as → 0=400+2a(40) → a=−5 ms⁻², i.e. deceleration of 5 ms⁻²."},{"i":"PHY-1skaQbmb-047","c":"PHY","u":"Kinematics: suvat problems","s":"fill","q":"A particle starting from rest accelerates uniformly at 1.5 ms⁻² for 8 seconds. Its final velocity, in ms⁻¹, is ______.","acc":["12"],"e":"v = u + at = 0 + 1.5(8) = 12 ms⁻¹."},{"i":"PHY-1skaQbmb-048","c":"PHY","u":"Kinematics: suvat problems","s":"mcq","q":"A particle moves from A to C via B with constant acceleration 1 ms⁻², passing B after 6 s and C after a further 4 s (total 10 s from A), with velocity 50 ms⁻¹ at C. What is its velocity at A?","o":["30 ms⁻¹","35 ms⁻¹","40 ms⁻¹","45 ms⁻¹"],"a":2,"e":"v = u + at → 50 = u + 1(10) → u = 40 ms⁻¹."},{"i":"PHY-1skaQbmb-049","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"In rectilinear kinematics, velocity is related to position by which expression?","o":["v = ds/dt","v = dt/ds","v = d²s/dt²","v = s/t²"],"a":0,"e":"Velocity is the instantaneous rate of change of position with respect to time: v = ds/dt."},{"i":"PHY-1skaQbmb-050","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"Acceleration in terms of velocity is given by:","o":["a = ds/dt","a = dv/dt","a = s/t","a = v/t²"],"a":1,"e":"Acceleration is the rate of change of velocity with time: a = dv/dt."},{"i":"PHY-1skaQbmb-051","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"For constant acceleration aᴄ, integrating aᴄ = dv/dt from v₀ at t=0 gives:","o":["v = v₀ + aᴄt","v = v₀ − aᴄt","v = aᴄt²","v = v₀t"],"a":0,"e":"Integrating the constant aᴄ with respect to t and applying v=v₀ at t=0 recovers v = v₀ + aᴄt — the familiar suvat equation derived from calculus."},{"i":"PHY-1skaQbmb-052","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"Integrating v = v₀ + aᴄt with respect to time (from s₀ at t=0) gives the position function:","o":["s = s₀ + v₀t + ½aᴄt²","s = s₀ − v₀t − ½aᴄt²","s = v₀ + aᴄt","s = s₀ + ½v₀t"],"a":0,"e":"This is the calculus derivation of s = s₀ + v₀t + ½aᴄt², matching the suvat displacement equation."},{"i":"PHY-1skaQbmb-053","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"The relation v² = v₀² + 2aᴄ(s − s₀) is obtained by integrating which expression?","o":["v dv = aᴄ ds","dv/dt = s","ds = v² dt","aᴄ dt = s dv"],"a":0,"e":"Starting from aᴄ = v(dv/ds), integrating v dv = aᴄ ds gives v² = v₀² + 2aᴄ(s−s₀) — the calculus route to v²=u²+2as."},{"i":"PHY-1skaQbmb-054","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"A particle's coordinates at time t are given by x = ct² and y = bt². What can be said about its path?","o":["It moves along a straight line through the origin","It moves in a circle","It moves along a parabola only","Its motion cannot be determined"],"a":0,"e":"Since y/x = b/c is constant for all t, the particle traces a straight line through the origin, though its speed changes with time."},{"i":"PHY-1skaQbmb-055","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"If position s(t) = 3t³ − 2t, what is the velocity function v(t)?","o":["v = 9t² − 2","v = t² − 2t","v = 9t − 2","v = 3t² − 2"],"a":0,"e":"Differentiate s(t) term by term: d/dt(3t³)=9t², d/dt(−2t)=−2, giving v(t)=9t²−2."},{"i":"PHY-1skaQbmb-056","c":"PHY","u":"Kinematics: Calculus kinematics","s":"mcq","q":"For s(t) = 3t³ − 2t, what is the acceleration function a(t)?","o":["a = 18t","a = 9t","a = 6t","a = 3t²"],"a":0,"e":"Differentiate v(t) = 9t²−2 to get a(t) = d/dt(9t²−2) = 18t."},{"i":"PHY-1skaQbmb-057","c":"PHY","u":"Kinematics: Definitions","s":"fill","q":"The quantity that describes how far a body is from its starting point, and in what direction, is called ______.","acc":["displacement"],"e":"Displacement is the vector quantity describing distance from start point plus direction."},{"i":"PHY-1skaQbmb-058","c":"PHY","u":"Kinematics: Definitions","s":"fill","q":"The amount of 'ground' covered by a moving body, regardless of direction, is called ______.","acc":["distance"],"e":"Distance is the scalar total path length travelled."},{"i":"PHY-1skaQbmb-059","c":"PHY","u":"Kinematics: suvat equations","s":"fill","q":"The suvat equation that has no acceleration term is s = ½(______ + v)t.","acc":["u"],"e":"s = ½(u + v)t needs only initial velocity u, final velocity v and time t — acceleration is not required."},{"i":"PHY-1skaQbmb-060","c":"PHY","u":"Kinematics: Vertical motion","s":"fill","q":"For an object thrown vertically upward, at the point of maximum height, its instantaneous velocity is ______.","acc":["0","zero"],"e":"At maximum height the object momentarily stops rising before falling back, so v = 0 there."},{"i":"PHY-1skaQbmb-061","c":"PHY","u":"Kinematics: Calculus kinematics","s":"fill","q":"If v(t) = ds/dt, then acceleration a(t) can also be written as the ______ derivative of position with respect to time.","acc":["second"],"e":"Since a = dv/dt = d(ds/dt)/dt = d²s/dt², acceleration is the second derivative of position with respect to time."},{"i":"PHY-1skaQbmb-062","c":"PHY","u":"Kinematics: suvat problems","s":"fill","q":"A stone thrown vertically upward returns to its starting height with a speed ______ its initial launch speed (assuming no air resistance).","acc":["equal to","equal","same as","the same as"],"e":"By symmetry of projectile motion under constant gravity, the return speed at the launch height equals the initial launch speed."},{"i":"PHY-1umTOHQy-001","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which of the following is a non-conservative force?","o":["Gravitational force","Elastic (spring) force","Friction","Electrostatic force"],"a":2,"e":"Friction is path-dependent and dissipates mechanical energy as heat, so it is non-conservative — unlike gravity, elastic, and electrostatic forces."},{"i":"PHY-1umTOHQy-002","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A 2kg ball moving at 6 m/s collides with a stationary 3kg ball. After collision, the 2kg ball moves at 2 m/s. Find the 3kg ball's velocity (momentum conserved).","o":["2.67 m/s","4 m/s","6 m/s","1.33 m/s"],"a":0,"e":"Total momentum before = total momentum after: 2(6) + 3(0) = 2(2) + 3v → 12 = 4 + 3v → v = 2.67 m/s."},{"i":"PHY-1umTOHQy-003","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which statement correctly defines a conservative force?","o":["It does positive work over any closed path","It does zero net work over any closed path","It depends on the object's mass only","It always points toward a fixed centre"],"a":1,"e":"A conservative force does zero net work over any closed path; a non-conservative force like friction does negative work over a closed path, dissipating energy as heat."},{"i":"PHY-1umTOHQy-004","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"According to the law of conservation of electric charge:","o":["It can be created but not destroyed","It cannot be created or destroyed, only transferred","It can be destroyed but not created","It is not a conserved quantity"],"a":1,"e":"Electric charge cannot be created or destroyed — it can only be transferred between objects or conserved within an isolated system."},{"i":"PHY-1umTOHQy-005","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"According to Kepler's Second Law, a planet moves:","o":["At constant speed throughout its orbit","Faster when farther from the Sun","Faster when closer to the Sun","Only in a perfect circle"],"a":2,"e":"Kepler's Second Law (equal areas in equal times) implies a planet moves FASTER when closer to the Sun."},{"i":"PHY-1umTOHQy-006","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"The dimensional formula for force is:","o":["[MLT⁻¹]","[MLT⁻²]","[ML²T⁻²]","[ML⁻¹T⁻²]"],"a":1,"e":"F=ma → dimensions = [M][LT⁻²] = [MLT⁻²]."},{"i":"PHY-1umTOHQy-007","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Earth's axial precession, similar to a spinning top, is caused mainly by:","o":["Solar wind pressure","Gravitational torque from the Sun and Moon","Magnetic field reversal","Atmospheric friction"],"a":1,"e":"Earth's axial precession (~26,000-year cycle) is caused by gravitational torque from the Sun and Moon acting on Earth's equatorial bulge."},{"i":"PHY-1umTOHQy-008","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Negative acceleration is also referred to as:","o":["Impulse","Deceleration/retardation","Displacement","Velocity"],"a":1,"e":"Negative acceleration is called deceleration or retardation."},{"i":"PHY-1umTOHQy-009","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"In unit vector notation, a vector A = 3i + 4j has a magnitude of:","o":["5","7","12","25"],"a":0,"e":"|A| = √(3²+4²) = √25 = 5."},{"i":"PHY-1umTOHQy-010","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which suvat equation would you use to find displacement without knowing final velocity, given u, a, and t?","o":["v=u+at","s=ut+½at²","v²=u²+2as","s=vt−½at²"],"a":1,"e":"s = ut + ½at² uses only u, a, and t — no final velocity v is needed."},{"i":"PHY-1umTOHQy-011","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"The centre of mass of a system remains at rest when:","o":["All internal forces are equal","No net external force acts on the system","The system has only one particle","The system is rotating uniformly"],"a":1,"e":"The centre of mass remains at rest (or in uniform motion) only when no net EXTERNAL force acts on the system — internal forces don't affect it."},{"i":"PHY-1umTOHQy-012","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"According to Einstein's relativity, a clock moving at high speed relative to an observer will:","o":["Tick faster","Tick slower","Stop entirely","Tick at the same rate"],"a":1,"e":"A clock moving at high speed relative to an observer ticks SLOWER from that observer's perspective (time dilation)."},{"i":"PHY-1umTOHQy-013","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A gyroscope maintains its orientation mainly because of:","o":["Conservation of linear momentum","Conservation of angular momentum","Newton's Third Law","Gravitational force"],"a":1,"e":"A gyroscope maintains its orientation due to conservation of angular momentum — its spinning rotor resists changes to its spin axis."},{"i":"PHY-1umTOHQy-014","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which property makes the SI system 'absolute'?","o":["It uses powers of ten","It has no gravitational units, eliminating dependence on g","It assigns one unit per quantity","It was created in 1960"],"a":1,"e":"SI is called 'absolute' because it has no gravitational units, eliminating any dependence on the local value of g."},{"i":"PHY-1umTOHQy-015","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A ball falls from rest and lands after 3 seconds. Find the height it fell from (g=9.8 m/s²).","o":["44.1m","29.4m","88.2m","14.7m"],"a":0,"e":"s = 0 + ½(9.8)(3²) = ½(9.8)(9) = 44.1m."},{"i":"PHY-1umTOHQy-016","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which of these is a vector quantity?","o":["Energy","Temperature","Torque","Density"],"a":2,"e":"Torque has both magnitude and a rotational direction, making it a vector; energy, temperature, and density are all scalars."},{"i":"PHY-1umTOHQy-017","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A boat moves north at 15 m/s in a river flowing west at 8 m/s. Find the boat's resultant speed.","o":["17 m/s","23 m/s","7 m/s","12 m/s"],"a":0,"e":"Resultant = √(15²+8²) = √289 = 17 m/s."},{"i":"PHY-1umTOHQy-018","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Using ω(p) = rMg/(Iω), if the spin rate ω is doubled while other factors remain constant, the precession rate will:","o":["Double","Halve","Remain the same","Quadruple"],"a":1,"e":"Since ω(p) = rMg/(Iω), ω(p) is inversely proportional to ω — doubling ω halves the precession rate."},{"i":"PHY-1umTOHQy-019","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Two vectors of magnitude 4N and 5N act in the same direction. Find their resultant.","o":["1N","9N","6.4N","20N"],"a":1,"e":"Vectors in the same direction simply add: 4N + 5N = 9N."},{"i":"PHY-1umTOHQy-020","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Two masses attract each other with a force of 12N. If the distance between them is tripled, the new force is approximately:","o":["4N","36N","1.33N","6N"],"a":2,"e":"F(new) = F(old)/3² = 12/9 ≈ 1.33N (inverse-square law)."},{"i":"PHY-1umTOHQy-021","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A stone is thrown vertically upward at 10 m/s. Using v²=u²+2as, find the maximum height reached (g=9.8 m/s²).","o":["5.10m","10.2m","1.02m","20.4m"],"a":0,"e":"0 = 10² − 2(9.8)s → s = 100/19.6 ≈ 5.10m."},{"i":"PHY-1umTOHQy-022","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A system that exchanges energy but not matter with its surroundings is called:","o":["An open system","A closed system","An isolated system","A rotary system"],"a":1,"e":"A closed system exchanges energy with its surroundings but not matter, distinguishing it from open (both) and isolated (neither) systems."},{"i":"PHY-1umTOHQy-023","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"The motion of a swinging pendulum bob is an example of:","o":["Rectilinear motion","Rotary motion","Oscillatory motion","Curvilinear motion"],"a":2,"e":"A pendulum bob swinging to and fro about a mean position is the classic example of oscillatory motion."},{"i":"PHY-1umTOHQy-024","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which type of time is measured using caesium atom vibrations?","o":["Sidereal Time","Atomic Time","Universal Time","Biological Time"],"a":1,"e":"Atomic time is measured using the precise vibration frequency of caesium atoms, and defines the SI second."},{"i":"PHY-1umTOHQy-025","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which of the following is a fundamental (base) SI unit?","o":["Newton","Joule","Kilogram","Watt"],"a":2,"e":"Kilogram is one of the 7 SI base (fundamental) units; Newton, Joule, and Watt are all derived units."},{"i":"PHY-1umTOHQy-026","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Newton's Second Law in its most general form is expressed as:","o":["F=ma","F=dp/dt","F=mv","F=m/a"],"a":1,"e":"Newton's Second Law in its most general form is F = dp/dt, which reduces to F=ma for constant mass."},{"i":"PHY-1umTOHQy-027","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"What provides the centripetal force that keeps a satellite in orbit around a planet?","o":["The satellite's own thrust","Gravitational force from the planet","Atmospheric drag","The satellite's angular momentum"],"a":1,"e":"Gravitational force from the planet supplies the inward centripetal force keeping a satellite in orbit."},{"i":"PHY-1umTOHQy-028","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Two masses, 4kg at x=2m and 6kg at x=7m, lie on a line. Find the position of their centre of mass.","o":["5m","4.5m","5.5m","4m"],"a":0,"e":"x(COM) = (4×2 + 6×7)/(4+6) = (8+42)/10 = 5m."},{"i":"PHY-1umTOHQy-029","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A 0.5kg ball moving at 20 m/s is brought to rest in 0.1s. Calculate the impulse delivered to the ball.","o":["10 Ns","100 Ns","2 Ns","0.1 Ns"],"a":0,"e":"Impulse = |Δp| = |0.5(0−20)| = 10 Ns."},{"i":"PHY-1umTOHQy-030","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"1 Newton is equal to how many dynes?","o":["10³","10⁵","10⁷","10⁻⁵"],"a":1,"e":"1 Newton = 10⁵ dyne (standard MKS-to-CGS force conversion)."},{"i":"PHY-1umTOHQy-031","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"A passenger is pushed backward when a bus suddenly accelerates forward. This is best explained by:","o":["Newton's Second Law","Newton's Third Law","Newton's First Law","The law of conservation of momentum"],"a":2,"e":"The passenger's inertia (Newton's First Law) causes them to resist the sudden forward acceleration of the bus, appearing pushed backward relative to it."},{"i":"PHY-1umTOHQy-032","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Proper time is best described as:","o":["Time measured by a fixed external observer","The time interval experienced in one's own reference frame","Time based on Earth's rotation","Time defined by caesium vibrations"],"a":1,"e":"Proper time is the time interval experienced by an observer in their own moving reference frame, as opposed to coordinate time measured externally."},{"i":"PHY-1umTOHQy-033","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which of these is NOT a valid reason GPS satellites must apply relativistic corrections?","o":["Motion-based time dilation","Gravitational time dilation","Their high orbital speed","Their use of atomic clocks alone without correction"],"a":3,"e":"GPS satellites DO need corrections for both motion-based and gravitational time dilation due to their speed and altitude — relying on atomic clocks alone without correction would introduce significant errors."},{"i":"PHY-1umTOHQy-034","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Which statement correctly distinguishes impulse from force?","o":["They have the same dimensions","Impulse = mass×distance/time; Force = mass×distance/time²","Force is always larger than impulse","Impulse cannot be calculated from force"],"a":1,"e":"Impulse has units of mass×distance/time (momentum units); force has units of mass×distance/time² — they are dimensionally distinct despite the relationship J=F·Δt."},{"i":"PHY-1umTOHQy-035","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"The relationship between orbital period T and orbital radius r for a planet is given by:","o":["T∝r","T²∝r³","T³∝r²","T∝r²"],"a":1,"e":"Kepler's Third Law (Harmonic Law): T² is proportional to r³."},{"i":"PHY-1umTOHQy-036","c":"PHY","u":"Mechanics & Space-Time","s":"mcq","q":"Precession occurs when a torque is applied to a spinning gyroscope:","o":["Parallel to its angular momentum vector","Perpendicular to its angular momentum vector","In the same direction as its spin","Opposite to gravity only"],"a":1,"e":"Precession occurs specifically when the applied torque is perpendicular to the angular momentum vector."},{"i":"AGR-AGR101-PastQ-001","c":"AGR","u":"Agricultural extension","s":"mcq","q":"Agricultural extension can be defined as:","o":["A mandatory in-school educational program","A voluntary out-of-school educational program","A government-led research initiative","A marketing strategy for agricultural products"],"a":1,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-002","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The two dimensions of agricultural extension are:","o":["Educational and communicational","Training and evaluation","Research and development","Cultural and economic"],"a":0,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-003","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The educational dimension of agricultural extension focuses on:","o":["Disseminating information on new technologies","Working with the clientele's psychology","Mobilizing community resources","Providing credit facilities for farmers"],"a":1,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-004","c":"AGR","u":"Agricultural extension","s":"mcq","q":"A heterogeneous audience in extension refers to an audience that is:","o":["Young and old","Literate and non-literate","Small-scale and large-scale farmers","All of the above"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-005","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The importance of agricultural extension includes:","o":["Shortening the gap between new farming practices and rural communities","Maximizing farmers' profit through marketing strategies","Enhancing research development for socially acceptable technologies","All of the above"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-006","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The scope of agricultural extension includes:","o":["Working with people rather than for them","Leadership development in communities","Mobilizing community resources for improved production systems","All of the above"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-007","c":"AGR","u":"Agricultural extension","s":"mcq","q":"Limitations to agricultural extension work in Nigeria include:","o":["Inadequate supporting services","Low morale among extension officers","Weak linkages between extension organizations and research institutes","All of the above"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-008","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The role of agricultural extension in educational development is to:","o":["Maximize farmers' utilization of resources and services","Provide credit facilities to farmers","Improve marketing strategies for agricultural products","Enhance sustainability and environmental management"],"a":0,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-009","c":"AGR","u":"Agricultural extension","s":"mcq","q":"Agricultural extension plays a role as a vacuum filler by:","o":["Providing training facilities and programs for farmers","Educating farmers on marketing and investment information","Filling the information gap for farmers on inputs, credit facilities, and markets","Promoting concepts of sustainability and environmental management"],"a":2,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-010","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The role of the government in agricultural extension includes:","o":["Providing adequate infrastructure facilities for agriculture","Establishing rural credit opportunities for farmers","Creating a conducive environment for extension work","All of the above"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-011","c":"AGR","u":"Agricultural extension","s":"mcq","q":"One of the responsibilities of the government in agricultural extension is to:","o":["Develop training programs for extension workers","Ensure prompt payment of salaries and allowances for extension workers","Establish effective linkage between extension program managers and policy makers","Improve marketing strategies for agricultural products"],"a":2,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-012","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The effectiveness of agricultural extension delivery depends on:","o":["Government's provision of equipment and teaching aids","The quality of extension workers","Training and re-training of extension agents and farmers","All of the above"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-013","c":"AGR","u":"Agricultural extension","s":"mcq","q":"One of the roles of extension agents is to:","o":["Develop research solutions for farmers' problems","Interpret research findings to extension agents and farmers","Provide administrative support and logistics arrangements","Communicate research findings and innovations to end users"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-014","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The main objective of agricultural extension is to:","o":["Provide credit facilities to farmers","Maximize farmers' profit through marketing strategies","Educate farmers on sustainable agricultural practices","Work with farmers to utilize tested and viable innovations"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-015","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The basic philosophy of agricultural extension is to:","o":["Impose solutions on farmers","Help farmers help themselves","Create dependency on extension services","Promote technological advancements in agriculture"],"a":1,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-016","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The philosophy of agricultural extension is based on:","o":["Dependence on extension personnel for decision making","Involvement and participatory approach","Disregard for farmers' opinions and needs","Sole reliance on technical information"],"a":1,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-017","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The ultimate goal of agricultural extension is to:","o":["Develop farmers' self-reliance","Encourage dependency on extension services","Provide all technical and production requirements for farmers","Control farmers' decision making"],"a":0,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-018","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The involvement of local leaders in extension work is important because:","o":["They provide technical information to farmers","Farmers only accept new practices when their leaders do","They have the authority to make decisions for farmers","They are responsible for training extension agents"],"a":1,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-019","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The characteristics of effective local leaders in extension work include:","o":["Individual-oriented mindset","Lack of responsibility","Intolerance and disregard for farmers' needs","Group-oriented mindset and high sense of responsibility"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-020","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The principle of starting where the people are emphasizes:","o":["Introducing complex concepts to farmers","Raising the standard of living of farmers","Adapting information to farmers' understanding","Ignoring farmers' level of understanding"],"a":2,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-021","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The principle of voluntary involvement in agricultural extension emphasizes:","o":["Coercion and forceful implementation of projects","Changing human behaviour through communication","Excluding farmers from program planning","Allowing farmers to choose their level of involvement"],"a":3,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-022","c":"AGR","u":"Agricultural extension","s":"mcq","q":"The principle of working with the whole family recognizes that:","o":["Men are the primary decision-makers in farming","Only certain family members are involved in production","The family unit is important for decision-making and adoption of technologies","Women and children have no role in farming"],"a":2,"e":"From the Agric past-question answer key. Check against course notes."},{"i":"AGR-AGR101-PastQ-023","c":"AGR","u":"Agricul <script>window.__NOTES__ = {"BIO":{"title":"Biology 101","source":"© Gabriel. Bowen BIO 101 lecture slides (Dr. O. Aromolaran), rewritten in original words. Textbook references: Taylor, Green and Stout, Biological Sciences (10th ed.); Jones et al., Cambridge International AS & A Level Biology (4th ed.).","topics":[{"title":"01 Characteristics and classification of living things","sections":["Learning objectives: describe what separates living from non-living things; explain taxonomy and phylogeny; list the eight ranks in order; place an organism at every rank; write a scientific name correctly.","Key idea: a living thing shows all of these together: cellular organisation, growth and development, response to stimuli, reproduction, heredity, adaptation, homeostasis and metabolism. A single feature is never enough. Fire grows, and a crystal gets bigger, but neither is alive.","Beyond the slides: movement, respiration, nutrition, excretion and irritability (another name for response) are also listed in textbooks, so learn both lists.","Growth happens inside one individual during its lifetime. Adaptation happens across many generations in a population.","Taxonomy is the naming and ranking side of classification. Phylogeny is the evolutionary relationship side.","The eight ranks, broadest to most specific: Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species. Memory sentence: Dear King Phillip Came Over For Good Soup.","Five kingdoms: Monera (prokaryotes, unicellular), Protista (mostly unicellular eukaryotes), Fungi (heterotrophs with cell walls), Plantae (multicellular, make their own food by photosynthesis), Animalia (multicellular, ingest food, no cell wall).","Worked example, human being: Eukarya, Animalia, Chordata, Mammalia, Primates, Hominidae, Homo, sapiens: Homo sapiens.","Worked example, fruit fly: Eukarya, Animalia, Arthropoda, Insecta, Diptera, Drosophilidae, Drosophila, melanogaster: Drosophila melanogaster.","Writing scientific names: two words, genus first with a capital letter, species in lower case. Italicise them, or underline each word separately when handwriting.","Real-world uses: correct identification of a pathogen decides the treatment; fever and diabetes are failures of homeostasis; drug breakdown in the liver is catabolism.","Common mistakes: calling fire or a car alive; mixing up growth and adaptation; confusing anabolism (build up) with catabolism (break down); writing Homo Sapiens; saying every kingdom is multicellular.","Quick revision: 8 characteristics, 8 ranks, 5 kingdoms. Taxonomy names and ranks. Phylogeny is evolutionary relationship. Scientific name: genus (capital) plus species (lower case), in italics."]},{"title":"02 Cell structure and organisation","sections":["Learning objectives: state the three parts of the cell theory and who proposed them; compare prokaryotic and eukaryotic cells; describe the main organelles and their jobs; tell plant and animal cells apart; explain where viruses fit.","Cell theory: (1) all organisms are made of cells; (2) the cell is the basic unit of structure and function; (3) new cells come from existing cells. Hooke saw dead cork cell walls in 1665. Schleiden and Schwann proposed points 1 and 2 in 1838. Virchow added point 3 in 1855.","Prokaryote (pro = before): no true nucleus, DNA in a nucleoid, 70S ribosomes, usually smaller, no membrane-bound organelles. Examples: bacteria and archaea.","Eukaryote (eu = true): true nucleus with a nuclear envelope, 80S ribosomes, membrane-bound organelles, usually larger. Examples: animals, plants, fungi and protists.","Nucleus: the control centre. Double membrane with nuclear pores. Holds DNA as chromatin, which condenses into chromosomes for division. The nucleolus makes ribosome parts.","Endoplasmic reticulum: rough ER has ribosomes and makes and folds proteins; smooth ER has no ribosomes and handles lipids.","Ribosomes: rRNA and protein, the site of protein synthesis. 70S in prokaryotes, 80S in eukaryotes. Antibiotics such as tetracycline, erythromycin and streptomycin attack bacterial 70S ribosomes.","Golgi body: a stack of flattened sacs that receives proteins from the ER, modifies them, and packs them into vesicles for use or secretion. In plants it helps make cell wall material.","Lysosomes: membrane sacs of digestive enzymes that break down waste. In white blood cells they digest germs. The sperm acrosome is a special lysosome.","Mitochondria: double membrane, inner membrane folded into cristae. They make ATP, the energy currency of the cell. Liver cells have over 2,000; red blood cells have none.","Cell membrane: a selectively permeable layer (fluid mosaic model). It controls what enters and leaves, and carries receptors for cell signalling.","Microvilli (animal cells): folds that increase surface area for absorption in the gut and reabsorption in the kidney.","Cytoskeleton: microtubules, actin filaments and intermediate filaments. It gives the cell its shape and holds organelles in place.","Peroxisomes: break down fatty acids and amino acids and detoxify poisons.","Plant versus animal cells: plants have a cell wall, a large central vacuole with a tonoplast, chloroplasts and plasmodesmata. Animal cells have centrioles and sometimes microvilli, and no cell wall or chloroplasts.","Viruses: no cell structure, DNA or RNA in a protein capsid, obligate parasites that multiply only inside a host cell. That is why they are borderline living.","Common mistakes: saying Hooke saw living cells; giving 70S to eukaryotes; saying prokaryotes have no DNA; calling viruses cells; saying mitochondria create energy (they convert it into ATP); confusing rough and smooth ER.","Quick revision: nucleus controls, ribosomes make proteins, rough ER folds proteins, smooth ER handles lipids, Golgi packs, lysosomes digest, mitochondria make ATP, peroxisomes detoxify, membrane guards. Plant only: cell wall, vacuole, chloroplasts. Animal only: centrioles."]},{"title":"03 General reproduction","sections":["Learning objectives: define reproduction; distinguish asexual from sexual reproduction; name the types of asexual reproduction with examples; name the flower parts and describe pollination and fertilisation; explain animal reproduction (fertilisation types, oviparity, ovoviviparity, viviparity, hermaphroditism).","Reproduction is how organisms produce offspring of their own kind. Asexual: one parent, no gametes, mitosis, identical offspring. Sexual: usually two parents, gametes fuse at fertilisation to form a zygote, offspring vary genetically.","Asexual methods: binary fission (one cell splits into two equal parts, as in amoeba and bacteria); budding (a bud grows on the parent, as in yeast and Hydra); spore formation (cell contents divide into spores, as in Chlamydomonas, fungi and ferns); fragmentation (body breaks into pieces that each grow into a new individual, as in planarians and sea stars); regeneration (regrowth of lost parts); parthenogenesis (an unfertilised egg develops, seen in bees, where unfertilised eggs give haploid males).","Vegetative propagation in plants (asexual): runner (lawn grass), sucker (chrysanthemum), bulb (onion), tuber (potato, with eyes), rhizome (ginger, canna), adventitious buds on leaves (Bryophyllum), and adventitious roots (sweet potato, dahlia).","Artificial propagation: cutting (a stem piece is planted and roots), layering (a branch is buried while still attached, then cut off), and gootee or air layering (a wounded branch is wrapped in moist material until it roots).","Flower parts: stamens are the male part (anther makes pollen, filament holds it). The pistil is the female part (stigma receives pollen, style joins it to the ovary, and the ovary holds ovules). Bisexual flowers have both; unisexual flowers have one.","Pollination is the transfer of pollen from anther to stigma. Self-pollination is within one flower or plant; cross-pollination is between different plants of the same species. Agents include wind, water and insects.","Fertilisation in plants: the pollen grain forms a pollen tube down the style, the male nucleus fuses with the egg in the ovule, the ovule becomes a seed, and the ovary becomes the fruit.","Animal reproductive organs: males have testes, sperm ducts and penis; females have ovaries, oviducts and uterus. Fertilisation forms a zygote, which develops into an embryo.","Internal fertilisation happens inside the female (humans, cows, dogs). External fertilisation happens outside, usually at spawning (frogs, fish).","Oviparity: eggs are laid outside, and the embryo feeds on yolk (birds, reptiles, most fish, frogs). Ovoviviparity: eggs are kept inside the mother and hatch inside or at birth (some sharks and snakes). Viviparity: young develop in the womb and are born alive (mammals, including humans).","Hermaphrodites have both male and female organs in one individual, such as tapeworms and earthworms.","Real-world uses: farmers multiply yam, cassava, sweet potato, banana and ginger by cuttings, suckers, tubers and rhizomes, which gives identical crops. Insects pollinate crops, which affects yield. Tapeworms are hermaphrodites, so one worm can produce eggs.","Common mistakes: pollination is not fertilisation; binary fission gives equal halves, while budding is a small outgrowth; parthenogenesis needs no male; oviparous means laying eggs, viviparous means live birth; humans are viviparous, not hermaphrodites; stamen is male and pistil is female.","Quick revision: asexual means one parent, mitosis and identical offspring. Flower: stamen male, pistil female. Pollination, then pollen tube, then fertilisation, then seed. Animals: oviparous, ovoviviparous, viviparous."]},{"title":"04 Chromosomes, genes and DNA","sections":["Learning objectives: describe the structure and function of chromosomes, DNA and genes; explain how they relate; use the terms allele, locus, genotype, phenotype, homozygous and heterozygous; describe the DNA double helix and how DNA differs from RNA; explain the central dogma and the triplet code.","Relationships: DNA contains genes. Genes are segments of DNA in a fixed order along chromosomes. The genome is all of these together. Half of your chromosomes come from each parent.","Human numbers: 46 chromosomes in body cells (23 pairs), 23 in gametes. Autosomes: 22 pairs. Sex chromosomes: XX (female) and XY (male). About 20,000 to 25,000 genes. About 3 billion DNA bases, 99% identical between people. Only about 1 to 5% of the genome codes for genes.","A duplicated chromosome has two identical sister chromatids joined at the centromere. Spindle fibres attach at the centromere. Telomeres protect the ends. The nucleolar organiser carries genes for ribosomal RNA. The chromonema and chromomeres are the thread and beads along the chromosome.","Chromosome number is constant for a species: housefly 12, frog 26, human 46, gorilla 48, sugar cane 80. Haploid (n) is one set; diploid (2n) is two sets. Fewer chromosomes usually means each is larger.","Chromosome types by centromere: monocentric (one centromere, most organisms), holocentric (diffuse centromere, as in Ascaris), acentric (no centromere, unstable), dicentric (two centromeres, unstable). By position: metacentric, submetacentric, acrocentric, telocentric.","Prokaryotes: one circular chromosome plus small circular plasmids, DNA only, in the cytoplasm. Eukaryotes: many linear chromosomes made of chromatin (DNA wrapped around histone proteins), inside the nucleus.","A gene has a promoter (start), exons (coding), introns (removed from mRNA), stop signals and regulatory sequences. Locus: a gene's fixed place on a chromosome. Example: the human insulin gene is at 11p15.5, which means chromosome 11, short arm, band 15.5.","Alleles are alternative forms of a gene at one locus. Multiple alleles exist when there are more than two forms, as with ABO blood groups. Genotype is the genetic make-up; phenotype is the trait shown. Homozygous means two identical alleles; heterozygous means two different alleles. Dominant alleles show in both states; recessive alleles show only when homozygous.","Examples: cystic fibrosis is autosomal recessive (two copies needed). Huntington's disease is autosomal dominant (one copy is enough). Eye colour actually involves several genes.","DNA structure, proposed by Watson and Crick in 1953: a double helix of two polynucleotide strands. Each nucleotide has a sugar (deoxyribose), a phosphate and a base. Bases: adenine, thymine, cytosine and guanine. Purines (two rings): A and G. Pyrimidines (one ring): C and T. Base pairing: A with T, C with G, held by hydrogen bonds.","DNA versus RNA: DNA has deoxyribose, bases A, G, C and T, and is double-stranded. RNA has ribose, bases A, G, C and U (uracil), and is usually single-stranded. RNA types: mRNA carries the code, rRNA forms ribosomes, tRNA brings amino acids.","Central dogma: DNA is transcribed to mRNA in the nucleus, and mRNA is translated to protein at the ribosome. A codon is three bases, one amino acid. There are 64 codons: 61 code for 20 amino acids, and 3 are stop codons (UAA, UAG, UGA). AUG is the start codon for methionine. The code is degenerate, so several codons can code for one amino acid.","Worked example: template strand TAC-GGA-CTT gives mRNA AUG-CCU-GAA, which gives amino acids methionine, proline and glutamate.","Real-world uses: ABO and Rh blood groups decide transfusion compatibility. DNA profiling is used in forensics and paternity tests. Cancers often start from DNA mutations. DNA testing is used in personalised medicine.","Common mistakes: confusing base pairing with purine and pyrimidine classes; writing thymine in RNA; saying a gene is a chromosome; saying body cells have 23 chromosomes; confusing chromatid with chromosome; saying every codon codes for an amino acid; mixing up allele, gene, genotype and phenotype; saying introns are translated.","Quick revision: DNA is inside genes, genes are on chromosomes, chromosomes make up the genome. Human: 46 chromosomes, 23 in gametes. DNA: double helix, A-T, C-G, deoxyribose. RNA: uracil, single strand. DNA to RNA to protein. Codon: three bases. Stop codons: UAA, UAG, UGA."]},{"title":"Introduction & Ecological Definitions","sections":["Ecology comes from Greek oikos (home/dwelling place) and logos (study/discourse).","Ecological levels in the material run from individual → population → community → ecosystem → landscape → global.","Biotic components are living parts; abiotic components are non-living matter and energy such as climate, rock, soil, air and water.","A niche is the functional role of an organism and includes its interactions with biotic and abiotic components. Fundamental and realized niches are identified.","A habitat is the typical living area; a microhabitat is a small habitat with special living conditions.","Environmental factors are grouped in the material as climatic, edaphic and topographic factors."]},{"title":"Ecosystem Structure","sections":["The two major ecosystem types discussed are terrestrial (land) and aquatic (water).","Biotic components are broadly divided into autotrophic and heterotrophic organisms.","Producers manufacture food; consumers obtain chemical energy by feeding; detritivores feed on fragments of dead material; decomposers break down waste and remains.","Terrestrial examples include herbs, trees and grasses as producers; aquatic examples include phytoplankton.","Abiotic components include soil, air and sunlight in terrestrial systems, and sediments, water and sunlight in aquatic systems."]},{"title":"Energy Flow & Trophic Levels","sections":["The sun is described as the vital energy source powering life activities in ecosystems on Earth.","Plants, algae and autotrophic bacteria capture solar energy through photosynthesis and create organic food molecules.","Consumers gain chemical energy by eating autotrophs and/or other organisms; decomposers obtain energy from dead material and waste.","Energy is lost as heat at each transfer, so energy flows through ecosystems and requires continuing solar input.","The material states about 5% of incoming solar radiation is converted into GPP, and NPP is given as 50–80% of GPP.","Trophic levels describe the feeding position of organisms: producers, primary consumers, secondary/tertiary/other consumers, with decomposers and detritivores also discussed."]},{"title":"Food Chains & Food Webs","sections":["A food chain is a linear sequence of energy transfer through organisms, each feeding on the preceding organism.","A food chain usually starts with producers and ends with a top consumer in the simplified model.","The material describes grazing and detrital pathways and notes that food chains are generally limited to three or four links.","A food web is a mesh of interlinking food chains and better reflects complex feeding relationships.","Many organisms feed on more than one organism and may themselves be preyed upon by several kinds of organisms.","Humans are given as an example of omnivores that can feed at different trophic levels."]},{"title":"Ecological Pyramids","sections":["Three major types in the material are pyramid of numbers, biomass and energy.","A pyramid of numbers represents the number of organisms at each trophic level; its shape can be distorted by large differences in organism size or number.","A pyramid of biomass represents total mass at each trophic level at a given time; this is standing (crop) biomass.","Biomass pyramids are mostly upright but may be inverted in aquatic ecosystems when producers such as phytoplankton have high reproduction and death rates.","A pyramid of energy represents energy flowing through each trophic level over a time period, for example kJ m−2 yr−1.","The supplied material calls the energy pyramid the most fundamental and reliable representation among the three."]},{"title":"Biogeochemical Cycles","sections":["A biogeochemical cycle is the cyclical movement of elements (inorganic nutrients) through biotic and abiotic components.","Essential-element biogeochemical cycles are also called nutrient cycles.","Elements may be incorporated into complex organic molecules and later returned to simpler organic or inorganic forms by decomposition.","The material identifies four compartments: living tissues/by-products, solution, atmosphere, and rocks/soil where elements may be temporarily unavailable.","Nitrogen, carbon and water/hydrological cycling are developed in the supplied material."]},{"title":"Nitrogen Cycle","sections":["The six stages listed are nitrogen fixation, assimilation, ammonification, nitrification, denitrification and sedimentation.","Nitrogen fixation converts atmospheric nitrogen into more biologically available forms. The material describes physicochemical and biological fixation.","Biological fixation includes free-living bacteria such as Azotobacter and Clostridium and symbiotic bacteria such as Rhizobium and Bradyrhizobium in legume root nodules.","Assimilation involves uptake of inorganic nitrogen such as nitrates, nitrites and ammonia by green plants and conversion into organic nitrogen compounds.","Ammonification decomposes organic nitrogen from faeces and dead organisms and releases ammonium ions or ammonia; it is also called nitrogen mineralization.","Nitrification oxidizes ammonium to nitrites and nitrites to nitrates; organisms named include Nitrosomonas/Nitrococcus and Nitrobacter among those described.","Denitrification is anaerobic reduction of nitrates/ammonia to volatile nitrogen forms that return to the atmosphere. Sedimentation represents nitrogen loss into rocks and sea-bed sediments."]},{"title":"Carbon, Water & Hydrological Cycles","sections":["Carbon cycling includes carbon stored in atmosphere/ocean, fixation of carbon, and release of CO₂ back to the atmosphere.","CO₂ is converted by photoautotrophs during photosynthesis into simple carbohydrates and transferred through food chains.","Respiration returns carbon to the atmosphere. Some carbon remains stored longer in sediments and contributes to compounds such as coal, chalk, oil and limestone.","The material also identifies deforestation, cement production from limestone and fossil-fuel burning as sources of CO₂ release.","Water is essential as a solvent and medium for chemical reactions; the water cycle is mainly driven by solar energy.","Evaporation, condensation and precipitation are major movements; the material describes net movement of water vapour from ocean to land.","Evapotranspiration combines soil evaporation and plant transpiration; the supplied material states that over 90% of water lost on land is by plant transpiration.","Groundwater concepts in the material include the zone of saturation and its upper surface, the water table, plus impermeable rock."]}]},"CHM":{"title":"Chemistry 101","source":"Source: Chemical Equilibria study hub. Not yet verified with your lecturer. Practice and study only until verified.","topics":[{"title":"Chemical equilibrium","sections":["The state of a reversible reaction in which the two opposing reactions occur at the same rate, so the concentrations of reactants and products do not change with time.","• Not all reactions go to completion. Products can react to re-form the reactants: A + B ⇌ C + D.","• A reversible reaction proceeds in the forward and reverse direction simultaneously.","• Reactions involving gases are carried out in closed containers.","• Reactants are not completely consumed. You get an equilibrium mixture of reactants and products, and the amount of every species stays constant."]},{"title":"Homogeneous equilibria and Kc","sections":["Reactants and products are in the same phase. For aA + bB ⇌ cC + dD:","Kc = [C]c[D]d / [A]a[B]b","Products go in the numerator, reactants in the denominator.","Reaction | | K | c","H₂ + I₂ ⇌ 2HI | | [HI]² / ([H₂][I₂])","CH₄ + H₂O ⇌ CO₂ + 3H₂ | | [CO₂][H₂]³ / ([CH₄][H₂O])"]},{"title":"Kp (gases)","sections":["For gases it is more convenient to use partial pressures: Kp = PCcPDd / PAaPBb"]},{"title":"Relationship between Kp and Kc","sections":["• PV = nRT, so P = (n/V)RT = CRT. Hence PA = [A]RT, and so on.","• Substituting into Kp gives Kp = Kc(RT)Δn, where Δn = (c + d) − (a + b) (moles of gaseous products minus moles of gaseous reactants).","• Δn > 0 → Kp > Kc. Δn < 0 → Kp < Kc. Δn = 0 → Kp = Kc.","• R = 0.082 L atm mol⁻¹ K⁻¹. T must be in kelvin (T = °C + 273)."]},{"title":"Worked examples","sections":["Ex 3. N₂ + 3H₂ ⇌ 2NH₃, Kc = 5.6 × 10⁻² at 400 °C. Δn = 2 − 4 = −2, T = 673 K. Kp = 5.6×10⁻² × (0.082 × 673)⁻² = 1.84 × 10⁻⁵.","Ex 4. 2SO₂ + O₂ ⇌ 2SO₃ at 872 °C; [SO₂] = 0.32, [O₂] = 0.27, [SO₃] = 0.43 mol dm⁻³. Kc = 0.43² / (0.32² × 0.27) = 6.69.","Ex 5. 6 L bulb at 600 °C, equilibrium: 2.00 mol H₂, 4.21 mol N₂, 0.23 mol NH₃. [N₂] = 0.7017, [H₂] = 0.3333, [NH₃] = 0.0383 mol L⁻¹. Kc = 0.0383² / (0.7017 × 0.3333³) = 0.0565."]},{"title":"Liquid equilibria (esterification)","sections":["CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O. Start with a mol acid and b mol ethanol in volume V; x mol of ester at equilibrium.","acid | | ethanol | | ester | | water","Initial moles | | a | | b | | – | | –","Equilibrium moles | | a − x | | b − x | | x | | x","Equilibrium conc. | | (a−x)/V | | (b−x)/V | | x/V | | x/V","Kc = x² / [(a − x)(b − x)]. V cancels because the moles of products equal the moles of reactants (Δn = 0)."]},{"title":"Reaction quotient, Q","sections":["• Q measures the relative amounts of reactants and products at a given point in time.","• It has the same expression as K, but the values are not necessarily at equilibrium. Q is for reactions not at equilibrium. K is for reactions at equilibrium.","• Pure liquids have activity/concentration = 1, so they are left out of the expression.","Comparison | | Direction","Q > K | c | | | Shifts LEFT (favours reactants)","Q < K | c | | | Shifts RIGHT (favours products)","Q = K | c | | | At equilibrium","Ex 6. HCl(g) + NaOH(aq) ⇌ NaCl(aq) + H₂O(l); Kc = 0.82; [HCl] = 4.6, [NaOH] = 2.3, [NaCl] = 8. Qc = 8 / (4.6 × 2.3) = 0.756 < 0.82, so the reaction shifts right.","Ex 7. 0.045 mol N₂, 0.16 mol H₂, 6.5×10⁻² mol NH₃ in 110 cm³; Kc = 0.124 at 300 °C. [N₂] = 0.409, [H₂] = 1.455, [NH₃] = 0.591 mol dm⁻³. Q = 0.591² / (0.409 × 1.455³) ≈ 0.277 > 0.124, so the reaction goes left.","Note: the lecture slide prints [NH₃] = 0.509 and Q = 0.206. Dividing 0.065 by 0.110 actually gives 0.591 and Q ≈ 0.277. The conclusion (Q > K, so left) is the same either way."]},{"title":"Van't Hoff equation: temperature dependence of K","sections":["• ΔG° = −RT ln K = −2.303 RT log K (the van't Hoff isotherm).","• ΔG° negative → log K positive (K > 1), the forward reaction is spontaneous.","• ΔG° positive → log K negative (K < 1), the reverse reaction is spontaneous.","• ΔG° = 0 → K = 1, at equilibrium.","• ΔG = ΔH − TΔS, so ln K = ΔS/R − ΔH/RT.","• Differential form: d(ln Kp)/dT = ΔH/RT². Integrated: ln Kp = −ΔH/RT + C.","• A plot of log K against 1/T is a straight line with slope −ΔH/2.303R.","• Exothermic (ΔH negative): Kp decreases as T rises. Endothermic (ΔH positive): Kp increases as T rises.","• Between two temperatures: ln(Kp2/Kp1) = (ΔH/R)·(T₂ − T₁)/(T₁T₂), or log(Kp2/Kp1) = ΔH/(2.303R) · (T₂ − T₁)/(T₁T₂). From Kp1 and Kp2 you can calculate ΔH.","Ex 8. ΔG° = −20 kJ at 25 °C. log K = 20000 / (2.303 × 8.314 × 298) = 3.505, so K ≈ 3.2 × 10³.","Ex 9. 2NH₃ ⇌ 3H₂ + N₂; Kp = 1.53×10⁻³ at 30 °C (303 K) and 3.65 at 59 °C (332 K). log(3.65 / 1.53×10⁻³) = 3.3776 = ΔH/(2.303 × 8.314) × 2.883×10⁻⁴, so ΔH ≈ +224.3 kJ (endothermic, which fits K rising with T)."]}]}};</script>
<script>window.__CARDS__ = {"CHM":[{"front":"Chemical equilibrium","back":"State of a reversible reaction where forward and reverse rates are equal and concentrations stop changing with time","u":"Chemical equilibria"},{"front":"Reversible reaction","back":"A reaction that goes in the forward and reverse direction simultaneously","u":"Chemical equilibria"},{"front":"Why are gas reactions done in closed containers?","back":"So reactants and products stay in the system and an equilibrium mixture can form","u":"Chemical equilibria"},{"front":"Homogeneous equilibrium","back":"Reactants and products are all in the same phase","u":"Chemical equilibria"},{"front":"Kc expression for aA + bB ⇌ cC + dD","back":"[C]^c [D]^d / ([A]^a [B]^b)","u":"Chemical equilibria"},{"front":"Where do products go in Kc?","back":"Numerator (reactants go in the denominator)","u":"Chemical equilibria"},{"front":"Kc for H₂ + I₂ ⇌ 2HI","back":"[HI]² / ([H₂][I₂])","u":"Chemical equilibria"},{"front":"Kc for CH₄ + H₂O ⇌ CO₂ + 3H₂","back":"[CO₂][H₂]³ / ([CH₄][H₂O])","u":"Chemical equilibria"},{"front":"Kp expression","back":"Partial pressures of products over reactants, each raised to its coefficient: Pc^c Pd^d / (Pa^a Pb^b)","u":"Chemical equilibria"},{"front":"When is Kp used?","back":"For reactions involving gases (partial pressures)","u":"Chemical equilibria"},{"front":"Partial pressure in terms of concentration","back":"P = CRT, i.e. P_A = [A]RT","u":"Chemical equilibria"},{"front":"Kp–Kc relationship","back":"Kp = Kc (RT)^Δn","u":"Chemical equilibria"},{"front":"Δn","back":"(moles of gaseous products) − (moles of gaseous reactants)","u":"Chemical equilibria"},{"front":"Δn > 0","back":"Kp > Kc","u":"Chemical equilibria"},{"front":"Δn < 0","back":"Kp < Kc","u":"Chemical equilibria"},{"front":"Δn = 0","back":"Kp = Kc","u":"Chemical equilibria"},{"front":"R (for Kp calculations)","back":"0.082 L atm mol⁻¹ K⁻¹","u":"Chemical equilibria"},{"front":"Temperature conversion","back":"T(K) = °C + 273","u":"Chemical equilibria"},{"front":"Δn for N₂ + 3H₂ ⇌ 2NH₃","back":"2 − 4 = −2","u":"Chemical equilibria"},{"front":"Esterification Kc (a mol acid, b mol ethanol, x mol ester)","back":"x² / ((a − x)(b − x))","u":"Chemical equilibria"},{"front":"Why V cancels in esterification Kc","back":"Moles of products = moles of reactants (Δn = 0)","u":"Chemical equilibria"},{"front":"Reaction quotient (Q)","back":"Same expression as K but with non-equilibrium concentrations or pressures; measures the reaction at a given moment","u":"Chemical equilibria"},{"front":"Q vs K","back":"Q is for reactions not at equilibrium; K is for reactions at equilibrium","u":"Chemical equilibria"},{"front":"Q > Kc","back":"Shifts left (towards reactants)","u":"Chemical equilibria"},{"front":"Q < Kc","back":"Shifts right (towards products)","u":"Chemical equilibria"},{"front":"Q = Kc","back":"System is at equilibrium","u":"Chemical equilibria"},{"front":"Concentration of a pure liquid in K or Q","back":"Taken as 1 (left out)","u":"Chemical equilibria"},{"front":"Van't Hoff isotherm","back":"ΔG° = −RT ln K = −2.303 RT log K","u":"Chemical equilibria"},{"front":"ΔG° < 0","back":"K > 1; forward reaction spontaneous","u":"Chemical equilibria"},{"front":"ΔG° > 0","back":"K < 1; reverse reaction spontaneous","u":"Chemical equilibria"},{"front":"ΔG° = 0","back":"K = 1; at equilibrium","u":"Chemical equilibria"},{"front":"ln K in terms of ΔH and ΔS","back":"ln K = ΔS/R − ΔH/RT","u":"Chemical equilibria"},{"front":"Integrated van't Hoff equation","back":"ln Kp = −ΔH/RT + C (slope of log K vs 1/T = −ΔH/2.303R)","u":"Chemical equilibria"},{"front":"Exothermic reaction and temperature","back":"ΔH negative; Kp decreases as T increases","u":"Chemical equilibria"},{"front":"Endothermic reaction and temperature","back":"ΔH positive; Kp increases as T increases","u":"Chemical equilibria"},{"front":"Two-temperature van't Hoff equation","back":"ln(Kp2/Kp1) = (ΔH/R)(T2 − T1)/(T1T2)","u":"Chemical equilibria"},{"front": <script>window.__PRACTICALS__ = {"PHY":{"course":"PHY","code":"PHY107","title":"PHY 107 Practicals","source":"PHY 107 practical manual (Experiments Three to Seven). Method and evaluation only. Enter your own readings: no sample numbers are included.","experiments":[{"n":1,"title":"Simple pendulum: acceleration due to gravity, g","aim":"To determine the acceleration due to gravity using the simple pendulum.","apparatus":["Pendulum bob","String","Split cork","Stop clock","Metre rule","Retort stand with clamp"],"theory":["T = 2π√(L/g)","T² = 4π²L/g","T = period, L = length of string, g = acceleration due to gravity, n = number of oscillations, T = t/n"],"procedure":["Set up the apparatus as in the diagram.","Measure the length L from the point of suspension to the centre of the bob. Start with L = 100 cm.","Give the pendulum a small angular displacement.","Time 20 oscillations. Repeat the timing and take the average time t.","Calculate T = t/20 and T².","Repeat for L = 80, 70, 60, 50 and 40 cm."],"table":["L (cm)","t1 (s)","t2 (s)","t3 (s)","Average t (s)","T = t/20 (s)","T² (s²)"],"evaluation":["Plot a graph of T² against L and estimate its slope.","From the slope, find g using g = 4π²/slope.","State three precautions taken to ensure accurate results."],"method":"The graph of T² against L is a straight line through the origin with slope 4π²/g, so g = 4π² ÷ slope.","precautions":["Keep the angle of swing small (about 5° or less) so the motion stays simple harmonic.","Time 20 complete oscillations and repeat the timing, starting the count at the equilibrium position.","Measure L to the centre of the bob, hold the string firmly in the split cork, and keep the pendulum away from draughts so it swings in one plane."],"photos":[{"src":"/practicals/exp1-page.jpg","caption":"Your lab sheet: experiment three, the apparatus and procedure"},{"src":"/practicals/exp1-readings.jpg","caption":"Your lab sheet: the readings page and evaluation"}]},{"n":2,"title":"Spring extension: Hoo
