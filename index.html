<style>
:root{--bg:#F1F5F9;--surface:#FFFFFF;--surface2:#E8EEF5;--ink:#0E1F3D;--ink2:#52627C;--line:#D5DEEA;--brand:#0B7A75;--brand-ink:#FFFFFF;--brand-soft:#D8F0EE;--gold:#946200;--gold-soft:#F2D48A;--ok:#16825D;--ok-soft:#D6F1E5;--bad:#C93B54;--bad-soft:#FADADF;--warn:#9A6B12;--focus:#2F6FDB;--shadow:0 1px 2px rgba(14,31,61,.08),0 8px 24px rgba(14,31,61,.06);--r:14px;--head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1424;--surface:#111F36;--surface2:#182A47;--ink:#E8EEF8;--ink2:#9DB0CB;--line:#23375A;--brand:#2CC0B8;--brand-ink:#04211F;--brand-soft:#0F3A3E;--gold:#F0BD43;--gold-soft:#46330D;--ok:#3DD598;--ok-soft:#0F3A2B;--bad:#FF7088;--bad-soft:#401923;--warn:#E3B04B;--focus:#7AA7FF;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0A1424;--surface:#111F36;--surface2:#182A47;--ink:#E8EEF8;--ink2:#9DB0CB;--line:#23375A;--brand:#2CC0B8;--brand-ink:#04211F;--brand-soft:#0F3A3E;--gold:#E3B04B;--gold-soft:#3A2E12;--ok:#3DD598;--ok-soft:#0F3A2B;--bad:#FF7088;--bad-soft:#401923;--warn:#E3B04B;--focus:#7AA7FF;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}h2{font-size:1.25rem;font-weight:700}h3{font-size:1.05rem;font-weight:700}
p{margin:0}button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--ink2)}.small{font-size:.875rem}.tiny{font-size:.78rem}.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}.wrapr{flex-wrap:wrap}.between{justify-content:space-between}
.stack>*+*{margin-top:12px}.stack-l>*+*{margin-top:22px}
sup{font-size:.7em;line-height:0}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:9px;font:800 1.1rem var(--head);text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.brand{background:var(--brand-soft);color:var(--brand)}
/* hero (the one bold moment: pulse trace) */
.hero{position:relative;padding:20px 18px 14px;border-radius:20px;background:linear-gradient(135deg,#0E1F3D,#12365F 60%,#0B6B6A);color:#F2F7FF;overflow:hidden}
.hero h1{font-size:1.6rem}.hero p{color:#C4D4EC;margin-top:4px}
.hero.gold-hero{background:linear-gradient(135deg,#FFF1B8 0%,#E8B94E 52%,#B7791F 100%);color:#241805;border:1px solid #D6A33B;box-shadow:0 10px 28px rgba(148,98,0,.20)}.hero.gold-hero p,.hero.gold-hero .hero-stats span{color:#4D3510}.hero.gold-hero .monitor{border-color:rgba(148,98,0,.45)}
.pulse{display:block;width:100%;height:56px;margin-top:10px}
.pulse path{fill:none;stroke:#5EEAD4;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.2s ease-out .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-stats{display:flex;gap:22px;margin-top:6px;flex-wrap:wrap}.hero-stats b{font:800 1.3rem var(--head);display:block}.hero-stats span{font-size:.78rem;color:#C4D4EC}
/* courses */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px 12px 18px;box-shadow:var(--shadow);min-height:132px;display:flex;flex-direction:column;gap:6px}
.tile::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--c,var(--brand))}
.tile .code{font:800 1.15rem var(--head)}.tile .meta{font-size:.82rem;color:var(--ink2)}
.tile.pending{background:transparent;border:1.5px dashed var(--line);box-shadow:none;color:var(--ink2)}
.tile.pending::before{background:var(--line)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--c,var(--brand));border-radius:99px}
.status{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--brand)}.pending .status{color:var(--ink2);font-weight:600}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.gold{background:linear-gradient(180deg,#D9A42F,#B7791F);border-color:#9A6B12;color:#1D1402}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* course page rows */
.rows{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.rows>*+*{border-top:1px solid var(--line)}
.urow{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;background:none;border:0;text-align:left}
.urow:hover{background:var(--surface2)}.urow .t{flex:1;font-weight:600}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--ink2);text-decoration:none;font-weight:600;padding:6px 0}
/* form */
.field{display:block}.field>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.opt{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.opt[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
/* run */
.runbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px}
.timer{font:700 1rem var(--head);padding:5px 11px;border-radius:999px;background:var(--surface2);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}.prog>i{display:block;height:100%;background:var(--brand);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qtext{font:600 1.12rem/1.45 var(--body);margin:6px 0 16px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin-top:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.choice .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.choice[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}.choice[aria-pressed=true] .k{background:var(--brand);color:var(--brand-ink)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}.choice.right .k{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}.choice.wrong .k{background:var(--bad);color:#fff}
.choice:disabled{opacity:1;cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:.95rem}.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.warnbox{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--gold-soft);color:var(--warn);font-size:.85rem}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:780px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.map button{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.map button.ans{background:var(--brand-soft);border-color:var(--brand)}.map button.flag{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}.map button.cur{outline:3px solid var(--focus)}
/* premium exam */
.exam-head{background:linear-gradient(135deg,#0E1F3D,#14305A);color:#F2F7FF;border-radius:var(--r);padding:12px 14px;border-bottom:4px solid #D9A42F}
.exam-head .muted{color:#B7C8E3}
.slip{border:2px solid var(--gold);border-radius:var(--r);background:var(--surface);padding:16px;position:relative}
.slip dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0}.slip dt{color:var(--ink2)}.slip dd{margin:0;font-weight:700}
.rules{padding-left:18px;margin:8px 0 0}.rules li{margin:4px 0}
/* result */
.score{text-align:center;padding:22px 16px 10px}
.score .big{font:800 3.6rem/1 var(--head);letter-spacing:-.03em}
.ecg{width:100%;height:46px;margin-top:8px}.ecg path{fill:none;stroke:var(--c,var(--brand));stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.6s ease-out forwards}
.verse{border-left:4px solid var(--gold);padding:10px 14px;background:var(--gold-soft);border-radius:0 12px 12px 0}.verse q{display:block;font-style:italic;quotes:none}
.roast{padding:12px 14px;border-radius:12px;background:var(--surface2)}
.rev{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px}
.rev+.rev{margin-top:10px}.rev .a{margin-top:6px;font-size:.92rem}
/* leaderboard */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px}.lrow.me{background:var(--brand-soft)}
.rk{width:34px;text-align:center;font:800 1.05rem var(--head)}
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:end;margin-bottom:14px}
.podium>div{text-align:center;padding:12px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.podium .p1{background:var(--gold-soft);border-color:var(--gold);padding-top:20px}
/* gpa */
.gpa-row{display:grid;grid-template-columns:1fr 70px 80px 44px;gap:8px;align-items:center;padding:10px 12px}
.gpa-row input{min-height:40px;padding:0 8px;text-align:center}
.gpa-sum{display:flex;gap:26px;flex-wrap:wrap}.gpa-sum b{font:800 2rem var(--head);display:block}
/* nav, modal, toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:.74rem;font-weight:700}
.nav a svg{width:22px;height:22px}.nav a[aria-current=page]{color:var(--brand);background:var(--brand-soft)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,14,28,.62);display:grid;place-items:end center;padding:0}
@media(min-width:640px){.overlay{place-items:center;padding:20px}}
.modal{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.modal{border-radius:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;box-shadow:var(--shadow)}
.scroll-x{overflow-x:auto}
@media(prefers-reduced-motion:reduce){.pulse path,.ecg path{animation:none;stroke-dashoffset:0}.prog>i{transition:none}}
/* chess */
.chess-board{display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,420px);aspect-ratio:1;border-radius:10px;overflow:hidden;margin:0 auto;box-shadow:var(--shadow);border:2px solid #5C3D1E}
.sq{position:relative;border:0;padding:0;display:grid;place-items:center;font-size:clamp(22px,7vw,40px);line-height:1;aspect-ratio:1;min-width:0}
.sq.light{background:#EEE3C8}.sq.dark{background:#B58863}
.sq.last{background-image:linear-gradient(rgba(255,220,0,.28),rgba(255,220,0,.28))}
.sq.sel{box-shadow:inset 0 0 0 4px var(--focus)}
.sq.tgt::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.28)}
.sq.capt::after{content:"";position:absolute;inset:4%;border-radius:50%;border:4px solid rgba(0,0,0,.3)}
.sq.check{background:#E05A5A !important}
.wp{color:#FFF;text-shadow:0 0 2px #000,0 0 3px #000}
.bp{color:#111;text-shadow:0 0 1px #fff}

/* skins: glass (default) and green. Glass is a dark frosted look; green is deep emerald. */
:root[data-skin="glass"]{--page:radial-gradient(1200px 600px at 8% -10%,rgba(91,124,250,.40),transparent),radial-gradient(900px 520px at 110% 8%,rgba(45,212,191,.28),transparent),linear-gradient(160deg,#0A1020,#0F1A33 55%,#091628);--surface:rgba(255,255,255,.09);--line:rgba(255,255,255,.16);--ink:#EEF4FF;--ink2:#B3C4E3;--bg:#0B1322;--brand:#5EEAD4;--brand-ink:#04211F;--brand-soft:rgba(94,234,212,.16)}
:root[data-skin="green"]{--page:radial-gradient(900px 500px at 0% 0%,rgba(20,83,45,.9),transparent),linear-gradient(160deg,#052E16,#064E3B 60%,#022C22);--surface:rgba(16,185,129,.10);--line:rgba(110,231,183,.22);--ink:#ECFDF5;--ink2:#A7F3D0;--bg:#03241A;--brand:#34D399;--brand-ink:#022C22;--brand-soft:rgba(52,211,153,.18)}
:root[data-skin]{--page-fallback:1}
:root[data-skin] body{background:var(--page);background-attachment:fixed;min-height:100%}
:root[data-skin="glass"] .panel,:root[data-skin="glass"] .tile,:root[data-skin="glass"] .rows,:root[data-skin="glass"] .nav,:root[data-skin="glass"] .dock,:root[data-skin="glass"] .modal,:root[data-skin="glass"] .rev,:root[data-skin="glass"] .qcard,:root[data-skin="green"] .panel,:root[data-skin="green"] .tile,:root[data-skin="green"] .rows,:root[data-skin="green"] .nav,:root[data-skin="green"] .dock,:root[data-skin="green"] .modal,:root[data-skin="green"] .rev,:root[data-skin="green"] .qcard{background:var(--surface);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line);box-shadow:0 8px 32px rgba(0,0,0,.25)}
:root[data-skin="glass"] .hero,:root[data-skin="green"] .hero{background:linear-gradient(135deg,rgba(91,124,250,.55),rgba(45,212,191,.35));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.18)}
:root[data-skin="green"] .hero{background:linear-gradient(135deg,rgba(5,150,105,.7),rgba(16,185,129,.35))}
:root[data-skin] .tile,:root[data-skin] .btn{transition:transform .15s ease}
:root[data-skin] .tile:active,:root[data-skin] .btn:active{transform:scale(.98)}
.clock{font:800 1.1rem var(--head);padding:6px 12px;border-radius:10px;background:var(--surface2);font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.clock.on{background:var(--brand);color:var(--brand-ink)}
.clock.low{background:var(--bad-soft);color:var(--bad)}
/* board colours follow the look */
:root{--sq-light:#EEE3C8;--sq-dark:#B58863}
:root[data-skin="glass"]{--sq-light:rgba(226,236,255,.26);--sq-dark:rgba(18,30,64,.62)}
:root[data-skin="green"]{--sq-light:rgba(167,243,208,.36);--sq-dark:rgba(5,120,85,.62)}
.sq.light{background:var(--sq-light)}
.sq.dark{background:var(--sq-dark)}
.chess-board{border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.3)}
:root[data-skin] .chess-board{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.online-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}

/* ===== iOS-style glass (v2): layered frost, light edges, living background ===== */
:root[data-skin="glass"]{--glass-fill:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.05));--glass-edge:rgba(255,255,255,.26);--glass-shadow:0 18px 50px rgba(3,8,24,.42),0 2px 6px rgba(3,8,24,.25)}
:root[data-skin="green"]{--glass-fill:linear-gradient(145deg,rgba(167,243,208,.20),rgba(16,185,129,.05));--glass-edge:rgba(167,243,208,.28);--glass-shadow:0 18px 50px rgba(2,20,14,.45),0 2px 6px rgba(2,20,14,.25)}
:root[data-skin] body{position:relative;overflow-x:hidden;isolation:isolate}
:root[data-skin] body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;filter:blur(70px) saturate(140%);opacity:.9;animation:skinDrift 28s ease-in-out infinite alternate}
:root[data-skin="glass"] body::before{background:radial-gradient(38% 34% at 22% 26%,var(--glow-a),transparent 70%),radial-gradient(36% 32% at 78% 30%,var(--glow-b),transparent 70%),radial-gradient(40% 36% at 60% 82%,var(--glow-c),transparent 70%)}

/* course sections and a richer look */

/* Bablo helper */
.bot-fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:linear-gradient(145deg,var(--brand),#6366F1);color:#fff;font-size:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer}

}

/* quiz answers: always dark text on a tinted background, in every look and mode */
.choice.right,.choice.wrong{color:var(--ink) !important}
.choice.right{background:color-mix(in srgb,var(--ok) 22%,var(--surface)) !important}
.choice.wrong{background:color-mix(in srgb,var(--bad) 22%,var(--surface)) !important}

.choice.wrong .k{background:var(--bad) !important;color:#fff !important}

.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.sp-logo{filter:drop-shadow(0 0 22px rgba(94,234,212,.55));animation:spIn .9s cubic-bezier(.2,.8,.2,1) both}
.sp-line{fill:none;stroke-dasharray:90;stroke-dashoffset:90;animation:spDraw 1.1s ease .5s forwards}
.sp-name{font:800 1.6rem system-ui,-apple-system,Segoe UI,sans-serif;color:#EEF4FF;letter-spacing:.02em;opacity:0;animation:spFade .7s ease 1s forwards}
.sp-sub{font:600 .8rem system-ui,-apple-system,Segoe UI,sans-serif;color:#9FB3D9;letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:spFade .7s ease 1.25s forwards}
@keyframes spIn{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFade{to{opacity:1}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
.brand svg{filter:drop-shadow(0 0 10px rgba(94,234,212,.35))}
@media (prefers-reduced-motion: reduce){#splash{animation-duration:.2s;animation-delay:.2s}.sp-logo,.sp-line,.sp-name,.sp-sub{animation:none;opacity:1;stroke-dashoffset:0;transform:none}}

/* opening screen colours follow the look chosen in Settings */
#splash{--sp-a:#5EEAD4;--sp-b:#0B7A75;--sp-glow:rgba(94,234,212,.55);--sp-line:#ffffff;--sp-ink:#EEF4FF;--sp-sub:#9FB3D9;--sp-bg1:#14304a;--sp-bg2:#0a1020;--sp-bg3:#060a14}
#splash[data-look="pink"]{--sp-a:#FBCFE8;--sp-b:#BE185D;--sp-glow:rgba(244,114,182,.6);--sp-line:#FFF1F7;--sp-ink:#FFF1F7;--sp-sub:#F9A8D4;--sp-bg1:#3b0d2a;--sp-bg2:#1a0716;--sp-bg3:#0c030a}
#splash[data-look="purple"]{--sp-a:#DDD6FE;--sp-b:#6D28D9;--sp-glow:rgba(139,92,246,.65);--sp-line:#F5F3FF;--sp-ink:#F5F3FF;--sp-sub:#C4B5FD;--sp-bg1:#2a1459;--sp-bg2:#130a2e;--sp-bg3:#07041a}
#splash[data-look="gold"]{--sp-a:#E8B93C;--sp-b:#5C3305;--sp-glow:rgba(200,146,30,.62);--sp-line:#F6E7B0;--sp-ink:#F3DE9C;--sp-sub:#B8892E;--sp-bg1:#1c1302;--sp-bg2:#0c0801;--sp-bg3:#040200}
#splash[data-look="classic"]{--sp-a:#F8FAFC;--sp-b:#64748B;--sp-glow:rgba(203,213,225,.45);--sp-line:#0F172A;--sp-ink:#0F172A;--sp-sub:#475569;--sp-bg1:#FFFFFF;--sp-bg2:#F1F5F9;--sp-bg3:#E2E8F0}
#splash{background:radial-gradient(120% 90% at 50% 0%,var(--sp-bg1) 0%,var(--sp-bg2) 60%,var(--sp-bg3) 100%) !important}
#splash .sp-logo{filter:drop-shadow(0 0 22px var(--sp-glow)) !important}
#splash .sp-line{stroke:var(--sp-line) !important}
#splash .sp-name{color:var(--sp-ink) !important}
#splash .sp-sub{color:var(--sp-sub) !important}

/* hero heartbeat: the line beats at the rate set by the streak (see --beat-s) */


@media (prefers-reduced-motion: reduce){.hero .pulse{animation:none}}

/* hospital monitor: the trace sweeps; one sweep covers four beats; the speed follows the beat rate (--beat-s) */
.monitor{position:relative;height:88px;margin:16px 0 8px;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,rgba(2,17,22,.96),rgba(4,37,39,.82));border:1px solid rgba(94,234,212,.34);box-shadow:inset 0 0 30px rgba(45,212,191,.12),0 8px 24px rgba(0,0,0,.12)}
.monitor:before{content:'B A B L O  •  V I T A L S';position:absolute;top:7px;left:12px;z-index:2;color:rgba(167,243,228,.68);font:600 8px/1 system-ui;letter-spacing:1.6px;pointer-events:none}
.monitor:after{content:'LIVE  ·  ECG';position:absolute;right:10px;top:7px;z-index:2;color:#a7f3d0;font:600 8px/1 system-ui;letter-spacing:1px;pointer-events:none}
.monitor svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.monitor-svg{position:absolute;inset:0;width:100%;height:100%;display:block}.monitor-svg .ecg-base{fill:none;stroke:rgba(94,234,212,.38);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.monitor-svg .ecg-sweep{fill:none;stroke:#8FFFF0;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:190 578;stroke-dashoffset:768;filter:drop-shadow(0 0 5px rgba(94,234,212,.95));animation:ecgTrace calc(var(--beat-s,1s) * 5) linear infinite}@keyframes ecgTrace{from{stroke-dashoffset:768}to{stroke-dashoffset:0}}
.monitor-dot{position:absolute;right:14%;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#CFFFF6;box-shadow:0 0 10px #5EEAD4,0 0 18px rgba(94,234,212,.7);animation:blip var(--beat-s,1s) ease-in-out infinite}
@keyframes sweep{to{transform:translateX(-50%)}}
@keyframes blip{0%,100%{opacity:.35;transform:scale(.8)}12%{opacity:1;transform:scale(1.25)}30%{opacity:.5;transform:scale(.9)}}
@media (prefers-reduced-motion: reduce){.monitor-svg .ecg-sweep,.monitor-dot{animation:none}}


/* Gold look: gold-tinted glass (same glass as Glass), gold glow and gold edges */
:root[data-tint="gold"]{--glow-a:rgba(212,153,23,.58);--glow-b:rgba(146,87,0,.48);--glow-c:rgba(245,196,76,.30);--brand:#C58A12;--glass-edge:rgba(226,176,64,.55);--ink:#FFF3CC;--ink2:#E8C979}
:root[data-tint="gold"][data-mode="light"]{--brand:#8F5D00;--ink:#302000;--ink2:#6E4A0B;--glow-a:rgba(191,133,12,.72);--glow-b:rgba(133,77,0,.46);--glow-c:rgba(230,177,53,.40);--glass-edge:rgba(180,120,20,.45)}
:root[data-tint="gold"] .panel,:root[data-tint="gold"] .tile,:root[data-tint="gold"] .hero{border-color:rgba(253,230,138,.42)}
/* Deep gold theme: keep the gold identity, but give it a genuinely dark bronze/black base. */
:root[data-tint="gold"]:not([data-mode="light"]){--page:radial-gradient(1100px 600px at 8% -10%,rgba(181,125,19,.18),transparent),radial-gradient(900px 520px at 110% 8%,rgba(111,72,8,.16),transparent),linear-gradient(160deg,#090805,#171106 55%,#0B0905);--bg:#100D07;--surface:rgba(31,24,12,.94);--surface2:#28200F;--line:rgba(206,164,65,.25);--ink:#FFF1C5;--ink2:#D6BD7C;--brand:#C99A27;--brand-ink:#160F02;--brand-soft:#35280D;--glass-edge:rgba(214,170,62,.34);--gold:#D8AD3D;--gold-soft:#30230A;--shadow:0 2px 5px rgba(0,0,0,.42),0 12px 30px rgba(0,0,0,.28)}
:root[data-tint="gold"]:not([data-mode="light"]) .panel,:root[data-tint="gold"]:not([data-mode="light"]) .tile,:root[data-tint="gold"]:not([data-mode="light"]) .rows{background:var(--surface);border-color:var(--line)}
:root[data-tint="gold"]:not([data-mode="light"]) .btn.gold{background:linear-gradient(180deg,#8F6818,#5B3E08);border-color:#C99A27;color:#FFF1C5}


/* Gold skin must tint the entire greeting panel, not only its border. */
:root[data-tint="gold"] .hero{background:linear-gradient(135deg,#261a05 0%,#5a3b08 52%,#9b6b0d 100%);color:#fff4c9;border:1px solid rgba(255,221,117,.66);box-shadow:inset 0 1px 0 rgba(255,240,190,.16),0 12px 28px rgba(0,0,0,.22)}
:root[data-tint="gold"] .hero p,:root[data-tint="gold"] .hero-stats span{color:#f0d995}
:root[data-tint="gold"][data-mode="light"] .hero{background:linear-gradient(135deg,#fff4c8 0%,#f0cf72 52%,#c08a19 100%);color:#332300;border-color:rgba(143,93,0,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 12px 28px rgba(143,93,0,.16)}
:root[data-tint="gold"][data-mode="light"] .hero p,:root[data-tint="gold"][data-mode="light"] .hero-stats span{color:#62470d}

/* UI/UX contrast guard: keep form controls readable across glass, gold, pink, purple and classic looks. */
:root[data-skin] input:not([type="checkbox"]):not([type="radio"]),
:root[data-skin] select,
:root[data-skin] textarea{
  color:var(--ink)!important;
  background-color:var(--surface)!important;
  border-color:var(--glass-edge,var(--line))!important;
  caret-color:var(--brand);
}
:root[data-skin] select option{
  color:var(--ink)!important;
  background:var(--bg)!important;
}
:root[data-skin] input::placeholder,
:root[data-skin] textarea::placeholder{
  color:var(--ink2)!important;
  opacity:1;
}
:root[data-skin] .field>span,
:root[data-skin] label{
  color:var(--ink);
}
:root[data-skin] input:disabled,
:root[data-skin] select:disabled,
:root[data-skin] textarea:disabled{
  color:var(--ink2)!important;
  opacity:.82;
}
/* Keep the gold greeting panel visibly gold in both display modes. */
:root[data-tint="gold"] .hero{
  background:linear-gradient(135deg,#261a05 0%,#5a3b08 52%,#9b6b0d 100%)!important;
  color:#fff4c9!important;
  border:1px solid rgba(255,221,117,.66)!important;
}
:root[data-tint="gold"][data-mode="light"] .hero{
  background:linear-gradient(135deg,#fff4c8 0%,#f0cf72 52%,#c08a19 100%)!important;
  color:#332300!important;
}

:root[data-tint="gold"] .monitor{background:linear-gradient(145deg,rgba(18,12,3,.98),rgba(61,39,5,.96));border-color:rgba(240,190,64,.55);box-shadow:inset 0 0 30px rgba(212,153,23,.16),0 8px 24px rgba(0,0,0,.2)}

:root[data-tint="gold"] .monitor:after{color:#ffdf7b}

/* Responsive polish: prevent narrow screens from clipping panels and practical tables. */
@media (max-width: 640px){
  .wrap{padding-left:12px;padding-right:12px}
  .panel,.tile,.qcard,.rev{min-width:0;overflow-wrap:anywhere}
  .row{min-width:0;flex-wrap:wrap}
  .scroll-x{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  .scroll-x table{min-width:520px}
  .field{min-width:0}
  .field input,.field select,.field textarea{max-width:100%;min-width:0}
  .monitor{max-width:100%}
}
button,a,input,select,textarea{touch-action:manipulation}
:root[data-skin] :is(button,a,input,select,textarea):focus-visible{
  outline:3px solid var(--focus,#60A5FA);
  outline-offset:3px;
}
@media (prefers-reduced-motion: reduce){
  .monitor-svg .ecg-sweep{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
}

/* Consistent, softer component language across every skin (Classic remains high contrast). */
:root[data-skin]:not([data-skin="classic"]) .panel,
:root[data-skin]:not([data-skin="classic"]) .tile,
:root[data-skin]:not([data-skin="classic"]) .rows,
:root[data-skin]:not([data-skin="classic"]) .rev,
:root[data-skin]:not([data-skin="classic"]) .qcard,

}
:root[data-skin]:not([data-skin="classic"]) .tile{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}

/* Keep the base ECG line visible end-to-end while a long luminous trace sweeps over it. */

/* Calculator: familiar scientific-keypad layout with smooth, consistent key sizing. */
.calc-shell{max-width:720px;margin-inline:auto;width:100%;gap:14px}
.calc-display{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2);display:grid;gap:8px}
.calc-display input{border:0!important;background:transparent!important;box-shadow:none!important;padding:4px 0!important;min-height:38px;font-size:clamp(1rem,3.5vw,1.25rem)!important;font-variant-numeric:tabular-nums}
.calc-result{font-size:clamp(1.8rem,7vw,2.5rem);font-weight:700;text-align:right;overflow-wrap:anywhere;min-height:1.25em;font-variant-numeric:tabular-nums}
.calc-keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.calc-key{min-width:0;min-height:52px;padding:8px 4px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--ink);font-size:clamp(.9rem,3vw,1.05rem);font-weight:650;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.calc-key:active{transform:scale(.97)}
.calc-key.fn{background:var(--surface2);color:var(--ink2)}
.calc-key.op{background:color-mix(in srgb,var(--brand) 13%,var(--surface));border-color:color-mix(in srgb,var(--brand) 24%,var(--line))}
.calc-key.equals{background:var(--brand);color:#fff;border-color:var(--brand)}
.calc-key.util{background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
@media(max-width:420px){.calc-keypad{gap:6px}.calc-key{min-height:46px;border-radius:10px}}

<script>window.__BANK__ = [{"i":"BIO-14V7lkR6-001","c":"BIO","u":"Cell Structure","s":"mcq","q":"Who first observed and named 'cella' (cells) in 1665?","o":["Matthias Schleiden","Theodor Schwann","Robert Hooke","Rudolf Virchow"],"a":2,"e":"Robert Hooke examined thin slices of plant bark in 1665 and saw pore-like structures he called 'cella'."},{"i":"BIO-14V7lkR6-002","c":"BIO","u":"Cell Structure","s":"mcq","q":"Which scientist proposed that all cells arise from pre-existing cells by division?","o":["Robert Hooke","Rudolf Virchow","Matthias Schleiden","Theodor Schwann"],"a":1,"e":"Rudolf Virchow (1855) proposed the third part of cell theory: all cells arise from pre-existing cells by division."},{"i":"BIO-14V7lkR6-003","c":"BIO","u":"Cell Structure","s":"mcq","q":"Matthias Schleiden and Theodor Schwann founded the cell theory in which year?","o":["1665","1838","1855","1937"],"a":1,"e":"Schleiden and Schwann founded the cell theory in 1838; Virchow added the third principle in 1855."},{"i":"BIO-14V7lkR6-004","c":"BIO","u":"Cell Structure","s":"mcq","q":"According to cell theory, the cell is described as:","o":["An optional part of some organisms","The basic unit of structure and function of all living organisms","Only found in animals","A non-essential structure"],"a":1,"e":"Cell theory states the cell is the basic unit of structure and function of all living organisms."},{"i":"BIO-14V7lkR6-005","c":"BIO","u":"Cell Structure","s":"mcq","q":"Which of these is a feature of prokaryotic cells?","o":["True nucleus","Membrane-bound organelles","70S ribosomes","Diploid chromosomes"],"a":2,"e":"Prokaryotes have 70S ribosomes, no true nucleus, non-membrane-bound organelles, and haploid chromosomes."},{"i":"BIO-14V7lkR6-006","c":"BIO","u":"Cell Structure","s":"mcq","q":"Eukaryotic cells have ribosomes of which type?","o":["70S","80S","50S","30S"],"a":1,"e":"Eukaryotes have 80S ribosomes, larger than the 70S ribosomes of prokaryotes."},{"i":"BIO-14V7lkR6-007","c":"BIO","u":"Cell Structure","s":"mcq","q":"Which structure is found in plant cells but absent in animal cells?","o":["Mitochondria","Golgi bodies","Chloroplasts","Ribosomes"],"a":2,"e":"Chloroplasts, containing chlorophyll for photosynthesis, are found only in plant cells (and some protists)."},{"i":"BIO-14V7lkR6-008","c":"BIO","u":"Cell Structure","s":"mcq","q":"Structures found in animal cells but ABSENT in plant cells include:","o":["Cell wall and chloroplast","Centriole and microvilli","Mitochondria and nucleus","Golgi body and ER"],"a":1,"e":"Centrioles and microvilli are found in animal cells but not typically in plant cells."},{"i":"BIO-14V7lkR6-009","c":"BIO","u":"Cell Structure","s":"mcq","q":"What term describes the study of cell structure and components?","o":["Physiology","Cytology","Ecology","Taxonomy"],"a":1,"e":"Cytology is the study of the structure and components of cells, studied using light and electron microscopes."},{"i":"BIO-14V7lkR6-010","c":"BIO","u":"Cell Structure","s":"mcq","q":"Who first distinguished prokaryotic and eukaryotic cell types (1937)?","o":["Robert Hooke","Edouard Chatton","Rudolf Virchow","Carl Linnaeus"],"a":1,"e":"Edouard Chatton first distinguished the two cell types in 1937, later adopted by Stanier and Van Niel in 1962."},{"i":"BIO-14V7lkR6-011","c":"BIO","u":"Cell Structure","s":"mcq","q":"The large central vacuole in plant cells is surrounded by a membrane called the:","o":["Tonoplast","Sarcolemma","Nuclear envelope","Cell wall"],"a":0,"e":"The tonoplast surrounds the plant cell's large central vacuole, which regulates osmotic pressure."},{"i":"BIO-14V7lkR6-012","c":"BIO","u":"Cell Structure","s":"mcq","q":"Viruses are considered obligate parasites because:","o":["They have a cell wall","They can only reproduce by infecting living cells","They possess ribosomes","They have a nucleus"],"a":1,"e":"Viruses lack cell structure and can only reproduce by infecting and taking over living cells."},{"i":"BIO-14V7lkR6-013","c":"BIO","u":"Cell Structure","s":"mcq","q":"Approximately what size range do viruses fall into?","o":["20–300 nm","2–30 µm","200–300 µm","2–3 mm"],"a":0,"e":"Viruses range in size from approximately 20 to 300 nanometres."},{"i":"BIO-14V7lkR6-014","c":"BIO","u":"Cell Structure","s":"mcq","q":"The cell wall in plant cells primarily functions to:","o":["Store genetic material","Give the cell a definite shape and prevent bursting during osmosis","Produce ATP","Break down waste products"],"a":1,"e":"The cell wall gives plant cells definite shape and prevents bursting when water enters during osmosis."},{"i":"BIO-14V7lkR6-015","c":"BIO","u":"Cell Structure","s":"mcq","q":"Plasmodesmata are best described as:","o":["Pigments in the vacuole","Channels linking adjacent plant cells to one another","A type of ribosome","Protein coats on viruses"],"a":1,"e":"Plasmodesmata are channels that link plant cells to one another, singular: plasmodesma."},{"i":"BIO-14V7lkR6-016","c":"BIO","u":"Cell Structure","s":"mcq","q":"Chloroplasts are found specifically in:","o":["All parts of a plant equally","The green parts of the plant","Only the roots","Only animal cells"],"a":1,"e":"Chloroplasts are found in the green parts of the plant, containing chlorophyll which absorbs light for photosynthesis."},{"i":"BIO-14V7lkR6-017","c":"BIO","u":"Cell Structure","s":"mcq","q":"The term 'Eukaryote' derives from Greek roots meaning:","o":["Before nucleus","True nucleus","Without nucleus","Many nuclei"],"a":1,"e":"Eukaryote = 'eu' (true) + 'karyote' (nucleus) — organisms with a true, membrane-bound nucleus."},{"i":"BIO-14V7lkR6-018","c":"BIO","u":"Cell Structure","s":"mcq","q":"The term 'Prokaryote' derives from Greek roots meaning:","o":["Before nucleus","True nucleus","Without cell","Many cells"],"a":0,"e":"Prokaryote = 'pro' (before) + 'karyote' (nucleus) — organisms without a true, membrane-bound nucleus."},{"i":"BIO-14V7lkR6-019","c":"BIO","u":"Cell Structure","s":"mcq","q":"Which of these organelles is common to BOTH animal and plant cells?","o":["Chloroplast","Centriole","Mitochondria","Large permanent vacuole"],"a":2,"e":"Mitochondria are common to both animal and plant cells; chloroplasts and large permanent vacuoles are plant-specific, and centrioles are animal-specific."},{"i":"BIO-14V7lkR6-020","c":"BIO","u":"Cell Structure","s":"mcq","q":"The vacuole in plant cells contains fluid with:","o":["Only water","Pigments, enzymes, sugars, mineral salts, and gases","Only DNA","Only chlorophyll"],"a":1,"e":"The fluid in a plant vacuole contains pigments, enzymes, sugars, organic compounds, mineral salts, oxygen, and carbon dioxide."},{"i":"COS-14XaULs--001","c":"COS","u":"Computer types & classification","s":"mcq","q":"Computers can be divided into three categories according to their electronic nature. These are:","o":["Small, Medium, Large","Analog, Digital, Hybrid","Personal, Mainframe, Super","Input, Output, Processing"],"a":1,"e":"Computers are divided by electronic nature into Analogue, Digital, and Hybrid computers."},{"i":"COS-14XaULs--002","c":"COS","u":"Computer types & classification","s":"mcq","q":"Analogue computers process data that is:","o":["Discrete and countable","Continuous and cannot have discrete values","Only binary","Only text-based"],"a":1,"e":"Analogue data is continuous data that changes continuously and cannot have discrete values."},{"i":"COS-14XaULs--003","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is an example of an analogue computer?","o":["A laptop","A speedometer","A smartphone","A mainframe"],"a":1,"e":"A speedometer and mercury thermometer are classic examples of analogue computers, measuring continuous physical quantities."},{"i":"COS-14XaULs--004","c":"COS","u":"Computer types & classification","s":"mcq","q":"Analogue computers were most popular during which period, when digital computers were still costly?","o":["1920s-1930s","1950s-1960s","1980s-1990s","2000s-2010s"],"a":1,"e":"Analog computers were popular throughout the 1950s and 1960s when the cost of digital computers was still very high."},{"i":"COS-14XaULs--005","c":"COS","u":"Computer types & classification","s":"mcq","q":"Digital computers represent data using discrete states based on which number system?","o":["Decimal","Binary","Hexadecimal","Octal"],"a":1,"e":"Digital computers represent numbers, letters, and symbols using a code based on the binary number system (1s and 0s)."},{"i":"COS-14XaULs--006","c":"COS","u":"Computer types & classification","s":"mcq","q":"Compared to analog devices, results from digital computers are generally:","o":["Less accurate","More accurate","Identical in accuracy","Impossible to measure"],"a":1,"e":"Generally, results from digital computers are more accurate than results from analog devices."},{"i":"COS-14XaULs--007","c":"COS","u":"Computer types & classification","s":"mcq","q":"A hybrid computer combines which two qualities?","o":["The speed of a digital computer and the memory of an analog computer","The speed of an analog computer and the memory/accuracy of a digital computer","Only analog features","Only digital features"],"a":1,"e":"A hybrid computer has the speed of an analog computer and the memory and accuracy of a digital computer."},{"i":"COS-14XaULs--008","c":"COS","u":"Computer types & classification","s":"mcq","q":"The most powerful type of computer currently available, used for tasks like weather forecasting and nuclear research, is the:","o":["Mainframe","Minicomputer","Supercomputer","Microcomputer"],"a":2,"e":"A supercomputer is the most powerful computer available, used for weather forecasting, climate research, scientific simulation, and nuclear research."},{"i":"COS-14XaULs--009","c":"COS","u":"Computer types & classification","s":"mcq","q":"Mainframe computers are designed to process up to how many web transactions daily?","o":["1 million","1 billion","1 trillion","1 thousand"],"a":2,"e":"Mainframes are data servers designed to process up to 1 trillion web transactions daily with high security and reliability."},{"i":"COS-14XaULs--010","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is NOT a major manufacturer of mainframe computers listed?","o":["IBM","Burroughs","Univac","Apple"],"a":3,"e":"Major mainframe manufacturers listed include IBM, Burroughs, BINAC, CDC Cyber series, and Univac — not Apple."},{"i":"COS-14XaULs--011","c":"COS","u":"Computer types & classification","s":"mcq","q":"A minicomputer is also known as a mid-range computer because it lies between:","o":["Supercomputer and mainframe","Mainframe and microcomputer","Laptop and PDA","Analog and digital computers"],"a":1,"e":"A minicomputer lies between the mainframe and the microcomputer, also called a mid-range computer."},{"i":"COS-14XaULs--012","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is an example of a minicomputer listed in the material?","o":["IBM AS/400e","Apple Macintosh","Altair 8800","Cray-1"],"a":0,"e":"Minicomputer examples given include IBM's AS/400e, Honeywell 200, and TI-990."},{"i":"COS-14XaULs--013","c":"COS","u":"Computer types & classification","s":"mcq","q":"A Personal Digital Assistant (PDA) is characterized by:","o":["A large tower unit","A compact handheld design with touch screen operated by stylus","Being accessible only via terminals","Requiring a dedicated computer room"],"a":1,"e":"PDAs are compact handheld computers with touch screens operated with a stylus, using a virtual keyboard for data entry."},{"i":"COS-14XaULs--014","c":"COS","u":"Computer types & classification","s":"mcq","q":"An electronic organizer is primarily used to:","o":["Process massive scientific simulations","Manage schedules and save data like names, addresses, and meeting dates","Perform mainframe transactions","Act as a supercomputer"],"a":1,"e":"An organizer is an electronic gadget used to manage schedules and save data such as names, addresses, telephone numbers, and meeting dates."},{"i":"COS-14XaULs--015","c":"COS","u":"Computer types & classification","s":"mcq","q":"A computer system as a whole comprises which two essential, interdependent parts?","o":["Input and output only","Hardware and software","Monitor and keyboard only","CPU and RAM only"],"a":1,"e":"A computer system comprises hardware and software; they go hand in hand, and one cannot function without the other."},{"i":"COS-14XaULs--016","c":"COS","u":"Computer types & classification","s":"mcq","q":"A computer system is organized to perform which set of basic functions?","o":["Input, output, storage, communication, processing, control","Only input and output","Only processing and storage","Reading and writing only"],"a":0,"e":"A computer is a system of hardware devices organized to perform: input, output, storage, communication, processing, and control."},{"i":"COS-14XaULs--017","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is an example of hardware found INSIDE a computer?","o":["Keyboard","Motherboard","Mouse","Printer"],"a":1,"e":"The motherboard is internal hardware; keyboard, mouse, and printer are external peripherals connected to the computer."},{"i":"COS-14XaULs--018","c":"COS","u":"Computer types & classification","s":"mcq","q":"Which of these is typically found connected to the OUTSIDE of a computer?","o":["Motherboard","Sound Card","Scanner","RAM"],"a":2,"e":"A scanner is external hardware; motherboard, sound card, and RAM are internal components."},{"i":"COS-14XaULs--019","c":"COS","u":"Input Devices","s":"mcq","q":"A computer keyboard creates specialized electronic codes when a key is pressed. These codes are called:","o":["Bitmaps","Scan codes","Pixels","DPI values"],"a":1,"e":"A keyboard creates specialized electronic codes (scan codes) when a key is pressed, transmitted to the system unit."},{"i":"COS-14XaULs--020","c":"COS","u":"Input Devices","s":"mcq","q":"How many distinct groups of keys does a standard keyboard have?","o":["Three","Four","Five","Six"],"a":2,"e":"Keyboards have five distinct groups: standard typewriter keys, function keys, cursor movement keys, numeric keys, and special purpose keys."},{"i":"COS-14XaULs--021","c":"COS","u":"Input Devices","s":"mcq","q":"The PC/XT keyboard has how many keys, with function keys arranged on the left side?","o":["83","84","101","104"],"a":0,"e":"PC/XT (eXtended Technology) keyboards have 83 keys, with F1-F10 arranged on the left-hand side."},{"i":"COS-14XaULs--022","c":"COS","u":"Input Devices","s":"mcq","q":"The PC/AT keyboard introduced which additional key, not present on the PC/XT?","o":["Win key","Menu key","SysRq (System Request) key","Escape key"],"a":2,"e":"PC/AT (Advanced Technology) keyboards contain 84 keys and introduced the SysRq (System Request) key, along with indicator LEDs."},{"i":"COS-14XaULs--023","c":"COS","u":"Input Devices","s":"mcq","q":"Windows keyboards, containing 104 to 109 keys, added which two keys not found on Enhanced keyboards?","o":["Ctrl and Alt","Win key and Menu key","Shift and Delete","Home and End"],"a":1,"e":"Windows Keyboards added the Win key and Menu key as their distinguishing addition."},{"i":"COS-14XaULs--024","c":"COS","u":"Input Devices","s":"mcq","q":"A wireless keyboard connects to a computer using which technologies?","o":["Only USB cables","Bluetooth, IR technology, or Radio Frequency","Only PS/2 ports","Only serial ports"],"a":1,"e":"Wireless keyboards use Bluetooth, IR technology, or Radio Frequency, requiring a transmitter and trans-receiver."},{"i":"COS-14XaULs--025","c":"COS","u":"Input Devices","s":"mcq","q":"A virtual keyboard, as used on smartphones, is notable because it:","o":["Requires a USB connection","Has no physical object to carry and appears/disappears as needed","Uses magnetic ink","Requires special drivers on every boot"],"a":1,"e":"A virtual keyboard appears when needed and disappears after typing, with no physical object to carry."},{"i":"COS-14XaULs--026","c":"COS","u":"Input Devices","s":"mcq","q":"An ergonomic keyboard is specifically designed to reduce:","o":["Cost of manufacturing","Muscle strain and carpal tunnel syndrome","Number of available keys","Typing speed"],"a":1,"e":"Ergonomic keyboards are designed for users who type with both hands, reducing muscle strain and carpal tunnel syndrome."},{"i":"COS-14XaULs--027","c":"COS","u":"Input Devices","s":"mcq","q":"A gaming keyboard typically features which distinguishing set of keys?","o":["Only numeric keys","W, S, D, A and arrow keys with graphics included","Only function keys F1-F12","Only the SysRq key"],"a":1,"e":"Gaming keyboards have very few keys specific for gamers — W, S, D, A and arrow keys — often with graphics included."},{"i":"COS-14XaULs--028","c":"COS","u":"Input Devices","s":"mcq","q":"Which type of mouse uses a ball on its underside, with sensors detecting the ball's movement direction?","o":["Optical mouse","Mechanical mouse","Optomechanical mouse","Cordless mouse"],"a":1,"e":"A mechanical mouse has a ball on its underside, and sensors detect the direction of ball movement to move the cursor."},{"i":"COS-14XaULs--029","c":"COS","u":"Input Devices","s":"mcq","q":"An optical mouse detects movement using:","o":["A rolling ball","A laser","Magnetic ink","Infrared sensors only"],"a":1,"e":"An optical mouse uses a laser to detect mouse movement, rather than a mechanical ball."},{"i":"COS-14XaULs--030","c":"COS","u":"Input Devices","s":"mcq","q":"Which type of mouse connects through the simplest connection, an RS-232C serial port?","o":["USB Mouse","PS/2 Mouse","Serial Mouse","Cordless Mouse"],"a":2,"e":"A Serial Mouse connects through an RS-232C serial port, described as the simplest of connections."},{"i":"COS-14XaULs--031","c":"COS","u":"Input Devices","s":"mcq","q":"A trackball differs from a standard mouse in that:","o":["It requires moving the entire device","You roll a ball on top of a stationary unit to move the cursor","It only works with laptops","It has no buttons"],"a":1,"e":"With a trackball, you roll a movable ball on top of the stationary unit, rather than moving the whole device like a mouse."},{"i":"COS-14XaULs--032","c":"COS","u":"Input Devices","s":"mcq","q":"A pointing stick is described as a practical substitute for a touchpad, particularly useful when:","o":["A laptop lacks the necessary space","A desktop has excess space","A user needs an external mouse","A keyboard has too many keys"],"a":0,"e":"A pointing stick is a practical substitute for a touchpad if a laptop lacks the necessary space."},{"i":"COS-14XaULs--033","c":"COS","u":"Input Devices","s":"mcq","q":"A light pen's tip contains a:","o":["Magnetic sensor","Photocell","Laser diode","Microphone"],"a":1,"e":"The tip of a light pen has a photocell, used to detect light emanating from the screen to select options."},{"i":"COS-14XaULs--034","c":"COS","u":"Input Devices","s":"mcq","q":"Light pens are most commonly used in which field, besides sports commentary?","o":["Computer-Aided Design (CAD) and graphic design","Banking check processing","Barcode scanning","Audio recording"],"a":0,"e":"The light pen is mostly utilised in computer-aided design (CAD) and graphic design work."},{"i":"COS-14XaULs--035","c":"COS","u":"Input Devices","s":"mcq","q":"Which scanning technology is widely used to read responses in objective-type tests, where students darken circles with a pencil?","o":["OCR","OMR","MICR","ICR"],"a":1,"e":"Optical Mark Recognition (OMR) is widely used to read responses in objective-type tests by detecting darkened marks."},{"i":"COS-14XaULs--036","c":"COS","u":"Input Devices","s":"mcq","q":"OCR (Optical Character Recognition) converts scanned documents into:","o":["Magnetic ink patterns","Modifiable ASCII text","Barcode patterns","Sound waves"],"a":1,"e":"OCR is a technique for scanning documents and identifying the image as modifiable ASCII text using OCR software."},{"i":"COS-14XaULs--037","c":"COS","u":"Input Devices","s":"mcq","q":"MICR (Magnetic Ink Character Recognition) technology is primarily used by banks to:","o":["Scan customer photographs","Process checks by reading magnetic ink encoding numbers","Read barcodes on products","Convert handwriting to text"],"a":1,"e":"Banks use MICR to process checks, recognising the magnetic encoding numbers printed at the bottom of a check."},{"i":"COS-14XaULs--038","c":"COS","u":"Input Devices","s":"mcq","q":"ICR (Ink Character Recognition) technology is specifically designed to recognize:","o":["Barcodes only","Manuscript (handwritten) data","Magnetic ink only","Optical marks only"],"a":1,"e":"ICR technology is used to recognize manuscript data, allowing forms to be entered directly into a computer."},{"i":"COS-14XaULs--039","c":"COS","u":"Input Devices","s":"mcq","q":"Compared to MICR, OCR is generally:","o":["Faster at reading documents","Slower at reading documents","Identical in speed","Only usable for barcodes"],"a":1,"e":"Optical Character Recognition (OCR) cannot read documents as quickly as MICR."},{"i":"COS-14XaULs--040","c":"COS","u":"Input Devices","s":"mcq","q":"A barcode scanner reads barcodes by using:","o":["Magnetic fields","Reflected light","Sound waves","Heat sensors"],"a":1,"e":"Barcode scanners make use of reflected light to read barcodes, deciphering the code from the bars' spacing and thickness."},{"i":"COS-14XaULs--041","c":"COS","u":"Input Devices","s":"mcq","q":"A sound card's primary function regarding audio input is to:","o":["Store video files","Transform analog audio signals from a microphone into digital codes","Print documents","Scan barcodes"],"a":1,"e":"The sound card transforms analog audio signals from the microphone into digital codes the computer can store and use."},{"i":"COS-14XaULs--042","c":"COS","u":"Input Devices","s":"mcq","q":"Speech recognition (voice recognition) is the process of:","o":["Converting written text into spoken words","Turning spoken words into written ones","Encrypting audio files","Compressing video files"],"a":1,"e":"Speech recognition is the process of turning spoken words into written ones."},{"i":"COS-14XaULs--043","c":"COS","u":"Input Devices","s":"mcq","q":"A webcam is a typical example of a:","o":["Audio-input device","Video-input device","Scanning device","Pointing device"],"a":1,"e":"A webcam is a typical video-input device, mounted on top of a screen to capture full-motion video images."},{"i":"COS-14XaULs--044","c":"COS","u":"Output Devices","s":"mcq","q":"The smallest unit on a computer screen, whose density determines image clarity, is called a:","o":["Byte","Pixel","Dot pitch","Frame"],"a":1,"e":"A pixel is the smallest unit on the screen; the density of pixels determines resolution/clarity."},{"i":"COS-14XaULs--045","c":"COS","u":"Output Devices","s":"mcq","q":"A CRT (Cathode Ray Tube) monitor produces images when:","o":["An electron beam strikes a phosphorescent surface","Organic materials emit light directly","Liquid crystals rotate polarized light","LEDs illuminate directly"],"a":0,"e":"A CRT is a vacuum tube in which images are produced when an electron beam strikes a phosphorescent surface."},{"i":"COS-14XaULs--046","c":"COS","u":"Output Devices","s":"mcq","q":"Monochrome monitors, common from the 1960s through the 1980s, display how many colors?","o":["One","Two","Four","Sixteen"],"a":1,"e":"Monochrome monitors have only two colors — one for background and one for the foreground (text)."},{"i":"COS-14XaULs--047","c":"COS","u":"Output Devices","s":"mcq","q":"Color monitors implement which color model, using three phosphors?","o":["CMYK","RGB","HSV","Pantone"],"a":1,"e":"Color monitors implement the RGB color model using red, green, and blue phosphors."},{"i":"COS-14XaULs--048","c":"COS","u":"Output Devices","s":"mcq","q":"CGA (Color Graphics Adapter), the first graphics standard for the IBM PC, supports how many colors?","o":["4","16","256","65,536"],"a":0,"e":"CGA supports 4 colors, with fewer pixels than monochrome, making it harder to read."},{"i":"COS-14XaULs--049","c":"COS","u":"Output Devices","s":"mcq","q":"EGA (Enhanced Graphics Adapter) has a resolution of 640 by 350 pixels and supports how many colors?","o":["4","16","256","1024"],"a":1,"e":"EGA is a video display standard with 640x350 resolution, supporting 16 colors."},{"i":"COS-14XaULs--050","c":"COS","u":"Output Devices","s":"mcq","q":"VGA (Video Graphics Array), at its higher resolution of 640x480, supports how many colors?","o":["4","16","256","65,536"],"a":1,"e":"VGA supports 16 colors at 640x480 resolution, or 256 colors at the lower 320x200 resolution."},{"i":"COS-14XaULs--051","c":"COS","u":"Output Devices","s":"mcq","q":"Super VGA, standardized by VESA, can display up to how many colors?","o":["256","4,096","65,536","Unlimited via RGB blending"],"a":2,"e":"Super VGA is a very high resolution standard that displays up to 65,536 colors."},{"i":"COS-14XaULs--052","c":"COS","u":"Output Devices","s":"mcq","q":"Flat panel displays are preferred for laptops over CRTs primarily because they are:","o":["Cheaper to manufacture only","More compact and consume less power","Heavier and more durable","Compatible only with monochrome"],"a":1,"e":"Portable computers use flat panel displays because they are more compact and consume less power than CRTs."},{"i":"COS-14XaULs--053","c":"COS","u":"Output Devices","s":"mcq","q":"LCD (Liquid Crystal Display) monitors are noted for being, compared to CRTs:","o":["Larger and heavier","Thinner, lighter, and using less electricity","More expensive with worse resolution","Requiring more heat generation"],"a":1,"e":"LCD monitors take up less space, use less electricity, generate less heat, and are thinner/lighter than CRT monitors."},{"i":"COS-14XaULs--054","c":"COS","u":"Output Devices","s":"mcq","q":"LED monitors are popular among gamers primarily because they:","o":["Are cheaper than LCD monitors","Consume less power than LCD monitors while supporting up to 4K resolution","Cannot display high-definition content","Require cathode fluorescent lamps"],"a":1,"e":"LED displays consume less power than LCD monitors and boast up to 4K resolutions, popular for HD gaming."},{"i":"COS-14XaULs--055","c":"COS","u":"Output Devices","s":"mcq","q":"OLED monitors use organic materials to transform electric current into light, and are regarded as excellent for picture quality, but have a drawback of:","o":["Poor contrast levels","Shorter lifespans and higher cost than LCDs/LEDs","Inability to display color","Requiring a CRT tube"],"a":1,"e":"OLED monitors have excellent contrast and clarity but shorter lifespans and higher cost than LCDs and LEDs."},{"i":"COS-14XaULs--056","c":"COS","u":"Output Devices","s":"mcq","q":"A printer's output resolution is expressed using which unit?","o":["Pixels per second","DPI (Dots Per Inch)","Hertz","Bits per inch"],"a":1,"e":"The resolution of printer output is expressed as DPI (Dots per inch)."},{"i":"COS-14XaULs--057","c":"COS","u":"Output Devices","s":"mcq","q":"Impact printers create images by:","o":["Using laser beams on a drum","Making direct contact between ink ribbon and paper","Depositing toner electrostatically","Using organic light-emitting diodes"],"a":1,"e":"Impact printers create immediate contact between the ink ribbon and paper, similar to a typewriter."},{"i":"COS-14XaULs--058","c":"COS","u":"Output Devices","s":"mcq","q":"Dot-matrix printers, a type of impact printer, use print heads with how many possible pin configurations?","o":["2, 4, 6, or 8 pins","7, 9, 18, or 24 pins","100, 200, or 300 pins","Only 1 pin"],"a":1,"e":"Dot matrix printers are available with print heads that have 7, 9, 18, or 24 pins."},{"i":"COS-14XaULs--059","c":"COS","u":"Output Devices","s":"mcq","q":"Non-impact printers rely on which technologies rather than direct contact?","o":["Only mechanical pressure","Xerographic, chemical, electrostatic, or laser technology","Only magnetic ink","Only ultrasonic waves"],"a":1,"e":"Non-impact printers depend upon xerogr M","Control Unit (CU) and Arithmetic Logic Unit (ALU)","Hard disk and optical drive","Primary and secondary memory"],"a":1,"e":"The Control Unit (CU) and Arithmetic Logic Unit (ALU) make up the CPU."},{"i":"COS-17XX6HTN-006","c":"COS","u":"CPU Basics","s":"mcq","q":"Temporary storage spaces within the CPU for data and instructions are called:","o":["Registers","Sectors","Platters","Buffers"],"a":0,"e":"The CPU has a number of registers — temporary storage spaces for data and instructions."},{"i":"COS-17XX6HTN-007","c":"COS","u":"CPU Basics","s":"mcq","q":"Registers are best described as:","o":["Optical storage devices","Groups of flip-flops used to store data within the CPU","External hard drives","Types of ROM chips"],"a":1,"e":"Registers are groups of flip-flops used to store data within the Central Processing Unit."},{"i":"COS-17XX6HTN-008","c":"COS","u":"CPU Basics","s":"mcq","q":"Which of these is NOT listed as an example of a CPU register?","o":["Accumulator (ACC)","Program Counter","Instruction Register","Hard Disk Pointer"],"a":3,"e":"Examples given include Accumulator, Program Counter, Instruction Decoder, Instruction Register, and Stack Pointers — not a 'Hard Disk Pointer'."},{"i":"COS-17XX6HTN-009","c":"COS","u":"CPU Basics","s":"mcq","q":"The Arithmetic and Logic Unit (ALU) is responsible for:","o":["Only storing data permanently","Logical analysis, decision-making, and mathematical calculations","Coordinating input/output devices only","Managing secondary storage"],"a":1,"e":"The ALU performs logical analysis and decision-making in addition to performing mathematical calculations."},{"i":"COS-17XX6HTN-010","c":"COS","u":"CPU Basics","s":"mcq","q":"The Control Unit (CU) functions as the system's:","o":["Permanent storage","Supervisor, coordinating and synchronizing all tasks","Optical reader","External backup device"],"a":1,"e":"The CU serves as the system's supervisor, in charge of coordinating and synchronizing all tasks carried out by the computer system."},{"i":"COS-17XX6HTN-011","c":"COS","u":"Memory","s":"mcq","q":"Computer memory, where data and instructions are stored in digital form, is divided into which two types?","o":["ROM and RAM only","Primary memory and secondary memory","Flash memory and optical memory","Registers and buffers"],"a":1,"e":"A computer system's memory can be divided into Primary memory and Secondary memory."},{"i":"COS-17XX6HTN-012","c":"COS","u":"Memory","s":"mcq","q":"Primary memory is described as:","o":["Permanent and external","Transient, storing data as electronic charges, residing inside the computer","Only usable for backup","A type of optical disk"],"a":1,"e":"Primary memory resides inside the computer system and is transient — data is kept there as electronic charges, erased when the machine turns off."},{"i":"COS-17XX6HTN-013","c":"COS","u":"Memory","s":"mcq","q":"The two categories of primary memory are:","o":["Hard disk and floppy disk","ROM and RAM","CD and DVD","Register and buffer"],"a":1,"e":"The two categories of primary memory are ROM (Read Only Memory) and RAM (Random Access Memory)."},{"i":"COS-17XX6HTN-014","c":"COS","u":"Memory","s":"mcq","q":"Data written into a standard ROM chip:","o":["Can be freely changed at any time","Cannot be changed or removed","Is erased when the power turns off","Requires ultraviolet light to read"],"a":1,"e":"Whatever is written in a ROM chip cannot be changed or removed."},{"i":"COS-17XX6HTN-015","c":"COS","u":"Memory","s":"mcq","q":"PROM (Programmable Read-Only Memory) allows information to be entered:","o":["An unlimited number of times","Only once, and cannot be changed after that","Only with ultraviolet light","Only via a USB connection"],"a":1,"e":"In PROM, information can be entered only once and cannot be changed after that."},{"i":"COS-17XX6HTN-016","c":"COS","u":"Memory","s":"mcq","q":"To write new data into an EPROM chip, it must be:","o":["Connected to a USB port","Withdrawn from the CPU and subjected to ultraviolet rays","Formatted with magnetic tape","Submerged in water"],"a":1,"e":"The EPROM chip must be withdrawn from the CPU and subjected to ultraviolet rays for new data to be written into it."},{"i":"COS-17XX6HTN-017","c":"COS","u":"Memory","s":"mcq","q":"EEPROM differs from EPROM in that it can be updated:","o":["Only by replacing the chip entirely","Repeatedly, without being taken out of the CPU, using electronic pulses","Only using ultraviolet rays","Never, once written"],"a":1,"e":"EEPROM (Electrically Erasable Programmable Read-Only Memory) can be repeatedly updated without removal from the CPU, using specialized electronic pulses."},{"i":"COS-17XX6HTN-018","c":"COS","u":"Memory","s":"mcq","q":"RAM (Random Access Memory) is also referred to as:","o":["Read-only memory","Read/write memory","Non-volatile memory","Optical memory"],"a":1,"e":"RAM is also referred to as read/write memory, since data can be both read from and written onto it."},{"i":"COS-17XX6HTN-019","c":"COS","u":"Memory","s":"mcq","q":"RAM is described as volatile because:","o":["It retains data even after power loss","Any data entered is erased as soon as the computer is turned off","It cannot store any data at all","It only works with optical drives"],"a":1,"e":"RAM is a volatile memory; data entered into it is erased as soon as the computer is turned off."},{"i":"COS-17XX6HTN-020","c":"COS","u":"Memory","s":"mcq","q":"DRAM (Dynamic RAM) needs to be:","o":["Physically removed periodically","Refreshed periodically by the CPU so data isn't lost","Exposed to ultraviolet light regularly","Reformatted daily"],"a":1,"e":"DRAM needs to be refreshed periodically by the CPU so that the data contained in it is not lost."},{"i":"COS-17XX6HTN-021","c":"COS","u":"Memory","s":"mcq","q":"Compared to DRAM, SRAM (Static RAM) is:","o":["Slower and cheaper, requiring no refresh","Faster and costlier, and does not need to be refreshed","Identical in speed and cost","Only usable as secondary storage"],"a":1,"e":"SRAM does not need to be refreshed, has higher speed than DRAM, and is costlier."},{"i":"COS-17XX6HTN-022","c":"COS","u":"Secondary Storage","s":"mcq","q":"Secondary memory is best described as:","o":["Internal, volatile storage","A form of external, permanent storage including hard drives, floppy disks, magnetic tape, and optical disks","Only found inside the CPU","A synonym for RAM"],"a":1,"e":"Secondary memory is a form of external, permanent storage, including hard drives, floppy disks, magnetic tape, and optical disks."},{"i":"COS-17XX6HTN-023","c":"COS","u":"Secondary Storage","s":"mcq","q":"On magnetic tape, the start of the tape is marked with a metal foil known as a:","o":["Marker","Sector label","Platter tag","Track indicator"],"a":0,"e":"The start of the tape is marked with a metal foil known as a marker."},{"i":"COS-17XX6HTN-024","c":"COS","u":"Secondary Storage","s":"mcq","q":"Data on magnetic tape is recorded in parallel across the width of the tape in which format(s)?","o":["Only 4-bit format","7-bit or 9-bit format","Only 16-bit format","32-bit format only"],"a":1,"e":"Data is saved one character at a time, recorded in parallel across the tape's width in either a 7-bit or 9-bit format."},{"i":"COS-17XX6HTN-025","c":"COS","u":"Secondary Storage","s":"mcq","q":"On magnetic tape, records are spaced apart by a gap known as the:","o":["Inter-Record Gap (IRG)","Track Boundary","Sector Divider","Cluster Space"],"a":0,"e":"Records are spaced apart by an inter-record gap (IRG)."},{"i":"COS-17XX6HTN-026","c":"COS","u":"Secondary Storage","s":"mcq","q":"A floppy disk is created using which material?","o":["Aluminum with magnetic coating","Mylar material coated with magnetic oxide","Solid glass","Silicon wafer"],"a":1,"e":"A floppy disk is created using mylar material that has been magnetic oxide-coated."},{"i":"COS-17XX6HTN-027","c":"COS","u":"Secondary Storage","s":"mcq","q":"Floppy disks are round and are typically available in which diameters?","o":["1 or 2 inches","3.5 or 5.25 inches","8 or 12 inches","20 or 25 inches"],"a":1,"e":"The round portions of the flexible floppy disk material are either 3.5 or 5.25 inches in diameter."},{"i":"COS-17XX6HTN-028","c":"COS","u":"Secondary Storage","s":"mcq","q":"Floppy disks get their name from:","o":["Their round shape","The flexible material used in their manufacture","Their storage capacity","Their color"],"a":1,"e":"They are known as floppy disks because of the flexible material used in their manufacture."},{"i":"COS-17XX6HTN-029","c":"COS","u":"Secondary Storage","s":"mcq","q":"The hard disk (or Winchester disk) was first created in which year?","o":["1946","1956","1976","1990"],"a":1,"e":"Magnetic disks, often known as the hard disk or Winchester disk, were first created in 1956."},{"i":"COS-17XX6HTN-030","c":"COS","u":"Secondary Storage","s":"mcq","q":"In a hard disk, information is stored on:","o":["A flexible mylar sheet","A rigid platter or stack of platters with a magnetic surface","Photographic film","A laser-etched glass disc"],"a":1,"e":"In a hard disk, information is stored on a rigid platter or stack of platters with a magnetic surface."},{"i":"COS-17XX6HTN-031","c":"COS","u":"Secondary Storage","s":"mcq","q":"An optical drive reads or writes data on a disc using:","o":["Magnetic fields","A laser or light beam","Electrical pulses only","Mechanical needles"],"a":1,"e":"Optical technology uses a laser or light beam to process information."},{"i":"COS-17XX6HTN-032","c":"COS","u":"Secondary Storage","s":"mcq","q":"Among CD, DVD, and Blu-ray optical discs, which has the LEAST storage capacity?","o":["CD","DVD","Blu-ray","They are all equal"],"a":0,"e":"CDs store the least amount of data; DVDs store more than CDs, and Blu-rays store the most."},{"i":"COS-17XX6HTN-033","c":"COS","u":"Secondary Storage","s":"mcq","q":"A CD-R (CD-Recordable) drive allows data to be written to a disk:","o":["Repeatedly, unlimited times","In just one session, after which the disk is 'closed'","Only via wireless transfer","Only using magnetic tape technology"],"a":1,"e":"A CD-R can put data onto a disk in just one session and then is 'closed' — one 'burn' only, no adding data afterward."},{"i":"COS-17XX6HTN-034","c":"COS","u":"Secondary Storage","s":"mcq","q":"A CD-RW (CD-Rewritable) drive differs from a CD-R in that it:","o":["Can only be written to once","Can be written onto more than once, similar to a floppy or hard disk","Cannot store any data","Uses magnetic rather than optical technology"],"a":1,"e":"A CD-RW drive can be written onto more than once — similar to a floppy or hard disk."},{"i":"COS-17XX6HTN-035","c":"COS","u":"Secondary Storage","s":"mcq","q":"A pen drive is typically connected to a computer via which type of connection?","o":["Serial port","Universal Serial Bus (USB)","PS/2 port","VGA port"],"a":1,"e":"A pen drive is inserted into a Universal Serial Bus (USB) connection to be used."},{"i":"COS-17XX6HTN-036","c":"COS","u":"Secondary Storage","s":"mcq","q":"Flash memory is best described as:","o":["A volatile memory that loses data on power-off","A type of nonvolatile memory with blocks that can be erased and reprogrammed","A form of primary memory only","Only usable for ROM chips"],"a":1,"e":"Flash memory is a type of nonvolatile memory that consists of memory 'blocks' that may be erased and reprogrammed."},{"i":"COS-17XX6HTN-037","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which of these is generally located inside the system unit rather than as portable external media?","o":["Floppy disk","Pen drive","Hard disk drive","CD"],"a":2,"e":"The hard disk drive is normally located inside the system unit, unlike portable floppy disks, pen drives, or CDs."},{"i":"COS-17XX6HTN-038","c":"COS","u":"CPU Basics","s":"mcq","q":"Which statement correctly distinguishes the CPU from the motherboard?","o":["They are the same component with different names","The CPU is a single IC chip located on the motherboard, which connects it to other components","The motherboard is inside the CPU","The CPU stores data permanently while the motherboard processes it"],"a":1,"e":"The CPU is a single IC chip, described as the brain of the PC, located on the motherboard — the rigid card connecting the processor to other components."},{"i":"COS-17XX6HTN-039","c":"COS","u":"CPU Basics","s":"mcq","q":"If a computer needs to perform a mathematical calculation AND make a logical decision, which CPU component handles both?","o":["Control Unit (CU)","Arithmetic and Logic Unit (ALU)","Register bank","Motherboard"],"a":1,"e":"The ALU performs both mathematical calculations and logical analysis/decision-making."},{"i":"COS-17XX6HTN-040","c":"COS","u":"CPU Basics","s":"mcq","q":"Which CPU component would be responsible for coordinating the timing between the ALU and memory during an operation?","o":["Control Unit (CU)","Arithmetic and Logic Unit (ALU)","Pen drive","Optical drive"],"a":0,"e":"The Control Unit acts as the system's supervisor, coordinating and synchronizing all tasks carried out by the computer system."},{"i":"COS-17XX6HTN-041","c":"COS","u":"CPU Basics","s":"mcq","q":"A Program Counter and an Instruction Register are both examples of:","o":["Secondary storage devices","CPU registers","Types of ROM","Optical drives"],"a":1,"e":"Both are examples of registers — groups of flip-flops used to store data within the CPU."},{"i":"COS-17XX6HTN-042","c":"COS","u":"Memory","s":"mcq","q":"Which of these best explains why data is lost from a computer's primary memory when powered off, but not from secondary memory?","o":["Primary memory stores data as electronic charges (transient); secondary memory is external and permanent","Secondary memory is faster","Primary memory is always ROM","There is no actual difference"],"a":0,"e":"Primary memory is transient, storing data as electronic charges that are erased on power-off; secondary memory is external, permanent storage."},{"i":"COS-17XX6HTN-043","c":"COS","u":"Memory","s":"mcq","q":"Ranking ROM variants by how many times their content can be rewritten, from LEAST to MOST rewritable, the correct order is:","o":["EEPROM, EPROM, PROM, ROM","ROM, PROM, EPROM, EEPROM","EPROM, ROM, EEPROM, PROM","PROM, EEPROM, ROM, EPROM"],"a":1,"e":"ROM (never changeable) \u003c PROM (written once) \u003c EPROM (rewritable with UV removal) \u003c EEPROM (rewritable in-place with electronic pulses)."},{"i":"COS-17XX6HTN-044","c":"COS","u":"Memory","s":"mcq","q":"A technician needs to update firmware on a chip WITHOUT removing it from the CPU. Which memory type allows this?","o":["ROM","PROM","EPROM","EEPROM"],"a":3,"e":"EEPROM can be repeatedly updated without being taken out of the CPU, using specialized electronic pulses — unlike EPROM, which requires removal and UV exposure."},{"i":"COS-17XX6HTN-045","c":"COS","u":"Memory","s":"mcq","q":"Which statement correctly compares DRAM and SRAM?","o":["DRAM is faster and costlier; SRAM needs periodic refreshing","SRAM is faster and costlier; DRAM needs periodic refreshing","Both need periodic refreshing equally","Neither requires any refreshing"],"a":1,"e":"SRAM does not need refreshing and is faster/costlier; DRAM needs periodic refreshing by the CPU."},{"i":"COS-17XX6HTN-046","c":"COS","u":"Memory","s":"mcq","q":"Why would a computer's RAM be described as 'volatile' while its ROM is not?","o":["RAM data is erased when power is turned off; ROM data persists","ROM is erased when power is turned off; RAM persists","Both are equally volatile","Volatility only applies to secondary storage"],"a":0,"e":"RAM (volatile) loses data when the computer is turned off, while ROM retains its written data regardless of power state."},{"i":"COS-17XX6HTN-047","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which of these correctly orders optical storage media from LEAST to GREATEST storage capacity?","o":["Blu-ray, DVD, CD","CD, DVD, Blu-ray","DVD, CD, Blu-ray","CD, Blu-ray, DVD"],"a":1,"e":"CDs store the least, DVDs store more than CDs, and Blu-rays store the most."},{"i":"COS-17XX6HTN-048","c":"COS","u":"Secondary Storage","s":"mcq","q":"If you need to record data onto an optical disc multiple times over weeks, adding new files each time, which format should you use?","o":["CD-R","CD-RW","DVD-ROM (factory pressed)","None of these support multiple sessions"],"a":1,"e":"CD-RW can be written onto more than once, similar to a floppy or hard disk, unlike CD-R which allows only one 'burn' session."},{"i":"COS-17XX6HTN-049","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which secondary storage medium uses an Inter-Record Gap (IRG) to space out stored data?","o":["Hard disk","Magnetic tape","Optical disk","Flash memory"],"a":1,"e":"On magnetic tape, records are stored as data and spaced apart by an inter-record gap (IRG)."},{"i":"COS-17XX6HTN-050","c":"COS","u":"Secondary Storage","s":"mcq","q":"Both floppy disks and hard disks store data using which underlying principle?","o":["Optical laser reading","Magnetic surfaces/coating","Electronic charge only","Flash memory blocks"],"a":1,"e":"Floppy disks use magnetic oxide-coated mylar, and hard disks use platters with a magnetic surface — both rely on magnetism."},{"i":"COS-17XX6HTN-051","c":"COS","u":"Secondary Storage","s":"mcq","q":"Why do hard disks typically serve as a computer's primary means of storage rather than floppy disks?","o":["Hard disks are more portable","Hard disks can hold massive amounts of data, holding almost all programs and files","Floppy disks are faster","Hard disks use optical technology"],"a":1,"e":"Because hard disks can hold massive amounts of information, they usually serve as the computer's primary storage, holding almost all programs and files."},{"i":"COS-17XX6HTN-052","c":"COS","u":"Secondary Storage","s":"mcq","q":"A pen drive and a hard disk are both examples of:","o":["Primary memory","Secondary (external/permanent) storage","Types of ROM","CPU registers"],"a":1,"e":"Both are forms of secondary memory — external, permanent storage for computers."},{"i":"COS-17XX6HTN-053","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which is the most accurate way to distinguish CD, DVD, and Blu-ray discs when they all look physically similar?","o":["By their color","By reading the label to determine media type","By their weight","They cannot be distinguished"],"a":1,"e":"All three optical disc types look the same; one must read the label to determine the media type."},{"i":"COS-17XX6HTN-054","c":"COS","u":"CPU Basics","s":"mcq","q":"A Stack Pointer, mentioned as an example of a CPU register, is used to:","o":["Store data temporarily within the CPU as part of its register set","Permanently store the operating system","Read optical discs","Connect external USB devices"],"a":0,"e":"Stack Pointers are listed among CPU registers — temporary storage spaces for data and instructions within the CPU."},{"i":"COS-17XX6HTN-055","c":"COS","u":"Memory","s":"mcq","q":"PROM can be purchased in what state, to later be loaded by the user?","o":["Pre-loaded with a fixed program that cannot be changed","Empty, and subsequently loaded by the user with a program","Already erased using ultraviolet light","Only as read/write memory"],"a":1,"e":"PROM can be purchased empty and subsequently loaded by the user with a program; its contents cannot be changed once loaded."},{"i":"COS-17XX6HTN-056","c":"COS","u":"Secondary Storage","s":"mcq","q":"The pen drive, often abbreviated 'PD' by users, is best described as:","o":["A form of primary memory","A portable storage device that can be quickly transported from one location to another","A type of optical disc","A CPU register"],"a":1,"e":"The term 'pen drive' refers to a portable storage device that may be quickly transported from one location to another."},{"i":"COS-17XX6HTN-057","c":"COS","u":"Secondary Storage","s":"mcq","q":"What is required to get a pen drive working with a computer?","o":["Formatting it with magnetic tape first","Simply inserting it into a USB connection","Exposing it to ultraviolet light","Installing it inside the system unit permanently"],"a":1,"e":"A pen drive is relatively simple to use; all a user needs to do is insert it into a Universal Serial Bus (USB) connection."},{"i":"COS-17XX6HTN-058","c":"COS","u":"Secondary Storage","s":"mcq","q":"Which storage medium described is most associated with being used from 1956 onward for holding large volumes of a computer's programs and files?","o":["Floppy disk","Hard (Winchester) disk","CD-R","Pen drive"],"a":1,"e":"Magnetic disks (hard/Winchester disks) were first created in 1956 and became the primary storage medium for large volumes of data."},{"i":"COS-17XX6HTN-059","c":"COS","u":"Memory","s":"mcq","q":"Which type of memory would be most appropriate for a manufacturer to permanently embed a device's unchanging startup instructions into, at the point of manufacture?","o":["RAM","ROM","DRAM","SRAM"],"a":1,"e":"ROM content cannot be changed or removed once written — appropriate for permanent, unchanging instructions like factory-set startup code."},{"i":"COS-17XX6HTN-060","c":"COS","u":"CPU Basics","s":"mcq","q":"Why are some computer components housed on their own small circuit boards rather than built directly into the motherboard?","o":["So they can plug into expansion slots built into the motherboard, allowing modularity","Because the motherboard cannot hold any circuitry","Because they must be kept away from the CPU entirely","Because expansion slots replace the need for a motherboard"],"a":0,"e":"Some components are housed on their own small circuit boards that plug into expansion slots built into the motherboard, allowing modular upgrades."},{"i":"BIO-1Dec1Q5P-001","c":"BIO","u":"Interrelationships of Organisms","s":"mcq","q":"Which interaction is directly associated with fighting for scarce resources?","o":["Interference competition","Exploitative competition","Apparent competition","Saprophytism"],"a":0},{"i":"BIO-1Dec1Q5P-002","c":"BIO","u":"Interrelationships of Orga
