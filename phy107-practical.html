<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHY 107 Practical | Bablo 100L Hub</title>
<style>
:root{--bg:#eef3f1;--ink:#14262b;--mut:#51666b;--card:#fff;--ln:#c9d7d4;--ac:#0e7c86;--acs:#d9eef0;--wa:#a85d00;--was:#fdf0dc;--ok:#1b7a3d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b1e;--ink:#e6f0ee;--mut:#9bb0b3;--card:#17282c;--ln:#2c4146;--ac:#4fc3cd;--acs:#17393e;--wa:#f0b35a;--was:#3a2b12;--ok:#6fd08f}}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(color-mix(in srgb,var(--ln) 40%,transparent) 1px,transparent 1px) 0 0/100% 28px,var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 40px}
main{max-width:760px;margin:0 auto;padding:14px}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.7rem}h2{font-size:1.25rem}h3{font-size:1.05rem;margin-top:1.1em}
a.back{color:var(--ac);font-size:.9rem;text-decoration:none}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.tabs button{flex:0 0 auto;border:1.5px solid var(--ln);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:.92rem;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:10px 0}
.exp{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border-left:6px solid var(--ac)}
.exp small{color:var(--mut)}
.warn{background:var(--was);color:var(--wa);border-radius:8px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.f{font-family:"Cambria Math",Georgia,serif;font-size:1.05rem;background:var(--acs);padding:8px 12px;border-radius:8px;margin:6px 0;overflow-x:auto}
.f b{display:block;font:600 .8rem system-ui;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--ln);padding:4px;text-align:center}th{background:var(--acs);font-weight:600}
td.o{background:var(--bg);color:var(--mut)}
td input{width:100%;min-width:56px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:center;padding:5px 2px}
.wrap{overflow-x:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.btn{border:1.5px solid var(--ac);background:transparent;color:var(--ac);padding:7px 12px;border-radius:8px;font:inherit;font-size:.9rem;cursor:pointer}
.btn.p{background:var(--ac);color:#fff}
label{font-size:.85rem;color:var(--mut);display:block}
.ctl input[type=text],.ctl input[type=number],.ctl textarea,.ctl select{width:100%;padding:7px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ctl .w{grid-column:1/-1}
.res{background:var(--acs);border-radius:8px;padding:8px 12px;font-weight:600;margin:8px 0}
svg{width:100%;height:auto;background:var(--card);border:1px solid var(--ln);border-radius:8px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph figure{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px;min-width:0}.ph img{width:100%;max-height:65vh;object-fit:contain;object-position:center;border-radius:6px;border:1px solid var(--ln);cursor:zoom-in;background:#fff;filter:contrast(1.12) brightness(1.04) saturate(1.08)}.ph figcaption{line-height:1.4;padding:5px 2px}.img-note{font-size:.9rem;color:var(--mut);margin:.5rem 0}.reading-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.reading-steps>div{padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;overflow:auto;z-index:9;padding:10px}
#lb img{max-width:100%;width:auto;height:auto;max-height:none;display:block;margin:54px auto 12px;object-fit:contain;filter:contrast(1.14) brightness(1.04) saturate(1.08)}#lb.on{display:block}#lb .btn{position:sticky;top:0;z-index:2}
ol,ul{padding-left:1.2em}li{margin:3px 0}

/* Convert embedded manual photos to Blob URLs for reliable rendering in mobile Chrome/WebViews. */
const IMG_URL=Object.fromEntries(Object.entries(IMG).map(([key,src])=>{
  try{
    const comma=src.indexOf(',');
    const mime=(src.slice(0,comma).match(/^data:([^;]+);base64$/)||[])[1]||'image/jpeg';
    const raw=atob(src.slice(comma+1));
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    return [key,URL.createObjectURL(new Blob([bytes],{type:mime}))];
  }catch(err){console.error('PHY107 image preparation failed:',key,err);return [key,src];}
}));

function fit(p,org){const n=p.length;if(n<2)return null;let sx=0,sy=0,sxy=0,sxx=0,syy=0;p.forEach(([x,y])=>{sx+=x;sy+=y;sxy+=x*y;sxx+=x*x;syy+=y*y});let m,c;
if(org){m=sxy/sxx;c=0}else{m=(n*sxy-sx*sy)/(n*sxx-sx*sx);c=(sy-m*sx)/n}
const my=sy/n;let sr=0,st2=0;p.forEach(([x,y])=>{sr+=(y-(m*x+c))**2;st2+=(y-my)**2});return{m,c,r2:st2?1-sr/st2:1}}
function ticks(a,b){const r=b-a||1,s0=r/6,p=10**Math.floor(Math.log10(s0)),k=[1,2,5,10].find(k=>k*p>=s0)*p,t=[];for(let v=Math.ceil(a/k-1e-9)*k;v<=b+1e-9;v+=k)t.push(+v.toFixed(10));return t}

let x0=lo(xs,o.x0),x1=hi(xs,o.x1),y0=lo(ys,o.y0),y1=hi(ys,o.y1);if(x1<=x0)x1=x0+1;if(y1<=y0)y1=y0+1;
const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>H-B-(v-y0)/(y1-y0)*(H-T-B);let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title||'Graph'}"><text x="${W/2}" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">${o.title||''}</text>`;
const tx=ticks(x0,x1),ty=ticks(y0,y1);
if(o.grid!==false){tx.forEach(v=>s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="var(--ln)"/>`);ty.forEach(v=>s+=`<line y1="${Y(v)}" y2="${Y(v)}" x1="${L}" x2="${W-R}" stroke="var(--ln)"/>`)}
s+=`<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="none" stroke="var(--ink)"/>`;
tx.forEach(v=>s+=`<text x="${X(v)}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="currentColor">${v}</text>`);ty.forEach(v=>s+=`<text x="${L-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="currentColor">${v}</text>`);
s+=`<text x="${(L+W-R)/2}" y="${H-12}" font-size="13" text-anchor="middle" fill="currentColor">${o.xl||''}</text><text transform="translate(14 ${(T+H-B)/2}) rotate(-90)" font-size="13" text-anchor="middle" fill="currentColor">${o.yl||''}</text>`;
if(f&&o.line!==false){const a=x0,b=x1,ya=f.m*a+f.c,yb=f.m*b+f.c;s+=`<clipPath id="c"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath><line clip-path="url(#c)" x1="${X(a)}" y1="${Y(ya)}" x2="${X(b)}" y2="${Y(yb)}" stroke="#c0392b" stroke-width="2"/>`;
if(o.tri!==false&&f.m){const xa=Math.min(...xs)+(Math.max(...xs)-Math.min(...xs))*.2,xb=Math.min(...xs)+(Math.max(...xs)-Math.min(...xs))*.85,ya2=f.m*xa+f.c,yb2=f.m*xb+f.c;
s+=`<path d="M${X(xa)} ${Y(ya2)}H${X(xb)}V${Y(yb2)}" fill="none" stroke="var(--ok)" stroke-dasharray="5 4" stroke-width="1.6"/><text x="${(X(xa)+X(xb))/2}" y="${Y(ya2)+14}" font-size="11" text-anchor="middle" fill="var(--ok)">Δx = ${fn(xb-xa,2)}</text><text x="${X(xb)+4}" y="${(Y(ya2)+Y(yb2))/2}" font-size="11" fill="var(--ok)">Δy = ${fn(yb2-ya2,3)}</text>`}}

function labView(v){const c=lab,pts=()=>c.txt.split('\n').map(l=>l.split(/[\s,;]+/).map(num)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1])).map(a=>[a[0],a[1]]);
v.innerHTML=`<h2>Graph Lab</h2><div class="card ctl"><div class="w"><label>Load an experiment's data</label><select id="ld"><option value="">Choose…</option>${E.map(e=>`<option value="${e.id}">Exp ${e.no}: ${e.name}</option>`).join('')}</select></div><div class="w"><label>Your data: one "x, y" pair per line</label><textarea id="txt" rows="6" inputmode="decimal">${c.txt}</textarea></div>
<div><label>Title</label><input type="text" data-l="title" value="${c.title}"></div><div><label>X label</label><input type="text" data-l="xl" value="${c.xl}"></div><div><label>Y label</label><input type="text" data-l="yl" value="${c.yl}"></div>
<div><label>X min</label><input type="number" step="any" data-l="x0" value="${c.x0}" placeholder="auto"></div><div><label>X max</label><input type="number" step="any" data-l="x1" value="${c.x1}" placeholder="auto"></div><div><label>Y min</label><input type="number" step="any" data-l="y0" value="${c.y0}" placeholder="auto"></div><div><label>Y max</label><input type="number" step="any" data-l="y1" value="${c.y1}" placeholder="auto"></div>

function draw(){const c=lab,p=c.txt.split('\n').map(l=>l.split(/[\s,;]+/).map(num)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1])).map(a=>[a[0],a[1]]);$('#gr').innerHTML=plot(p,{title:c.title,xl:c.xl,yl:c.yl,x0:num(c.x0),x1:num(c.x1),y0:num(c.y0),y1:num(c.y1),org:c.org,grid:c.grid,tri:c.tri,line:c.line})}
document.addEventListener('click',ev=>{const t=ev.target.closest('button,img');if(!t)return;const d=t.dataset;
if(d.k){cur={t:d.k,e:null,sub:'Notes'}}else if(d.e){cur.e=d.e;cur.sub='Notes'}else if(d.home){cur.e=null}else if(d.sub){cur.sub=d.sub}
else if(d.z){const z=$('#lbi');z.onerror=()=>{if(!z.dataset.fallback){z.dataset.fallback='1';z.src=IMG[d.z]}else{z.alt='Image unavailable; close the viewer and refresh the page.'}};z.dataset.fallback='';z.src=IMG_URL[d.z];$('#lb').classList.add('on');$('#lb').scrollTop=0;return}else if(t.id==='lbx'){$('#lb').classList.remove('on');return}
else if(d.add){const e=E.find(x=>x.id===cur.e),s=st(e);s.rows.push(e.inp.map(()=>NaN));save()}
else if(d.del){const e=E.find(x=>x.id===cur.e);st(e).rows.splice(+d.del,1);save()}
else if(d.reset){const e=E.find(x=>x.id===cur.e);delete S[e.id];save()}
else if(d.lab){const e=E.find(x=>x.id===d.lab),D=data(e);lab.txt=D.p.filter(q=>isFinite(q[0])&&isFinite(q[1])).map(q=>q.map(v=>+(+v).toFixed(4)).join(', ')).join('\n');lab.xl=e.ax[0];lab.yl=e.ax[1];lab.title=`Graph of ${e.ax[1]} against ${e.ax[0]}`;cur={t:'lab',e:null,sub:'Notes'}}
else if(d.cleargraph){lab={...lab,title:'',x0:'',x1:'',y0:'',y1:'',org:false,grid:true,tri:true,line:true}}
else return;render()});
document.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;
if(d.r!==undefined){const e=E.find(x=>x.id===cur.e);st(e).rows[+d.r][+d.c]=num(t.value);save();const D=data(e),tr=t.closest('tr'),o=tr.querySelectorAll('td.o');D.d[+d.r].forEach((v,i)=>o[i].textContent=fn(v,3))}
else if(d.x){const e=E.find(x=>x.id===cur.e);st(e).x[d.x]=num(t.value);save();const D=data(e),trs=document.querySelectorAll('tr');trs.forEach((tr,i)=>{if(i>0&&D.d[i-1]){const o=tr.querySelectorAll('td.o');D.d[i-1].forEach((v,j)=>o[j].textContent=fn(v,3))}})}
else if(t.id==='txt'){lab.txt=t.value;draw()}else if(d.l){lab[d.l]=t.value;draw()}else if(d.b){lab[d.b]=t.checked;draw()}
else if(d.g){lab[d.g]=t.value;const e=E.find(x=>x.id===cur.e);if(e&&cur.sub==='Graph'){const D=data(e),v=$('#expgraph');if(v)v.innerHTML=plot(D.p.filter(q=>isFinite(q[0])&&isFinite(q[1])),{title:lab.title||`Graph of ${e.ax[1]} against ${e.ax[0]}`,xl:lab.xl||e.ax[0],yl:lab.yl||e.ax[1],x0:num(lab.x0),x1:num(lab.x1),y0:num(lab.y0),y1:num(lab.y1),org:lab.org,grid:lab.grid,tri:lab.tri,line:lab.line})}}
else if(d.gb){lab[d.gb]=t.checked;const e=E.find(x=>x.id===cur.e);if(e&&cur.sub==='Graph'){const D=data(e),v=$('#expgraph');if(v)v.innerHTML=plot(D.p.filter(q=>isFinite(q[0])&&isFinite(q[1])),{title:lab.title||`Graph of ${e.ax[1]} against ${e.ax[0]}`,xl:lab.xl||e.ax[0],yl:lab.yl||e.ax[1],x0:num(lab.x0),x1:num(lab.x1),y0:num(lab.y0),y1:num(lab.y1),org:lab.org,grid:lab.grid,tri:lab.tri,line:lab.line})}}});
document.addEventListener('change',ev=>{if(ev.target.id==='ld'&&ev.target.value){const e=E.find(x=>x.id===ev.target.value),D=data(e);lab.txt=D.p.filter(q=>isFinite(q[0])&&isFinite(q[1])).map(q=>q.map(v=>+(+v).toFixed(4)).join(', ')).join('\n');lab.xl=e.ax[0];lab.yl=e.ax[1];lab.title=`Graph of ${e.ax[1]} against ${e.ax[0]}`;render()}});
$('#lb').addEventListener('click',()=>$('#lb').classList.remove('on'));
render();
