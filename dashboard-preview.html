<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Bablo Hub™ — Dashboard Preview</title>
<style>
:root{color-scheme:dark;--bg:#080808;--card:#111;--line:#343434;--text:#fff;--muted:#d1d1d1;--gold:#f4c542;--gold2:#ffe58a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#49340b 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#ffe58a,#b77a00);display:grid;place-items:center;color:#111;font-size:25px;font-weight:900;box-shadow:0 0 25px #e9b62b44}.brand h1{font-size:23px;margin:0;letter-spacing:-.7px}.brand p{margin:0;color:var(--muted);font-size:12px}.avatar{border:1px solid var(--gold);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-weight:800}.welcome{border:1px solid var(--gold);border-radius:20px;padding:23px;background:linear-gradient(110deg,#191407,#0e0e0e 60%,#251a04);box-shadow:inset 0 0 35px #d49b1c18;margin-bottom:22px}.eyebrow{color:var(--gold2);font-size:11px;letter-spacing:2px;font-weight:900}.welcome h2{font-size:clamp(24px,5vw,34px);margin:7px 0}.welcome p{margin:0;color:#f1f1f1}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:25px 2px 12px}.sectionhead h3{margin:0;font-size:18px}.sectionhead span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:112px;text-align:left;padding:17px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#171717,#0d0d0d);color:var(--text);display:flex;align-items:center;gap:14px;position:relative;cursor:pointer;transition:.18s}.tile:hover,.tile:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:2px solid #f4c54255}.icon{width:48px;height:48px;flex:0 0 48px;border-radius:14px;background:#2a210e;color:var(--gold2);display:grid;place-items:center;font-size:25px}.tile strong{display:block;font-size:16px;margin-bottom:3px}.tile small{display:block;color:var(--muted);font-size:12px}.arrow{margin-left:auto;color:#fff;font-size:22px}.tag{position:absolute;right:12px;top:10px;background:var(--gold);color:#111;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:900}.featured{border-color:var(--gold);box-shadow:0 0 18px #f4c54220}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#101010;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;color:var(--gold2);font-size:22px}.stat span{font-size:11px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#080808f2;backdrop-filter:blur(14px);border-top:1px solid #383838;display:flex;justify-content:center;gap:min(12vw,100px);padding:12px 10px calc(12px + env(safe-area-inset-bottom));z-index:3}.bottom button{background:none;border:0;color:#eee;font:inherit;font-size:12px}.bottom button b{display:block;font-size:19px;color:var(--gold2)}.modalback{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:5}.modal{width:min(460px,100%);background:#101010;border:1px solid var(--gold);border-radius:20px;padding:22px;box-shadow:0 20px 80px #000}.modal h2{margin-top:0}.modal p{color:#ddd}.modal button{background:#f4c542;color:#111;border:0;border-radius:10px;padding:11px 15px;font-weight:800;margin:5px 5px 0 0}.modal .ghost{background:#222;color:white;border:1px solid #555}.coming{color:var(--gold2)!important}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{min-height:125px}.wrap{padding-top:30px}}
@media(max-width:380px){.tile{padding:13px;gap:10px}.icon{width:40px;height:40px;flex-basis:40px;font-size:21px}.tile strong{font-size:14px}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand"><div class="logo">B</div><div><h1>Bablo Hub™</h1><p>Confidence in Clarity</p></div></div><div class="avatar">B</div></header>
<section class="welcome"><div class="eyebrow">YOUR ACADEMIC HOME</div><h2>Good day, Bablu.</h2><p>Learn with clarity. Compete with purpose. Keep progressing.</p></section>
<div class="sectionhead"><h3>Explore Bablo Hub</h3><span>Everything in one place</span></div>
<section class="grid" aria-label="Main features">
<button class="tile" data-title="Courses" data-desc="Your course library: notes, flashcards, questions and quizzes."><span class="icon">📚</span><span><strong>Courses</strong><small>Notes · Flashcards · QBank</small></span><span class="arrow">›</span></button>
<button class="tile" data-title="Practicals" data-desc="Practical guides, procedures, lab resources and experiment support."><span class="icon">🧪</span><span><strong>Practicals</strong><small>Lab resources & procedures</small></span><span class="arrow">›</span></button>
<button class="tile" data-title="Programme Cup" data-desc="Enter the Programme Cup competition hub."><span class="icon">🏆</span><span><strong>Programme Cup</strong><small>Compete · Excel</small></span><span class="arrow">›</span></button>
<button class="tile" data-title="Socials" data-desc="Community posts, updates and student conversations."><span class="icon">👥</span><span><strong>Socials</strong><small>Connect · Share · Engage</small></span><span class="arrow">›</span></button>
<button class="tile" data-title="Leaderboard" data-desc="See rankings and track competition performance."><span class="icon">🥇</span><span><strong>Leaderboard</strong><small>See where you stand</small></span><span class="arrow">›</span></button>
<button class="tile featured" data-title="Challenge Arena" data-desc="Create an open challenge, create a private challenge, or discover open challenges. No Friends section."><span class="icon">⚔️</span><span><strong>Challenge Arena</strong><small>Create & join quiz battles</small></span><span class="arrow">›</span></button>
<button class="tile" data-title="Arcade — Coming Soon" data-desc="A future games space. Chess will be featured here alongside other games."><span class="icon">🎮</span><span><strong>Arcade</strong><small class="coming">Coming soon · Chess & more</small></span><span class="tag">SOON</span><span class="arrow">›</span></button>
<button class="tile" data-title="CGPA" data-desc="Calculate and track your cumulative grade point average."><span class="icon">📈</span><span><strong>CGPA</strong><small>Calculate & track your CGPA</small></span><span class="arrow">›</span></button>
</section>
<div class="sectionhead"><h3>Your progress</h3><span>Preview values</span></div><section class="stats"><div class="stat"><b>—</b><span>Courses accessed</span></div><div class="stat"><b>—</b><span>Quizzes completed</span></div><div class="stat"><b>—</b><span>Challenges won</span></div></section>
</main><nav class="bottom"><button><b>⌂</b>Home</button><button><b>◷</b>Time</button><button><b>♜</b>Board</button><button><b>☰</b>More</button></nav>
<div class="modalback" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="eyebrow">BABLO HUB™</div><h2 id="modalTitle"></h2><p id="modalDesc"></p><div id="modalActions"></div><button class="ghost" id="close">Close preview</button></div></div>
<script>
const back=document.getElementById('backdrop'),title=document.getElementById('modalTitle'),desc=document.getElementById('modalDesc'),actions=document.getElementById('modalActions');
document.querySelectorAll('.tile').forEach(tile=>tile.addEventListener('click',()=>{title.textContent=tile.dataset.title;desc.textContent=tile.dataset.desc;actions.innerHTML='';if(tile.dataset.title==='Challenge Arena'){[['Create Open Challenge','Anyone can discover and join.'],['Create Private Challenge','Invite a specific username.'],['Find Open Challenges','Browse public rooms.']].forEach(([label,info])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{desc.textContent=info+' The full challenge flow will be connected in the app rebuild.';actions.innerHTML='';};actions.append(b)})}back.style.display='grid'}));
document.getElementById('close').onclick=()=>back.style.display='none';back.addEventListener('click',e=>{if(e.target===back)back.style.display='none'});document.addEventListener('keydown',e=>{if(e.key==='Escape')back.style.display='none'});
</script></body></html>
