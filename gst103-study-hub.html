MODS[1]={t:"Data & Information",
notes:`<h2>Module 1: The Concept of Data and Information</h2>
<h3>Information literacy (IL)</h3>
<ul><li><b>Gilster (1997):</b> ability to understand and use information in multiple formats from many sources when presented via computer/electronic networks.</li>
<li><b>Hinchliffe &amp; Woodard (2001):</b> ability to recognize when information is needed, and to locate, evaluate and use it effectively.</li>
<li><b>Ojedokun (2007):</b> an intellectual framework for identifying, finding, understanding, evaluating and using information; prerequisite for lifelong learning.</li>
<li>Different from general literacy (reading and writing). It encompasses tools, information-resource, social-structural, research, publishing, emerging-technology and critical-thinking literacy.</li>
<li><b>ACRL (2000):</b> IL forms the basis of lifelong learning, is common to all disciplines/levels, and makes learners self-directed.</li></ul>
<h3>Data, information, knowledge, communication</h3>
<ul><li><b>Data:</b> raw facts, figures, symbols; "recorded symbols" (Hayes, 1992). No meaning until processed.</li>
<li><b>Information:</b> processed data that aids decision-making (Ojedokun: facts, ideas, creative works logically interrelated and communicated/recorded in any format).</li>
<li>Example: data 2,2 → process 2×2 → information 4.</li>
<li><b>Knowledge:</b> a person's range of information.</li>
<li><b>Communication:</b> interactive process of exchanging information. Communication = process; information = product.</li>
<li>Chain: <b>Data → Information → Knowledge → Communication</b>.</li></ul>
<h3>Qualities: CART</h3><p><b>C</b>urrent, <b>A</b>ccurate, <b>R</b>elevant, <b>T</b>imely.</p>
<h3>Characteristics: FASO</h3>
<table><tr><th>Type</th><th>Meaning</th><th>Examples</th></tr>
<tr><td>Factual</td><td>A fact, no explanation needed</td><td>Encyclopedias, dictionaries, atlases, almanacs</td></tr>
<tr><td>Analytical</td><td>Interpretation, analysis, criticism</td><td>Scholarly journals, theses, statistical digests</td></tr>
<tr><td>Subjective</td><td>One opinion / viewpoint</td><td>Blogs, social media, editorials, book reviews</td></tr>
<tr><td>Objective</td><td>Unbiased, balanced, multiple viewpoints</td><td>Journal articles, library databases</td></tr></table>
<h3>Sources of information</h3>
<table><tr><th>Level</th><th>Features</th><th>Examples</th></tr>
<tr><td>Primary</td><td>Original, uninterpreted, first appearance</td><td>Theses, manuscripts, diaries, interviews, photographs, autobiographies</td></tr>
<tr><td>Secondary</td><td>Repackage, interpret, evaluate primary</td><td>Reviews, encyclopedias, yearbooks, handbooks, manuals, directories</td></tr>
<tr><td>Tertiary</td><td>Compile/distil; point to primary &amp; secondary</td><td>Abstracts, indexes, bibliographies, catalogues</td></tr></table>
<h3>Types of information (by presentation)</h3>
<ul><li><b>Oral</b> – interviews, conversations, eyewitness accounts, radio/TV.</li><li><b>Textual</b> – books, journals, reports, fiction, poetry.</li><li><b>Bibliographic</b> – citations ("pointers": author, date, source).</li><li><b>Numeric</b> – numbers/statistics (e.g. Annual Abstract of Statistics).</li><li><b>Graphical</b> – pictures, maps, charts, diagrams, 3-D models.</li><li><b>Audio</b> and <b>Multimedia</b> (convergence of text, numbers, graphics, audio, video).</li></ul>
<h3>Formats</h3>
<ul><li><b>Print:</b> newspapers, magazines, textbooks, pamphlets, dictionaries, indexes.</li><li><b>Electronic:</b> databases, online catalogue, CD-ROM, audio/video tapes.</li><li><b>Micro:</b> microfilm (reel of 16/35mm film) and microfiche (flat sheet of images); used for preservation.</li></ul>
<h3>Bowen University Library materials</h3>
<table><tr><th>Material</th><th>Code</th><th>Borrow?</th></tr>
<tr><td>Textbooks</td><td>BK</td><td>Yes (or use within)</td></tr>
<tr><td>Periodicals / serials</td><td>P</td><td>No</td></tr>
<tr><td>Pamphlets (≤ 50 pages)</td><td>PH, call mark PAM</td><td>No</td></tr>
<tr><td>Special collections (govt, WHO, FAO, CTA)</td><td>GP, call no. BDSC</td><td>No</td></tr>
<tr><td>Reference materials</td><td>R, call mark Ref</td><td>No</td></tr>
<tr><td>Students' projects (closed access)</td><td>TH</td><td>No</td></tr>
<tr><td>Multimedia / non-print</td><td>MM</td><td>Use in multimedia room</td></tr></table>
<h3>Periodical types</h3>
<ul><li><b>Scholarly journals:</b> experts, abstract, references, peer-reviewed, little advertising, plain cover.</li><li><b>Trade periodicals:</b> industry news, adverts, illustrations, not peer-reviewed (e.g. Aviation Week).</li><li><b>Popular magazines:</b> glossy, general readers (Ebony, Newsweek).</li><li><b>Newspapers:</b> daily news, adverts, photos (The Punch, The Guardian).</li></ul>
<h3>Reference sources</h3><p>Authoritative, consulted for specific answers (not read cover to cover), cannot be borrowed. Examples: atlases, dictionaries, encyclopedias, almanacs, handbooks, gazetteers, yearbooks, directories.</p>
<h3>Databases</h3><p>Bibliographic (records only, e.g. OPAC), full-text (e.g. Springer Link), directory, numeric, multimedia.</p>
<h3>IL vs IT</h3><p><b>IL:</b> recognize need, locate, evaluate, use information; content and communication. <b>IT:</b> skills to use computers; hardware, software, databases.</p>`,

MODS[2]={t:"Organization of Information",
notes:`<h2>Module 2: Organization of Information</h2>
<h3>Information organization</h3>
<p>An intellectual process of arranging, grouping or classifying information items (books, journals, pictures) by common characteristic (subject) into a system that enhances speedy access and retrieval.</p>
<h3>Why organize?</h3>
<ul><li>"We organize because we need to retrieve."</li><li>Organized information can be used more than once, identified, accessed and retrieved easily, and benefits others.</li>
<li>Examples of organized sources: telephone books, directories, dictionaries, encyclopedias, bibliographies, indexes, catalogues, databases.</li>
<li>Information must be published (reviews, catalogues, books in print, periodicals, websites) to be known and organized.</li></ul>
<h3>Information repositories</h3><p>Libraries, archives, museums and documentation centres keep records for future use.</p>
<h3>The library</h3>
<ul><li>An institution responsible for the collection, processing and storage of recorded knowledge for reading, study and reference.</li>
<li><b>Functions:</b> acquisition, organization, storage, dissemination.</li>
<li><b>Types:</b> national, public, private, special, school, academic.</li>
<li><b>Roles:</b> custodial, education, research, information, recreation.</li></ul>
<h3>Library rules</h3><ul><li>Silence, comportment, decorum; no food or drinks; dress code observed.</li><li>Register before borrowing; no bags in reading rooms; items properly charged out; return items intact and on time.</li></ul>
<h3>Using the book</h3><p>Do not mutilate, fold along the spine/dog-ear, mark or underline, tear or stain library items.</p>
<h3>Services in Bowen University Library</h3>
<ul><li>Binding services</li><li>Reference services: referral, quick reference, directional reference, inter-library loan, document delivery, Current Awareness Service (CAS), Selective Dissemination of Information (SDI), database and literature searches</li><li>Reprographic services</li><li>Research assistance</li><li>User education / library orientation</li></ul>
<h3>Classification (subject content)</h3>
<p>A classification scheme is a library tool for arranging materials into subjects. Most common: Library of Congress (LC) and Dewey Decimal Classification (DDC).</p>
<table><tr><th>Scheme</th><th>Key points</th></tr>
<tr><td>DDC</td><td>Ten main classes with subdivisions; Arabic numerals and decimal points; not sufficient for large collections, so used by small libraries.</td></tr>
<tr><td>LC</td><td>Most popular in academic libraries; room for expansion; used by Bowen University Library; mixed (alpha-numeric) notation; single capital letter for broad class, numbers 1–9999 for subdivisions.</td></tr>
<tr><td>Moys</td><td>Used for LAW materials in BUL; designed by Elizabeth (Betty) Moys, first published 1968; fits into LC libraries because LC's K class (Law) was not fully developed then.</td></tr></table>
<h3>LC call number example</h3>
<p>HB172.5 .F72 2001 → <b>H</b> = Social Sciences; <b>HB</b> = Economics; <b>172.5</b> = Principles of Micro Economics; <b>.F72</b> = author cutter number (Frank); <b>2001</b> = year.<br><b>Class mark:</b> HB172.5. <b>Call mark:</b> HB172.5 .F72 2001. Books are shelved by call mark.</p>
<p>Cutter number = first three letters of author's surname (or title for edited works) converted to letter + numbers, e.g. Soyinka → S69.</p>
<h3>Physical organization</h3><p>By format and purpose: print (books, pamphlets, maps, periodicals) vs non-print (audio, video, cassettes, CD-ROMs, microfilm/microfiche), which are kept in a separate section.</p>`,

MODS[3]={t:"Information Access Tools & Web Searching",
notes:`<h2>Module 3: Information Access/Retrieval Tools and Web Searching</h2>
<h3>Information access tools</h3>
<p>Finding aids (print or electronic) that help draw out stored information; they contain references to sources. Categories: <b>abstracts, indexes, bibliographies, library catalogues, web search tools</b>.</p>
<table><tr><th>Tool</th><th>Key points</th></tr>
<tr><td>Abstract</td><td>Brief synopsis of the main points; helps decide whether to read the full paper; written last but appears first; e.g. Biological Abstracts, Chemical Abstract, Dissertation Abstract.</td></tr>
<tr><td>Index</td><td>Points to the location of information; does not give the information itself. Back-of-book index, periodical index (e.g. Education Index, Humanities Index).</td></tr>
<tr><td>Bibliography</td><td>List of books/articles on a topic with author, title, date, publisher, pagination; may be annotated.</td></tr>
<tr><td>Library catalogue</td><td>Database of all resources in library; card, book or computerized (OPAC); arranged by author, title, subject.</td></tr></table>
<h3>OPAC (Online Public Access Catalogue)</h3>
<ul><li>Online bibliographic database of all print and electronic resources; basic and advanced search.</li>
<li><b>Access points:</b> author, title, keyword, journal, ISSN/ISBN, call number (also subject, date).</li>
<li><b>Keyword:</b> retrieves largest number of results (searches all indexes).</li>
<li><b>Author:</b> last name first (e.g. Chinodya Shimmer).</li>
<li><b>Subject:</b> controlled keyword (subject headings).</li></ul>
<h3>Web search tools</h3>
<ul><li><b>Browser:</b> program to locate, display and view websites (Firefox, Chrome, Internet Explorer, Opera). User enters a URL.</li>
<li><b>Search engine:</b> compares your entry against its database and returns hits. Advantages: broad, current, relevance ranking. Disadvantages: millions of hits, no quality control, outdated/dead links.</li>
<li><b>Library gateway:</b> single access point to evaluated subject-based internet resources built by experts/humans (e.g. Internet Public Library, Infomine, WorldWideScience.org). Covers relatively few materials.</li>
<li><b>Portal:</b> main entry point to a field; at least four services: search engine, e-mail, links to related sites, personalized content (e.g. AOL, iGoogle, HINARI).</li>
<li><b>Web directory:</b> human-edited subject classification of websites (Yahoo, Open Directory). Use broadest terms; smaller than search engines.</li>
<li><b>Specialized databases:</b> subject-specific (e.g. ERIC).</li></ul>
<h3>Search strategy &amp; Boolean logic</h3>
<ul><li><b>AND</b> narrows (all words). <b>OR</b> expands (synonyms, either word). <b>NOT</b> excludes unwanted records.</li>
<li>Plus (+) ≈ AND, minus (−) ≈ NOT, no space after sign.</li>
<li>Quotation marks for exact phrases (not around a single word).</li>
<li>Truncation/wildcard (*): comp* → computer, computing.</li>
<li>Use lower case; CAPS for Boolean operators; most important keywords first.</li>
<li>Use 3–6 keywords, nouns, specific terms, synonyms via OR, avoid common words and stop words.</li>
<li>Example: "eating disorder" AND (bulimia OR anorexia).</li></ul>
<h3>Pitfalls</h3><p>Misspelling, redundant terms, ignoring alternate spellings (color OR colour), complicated Boolean construction, unbalanced parentheses.</p>
<h3>Evaluating information sources</h3>
<p>Criteria: suitability (scope, audience, timeliness), authority/reliability, citations/documentation, objectivity/accuracy, primary vs secondary research, writing style, currency (web: update within six months), uniqueness, content, links, searching. Criteria are complementary.</p>
<h3>E-learning</h3>
<ul><li>Learning through the Internet and multimedia. <b>Synchronous</b> (real time) vs <b>asynchronous</b> (self-paced).</li>
<li>Examples: Khan Academy, Coursera, W3Schools, TedEd, Codecademy, Open Culture.</li>
<li>Benefits: saves time, cost effective, 24/7 learning, tracking, flexible.</li></ul>
<h3>AI literacy</h3>
<ul><li>Ability to understand what AI is, how it works, and its impact. IL = find, evaluate, use information; AI literacy = understand, use and critically evaluate AI systems and outputs.</li>
<li><b>Tools:</b> Grammarly, ChatGPT, Perplexity AI, Wolfram Alpha, Quizlet, Duolingo, Socratic, Otter.ai, Scite, Scholarcy, Turnitin, etc.</li>
<li><b>Disadvantages:</b> data bias, lack of transparency, misinformation, over-reliance, privacy concerns.</li>
<li><b>Ethics:</b> bias, privacy, academic integrity, misuse, over-dependence, accountability, intellectual property.</li></ul>`,

MODS[4]={t:"Legal Issues of Information Use",
notes:`<h2>Module 4: Legal Issues of Information Use</h2>
<h3>Intellectual property (IP)</h3>
<ul><li>Legal rights resulting from intellectual activity in industrial, scientific, literary and artistic fields; creations of the mind (WIPO).</li>
<li><b>IPR</b> give creators exclusive rights over their creations for a specified period.</li>
<li>Two branches: <b>industrial property</b> and <b>copyright</b>.</li>
<li>Laws exist to protect moral and economic rights of creators, promote creativity and dissemination, and encourage fair trading.</li></ul>
<h3>Copyright</h3>
<ul><li>Right giving authors exclusivity to reproduce, distribute, perform, display or license their work (Gregory, 2000).</li>
<li>Two purposes (Okwilagwe): encourage creative people to produce works and provide incentives for effective dissemination.</li>
<li>Protects published and unpublished works fixed in a tangible form.</li></ul>
<h3>Copyright law in Nigeria</h3>
<ul><li>Copyright Act, Chapter 68, Laws of the Federation of Nigeria 1990; amended by Copyright Decree No. 47 of 1998.</li>
<li><b>Five categories (section 1):</b> literary, musical, artistic works, cinematograph films, sound recordings.</li>
<li><b>Eligibility:</b> must be original and fixed in a definite medium. <b>No registration required</b>; copyright is automatic.</li>
<li>Exclusive rights include reproduction, publication, public performance, translation, film/record, distribution (rental, lease, hire, loan), broadcast, adaptation.</li>
<li><b>Owner:</b> the creator, but an employer owns it if the work was created in employment; <b>moral rights</b> always belong to the author.</li></ul>
<h3>International coverage</h3>
<ul><li>No single international copyright law. Treaties: <b>Berne Convention</b> and <b>Universal Copyright Convention (UCC)</b>; over 120 countries including Nigeria.</li>
<li>Berne minimum term: life of author + 70 years (literary, musical, dramatic); cinematographic 50 years; photographic 25 years.</li>
<li>Copyright statement: "© 2008" – year of creation.</li></ul>
<h3>Fair use</h3>
<ul><li>Limits the exclusive rights: reviews, criticism, comment, news reporting, teaching, scholarship, research.</li>
<li><b>Factors:</b> (a) purpose/character (commercial vs non-profit educational), (b) nature of the work, (c) amount used, (d) effect on market value.</li>
<li>Up to about 300 words may be cited with acknowledgment (varies by country).</li>
<li>Copying an entire work for classroom distribution requires a licence.</li></ul>
<h3>Violations</h3>
<table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Reprography</td><td>Photocopying; major way of infringing copyright</td></tr>
<tr><td>Piracy</td><td>Unauthorized copying for commercial purposes and dealing in copies</td></tr>
<tr><td>Counterfeiting</td><td>Reproducing fake copies of an author's work for commercial purposes</td></tr>
<tr><td>Plagiarism</td><td>Using someone's ideas/words and passing them off as your own; credit not given where due</td></tr></table>
<p><b>Plagiarism examples:</b> copying verbatim without reference; block text without quotation marks; paraphrasing without reference; a lecturer publishing someone's work under his own name.</p>
<p><b>Exceptions (Nigeria):</b> research or private study; criticism/review/reporting current events with acknowledgment; judicial proceedings; reasonable extract with acknowledgment. Section 20 sets penalties.</p>
<h3>Citation</h3>
<ul><li>An <b>acknowledgement</b> and a <b>signpost</b> (Ojedokun, 2007).</li>
<li>Reasons: credit originators, track sources, trace idea development, improve credibility, guide further reading, honesty, avoid plagiarism.</li>
<li>Cite: quotes, paraphrases, summaries, data, charts, pictures, websites, films; published and unpublished works.</li>
<li><b>Elements:</b> author(s), title, publication information (place, date, publisher, pages).</li>
<li><b>In-text:</b> (Jude, 2003); two authors: (Aduke and Tiamiyu, 2005); 3–5 authors: first citation list all, later first author + et al.</li>
<li><b>Reference list:</b> only sources actually cited. <b>Footnote:</b> numbered note at page bottom; endnote at end.</li></ul>
<h3>Styles</h3>
<table><tr><th>Style</th><th>Used in</th><th>Features</th></tr>
<tr><td>APA</td><td>Social sciences</td><td>Author-date in text; Reference page; e.g. Ojedokun, A.A. (2007). Title. Place: Publisher.</td></tr>
<tr><td>MLA</td><td>Arts and humanities</td><td>Author-page (Smith 395); Works Cited page; year at end of entry.</td></tr>
<tr><td>Harvard</td><td>Physical/natural sciences; now social sciences too</td><td>Author-date; flexible, simple, clear; year after author without brackets: Ojedokun, A.A. 2007, Title, Publisher, Place.</td></tr></table>
<p>Others: AMA, CBE, ACS, Turabian (Chicago). <b>Reference management tools:</b> Mendeley, Zotero, EndNote Web.</p>`,

MODS[5]={t:"Information Problem-Solving (Big Six)",
notes:`<h2>Module 5: Information Problem-Solving</h2>
<p>Information problem solving means thinking about and finding answers to a problem, using six steps known as the <b>Big Six</b>.</p>
<table><tr><th>#</th><th>Step</th><th>What you do</th></tr>
<tr><td>1</td><td>Definition of the problem (task definition)</td><td>Understand the task, identify keywords, find their meanings, ask what information, how much, what type is needed.</td></tr>
<tr><td>2</td><td>Information seeking strategies</td><td>Brainstorm and identify all possible sources, then select the best.</td></tr>
<tr><td>3</td><td>Location and access</td><td>Find the sources and the information within them (bibliographies, indexes, abstracts, catalogues, keyword searches).</td></tr>
<tr><td>4</td><td>Use of information</td><td>Read, extract relevant information, summarize in own words, paraphrase/quote, record citations.</td></tr>
<tr><td>5</td><td>Synthesis</td><td>Organize, outline and bring all information together into a finished product; include references; choose communication means.</td></tr>
<tr><td>6</td><td>Evaluation</td><td>Judge the outcome (effectiveness) and the process (efficiency) against aims and objectives.</td></tr></table>
<h3>1. Defining the problem</h3>
<ul><li>Example topic: "prevalent heart attack among middle-age men in Nigeria". Keywords: <i>heart attack, middle-age men, Nigeria</i>.</li>
<li>Use dictionaries, encyclopedias, web, textbooks to understand keywords.</li>
<li>Ask: What information do I need? How much? What type (facts, opinion, graphics, charts, maps)?</li>
<li>Questions: What causes heart attack? Why prevalent among middle-age men in Nigeria?</li></ul>
<h3>2. Information seeking strategies</h3>
<ul><li><b>Reference librarian:</b> expert help.</li><li><b>Encyclopedia:</b> overview and factual background; measure credibility of other sources.</li>
<li><b>Magazines/newspapers:</b> current information, more credible than some websites.</li>
<li><b>Journals:</b> latest research.</li><li><b>World Wide Web:</b> frequently updated; start with a subject directory; use identified keywords.</li></ul>
<h3>3. Location and access</h3><p>Ask "Where can I find the sources?" Use bibliographies, indexes, abstracts and library catalogues; use keywords for online resources.</p>
<h3>4. Use of information</h3><p>Not all information found is relevant. Understand, extract relevant facts, summarize in own words, determine usefulness, and keep accurate records of citation for future users.</p>
<h3>5. Synthesis</h3><ul><li>Organize information so it fits together.</li><li>Sort logically; prepare an outline so all necessary parts are covered.</li><li>Include correct references.</li><li>Choose how to communicate: speech, research paper, video tape, drama.</li></ul>
<h3>6. Evaluation</h3><p>Judge the outcome of the research effort against aims and objectives. It takes place throughout the work: review every step from defining the problem to synthesis to ensure content is appropriate for the original task and properly organized.</p>
<h3>Why it matters</h3><p>The Big Six applies to assignments as well as everyday information problems and builds confidence in solving information-related problems.</p>`,

const $=s=>document.querySelector(s);
let m=1,tab='notes';
const tabs=[['notes','Notes'],['cards','Flashcards'],['quiz','Quiz (60)']];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function nav(){
 $('#mods').innerHTML=Object.keys(MODS).map(k=>`<button class="chip ${k==m?'on':''}" onclick="m=${k};render()">Module ${k}: ${MODS[k].t}</button>`).join('');
 $('#tabs').innerHTML=tabs.map(t=>`<button class="tab ${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
}
let fc={i:0,deck:[],flip:false,known:{}};
let qz=null;
function render(){nav();window.scrollTo(0,0);
 if(tab==='notes')$('#view').innerHTML='<div class="panel">'+MODS[m].notes+'</div>';
 else if(tab==='cards'){fc.deck=MODS[m].cards.map((c,i)=>i);fc.i=0;fc.flip=false;fc.known={};cards()}
 else{qz={q:shuffle(MODS[m].quiz).map(r=>({q:r[0],a:r[1],o:shuffle(r.slice(1))})),i:0,s:0,w:[],done:false};quiz()}
}
function cards(){
 const d=fc.deck;
 if(!d.length){$('#view').innerHTML='<div class="panel"><p class="score">All cards known 🎉</p><button class="btn" onclick="render()">Restart deck</button></div>';return}
 const c=MODS[m].cards[d[fc.i]];
 $('#view').innerHTML=`<div class="mute">Card ${fc.i+1} of ${d.length} · tap card to flip</div>
 <div class="fc ${fc.flip?'flip':''}" onclick="fc.flip=!fc.flip;cards()"><div class="fci"><div class="face">${esc(c[0])}</div><div class="face back">${esc(c[1])}</div></div></div>
 <div class="row"><button class="btn ghost" onclick="fcMove(-1)">← Prev</button><button class="btn ghost" onclick="fcMove(1)">Next →</button>
 <button class="btn ghost" onclick="fcKnow()">✓ Got it (remove)</button><button class="btn ghost" onclick="fc.deck=shuffle(fc.deck);fc.i=0;fc.flip=false;cards()">Shuffle</button></div>`;
}
function fcMove(n){fc.i=(fc.i+n+fc.deck.length)%fc.deck.length;fc.flip=false;cards()}
function fcKnow(){fc.deck.splice(fc.i,1);if(fc.i>=fc.deck.length)fc.i=0;fc.flip=false;cards()}
function quiz(){
 const x=qz,n=x.q.length;
 if(x.i>=n){
  $('#view').innerHTML=`<div class="panel"><div class="score">${x.s} / ${n}</div><p>${Math.round(x.s/n*100)}% correct</p>
  <div class="row"><button class="btn" onclick="render()">New attempt</button></div>
  ${x.w.length?'<h3>Review your mistakes</h3>'+x.w.map(w=>`<div class="rev">${esc(w.q)}<br><b>Your answer:</b> ${esc(w.y)}<br><span style="color:var(--ok)"><b>Correct:</b> ${esc(w.a)}</span></div>`).join(''):'<p>Perfect score!</p>'}</div>`;return}
 const q=x.q[x.i];
 $('#view').innerHTML=`<div class="panel"><div class="mute">Question ${x.i+1} of ${n} · Score ${x.s}</div><div class="bar"><i style="width:${x.i/n*100}%"></i></div>
 <div class="q">${esc(q.q)}</div>${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${esc(o)}</button>`).join('')}<div id="nx"></div></div>`;
}
function pick(k){
 const x=qz,q=x.q[x.i],opts=[...document.querySelectorAll('.opt')];
 opts.forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add('ok')});
 if(q.o[k]===q.a)x.s++;else{opts[k].classList.add('bad');x.w.push({q:q.q,y:q.o[k],a:q.a})}
 $('#nx').innerHTML=`<div class="row"><button class="btn" onclick="qz.i++;quiz()">${x.i+1>=x.q.length?'See results':'Next →'}</button></div>`;
}
render();
</script></body></html>
