name: Chess client contract tests

on:
  push:
    branches:
      - chess-redesign/phase-1-foundation
    paths:
      - "chess-api-client.js"
      - "chess-api-client.test.js"
      - ".github/workflows/chess-client-check.yml"
  pull_request:
    paths:
      - "chess-api-client.js"
      - "chess-api-client.test.js"
      - ".github/workflows/chess-client-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-contract:
    name: Chess API client contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run client contract tests
        run: node --experimental-default-type=module --test chess-api-client.test.js
